<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Моряка Jump</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101a35}
body{min-height:100vh;min-height:100dvh;padding:12px 0;display:flex;justify-content:center;align-items:center;overflow:auto;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}
#gameStage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#game{display:block;width:min(600px,94vw,calc((100dvh - 75px)*2/3));height:auto;aspect-ratio:2/3;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
#gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;gap:0;background:#101a35}
#gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-width:none;max-height:none;border-radius:0}
#fullscreenButton{width:52px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;font:28px Arial,sans-serif;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#gameStage:fullscreen #fullscreenButton{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10}
#touchControls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.touchButton{width:72px;height:72px;border:2px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,255,255,.18);color:white;font:bold 34px Arial,sans-serif;pointer-events:auto;touch-action:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.touchButton:active{background:rgba(255,255,255,.35)}
@media(hover:hover) and (pointer:fine){#touchControls{display:none}}
/* Мобильные улучшения: десктопные стили не меняются */
@media (max-width: 600px) and (pointer: coarse) {
    body {
        padding: 4px 0;
    }

    #gameStage {
        gap: 8px;
    }

    #game {
        width: min(96vw, calc((100dvh - 90px) * 2 / 3));
        border-radius: 12px;
    }

    #touchControls {
        bottom: max(12px, env(safe-area-inset-bottom));
        padding: 0 16px;
    }

    .touchButton {
        width: 78px;
        height: 78px;
        font-size: 36px;
        background: rgba(20, 35, 60, .48);
        box-shadow: 0 4px 18px rgba(0, 0, 0, .25);
    }

    .touchButton:active {
        background: rgba(40, 170, 190, .65);
        transform: scale(.95);
    }

    #fullscreenButton {
        width: 48px;
        height: 42px;
    }
}
</style>
</head>
<body>
<div id="gameStage">
<canvas id="game" width="1600" height="2400" aria-label="Игра Моряка Jump"></canvas>
<button id="fullscreenButton" type="button" aria-label="Включить полноэкранный режим">⛶</button>
</div>
<div id="touchControls" aria-label="Управление">
<button class="touchButton" id="leftButton" aria-label="Влево">←</button>
<button class="touchButton" id="rightButton" aria-label="Вправо">→</button>
</div>
<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const RENDER_SCALE = 4;
ctx.scale(RENDER_SCALE, RENDER_SCALE);
const gameStage=document.getElementById('gameStage');
const fullscreenButton=document.getElementById('fullscreenButton');
const STATE={MENU:0,PLAYING:1,PAUSE:2,GAMEOVER:3};
let currentState=STATE.MENU,lastFrameTime=0;

const CHARACTER_SCORES=[0,15000,22500,30000,37500,45000,52500,60000,67500,75000];
const characterImages=Array.from({length:10},(_,i)=>{const image=new Image();image.src=`${i+1}.jpg`;return image});

function readStoredNumber(key,fallback=0){
    try{const value=Number(localStorage.getItem(key));return Number.isFinite(value)&&value>=0?value:fallback}
    catch{return fallback}
}
let bankCoins=readStoredNumber('morjakaBankCoins');
let highScore=readStoredNumber('doodleHighScore');
function getUnlockedCharacters(score){return CHARACTER_SCORES.map((required,index)=>({required,index})).filter(item=>score>=item.required).map(item=>item.index)}
let unlockedCharacters=getUnlockedCharacters(highScore);
let selectedCharacter=readStoredNumber('morjakaSelectedCharacter');
if(!Number.isInteger(selectedCharacter)||selectedCharacter<0||selectedCharacter>9||!unlockedCharacters.includes(selectedCharacter))selectedCharacter=0;

function saveProgress(){
    try{
        localStorage.setItem('morjakaBankCoins',String(bankCoins));
        localStorage.setItem('morjakaUnlockedCharacters',JSON.stringify(unlockedCharacters));
        localStorage.setItem('morjakaSelectedCharacter',String(selectedCharacter));
        localStorage.setItem('doodleHighScore',String(highScore));
    }catch(error){console.warn('Не удалось сохранить прогресс:',error)}
}

let player={x:185,y:500,vx:0,dy:0,score:0};
let platforms=[],springs=[],coins=[],lives=0,nextLifeScore=10000,doubleJumpAvailable=false,runCoins=0;
let menuMessage='',menuMessageUntil=0,menuButtonDown=false;
const keys={};
const currentTheme={bg:'#d8f6ff',plat:'#38cdb4'};

function resetGame(){
    player={x:185,y:500,vx:0,dy:0,score:0};
    platforms=[{x:120,y:550,w:160,h:15,type:'static'}];
    springs=[];coins=[];lives=0;nextLifeScore=10000;doubleJumpAvailable=false;runCoins=0;
    for(let i=0;i<7;i++)platforms.push(spawnPlatform(500-i*100));
}
function startGame(){resetGame();lastFrameTime=0;currentState=STATE.PLAYING}
function spawnPlatform(y){
    const level=Math.floor(player.score/5000),brokenChance=Math.min(.4,.15+level*.05),movingChance=Math.min(.4,.15+level*.05);
    const rand=Math.random(),type=rand<brokenChance?'broken':rand<brokenChance+movingChance?'moving':'static';
    const width=70*Math.max(.7,2-level*.25);
    const platform={x:Math.random()*(400-width),y,w:width,h:15,type,dir:2*Math.min(10,1+Math.floor(player.score/2500)*.2)};
    if(type==='static'&&Math.random()>.7)springs.push({x:platform.x+platform.w/2-10,y:y-15});
    if(Math.random()>.92)coins.push({x:platform.x+platform.w/2,y:y-25,r:8});
    if(Math.random()>.985)platform.life={x:platform.x+platform.w/2-10,y:y-35};
    return platform;
}

window.addEventListener('keydown',event=>{
    keys[event.code]=true;
    if((event.code==='ArrowUp'||event.code==='KeyW'||event.code==='Space')&&currentState===STATE.PLAYING&&doubleJumpAvailable){
        event.preventDefault();player.dy=-15;doubleJumpAvailable=false;
    }
    if(currentState===STATE.MENU){
        if(event.code==='Enter'||event.code==='Space')startGame();
    }else if(currentState===STATE.GAMEOVER){
        startGame();
    }else if(currentState===STATE.PLAYING&&event.code==='Escape'){
        currentState=STATE.PAUSE;lastFrameTime=0;
    }else if(currentState===STATE.PAUSE&&event.code==='Escape'){
        currentState=STATE.PLAYING;lastFrameTime=0;
    }
});
window.addEventListener('keyup',event=>{keys[event.code]=false});
window.addEventListener('blur',()=>{keys.ArrowLeft=false;keys.ArrowRight=false;keys.KeyA=false;keys.KeyD=false});

function setMenuMessage(text){menuMessage=text;menuMessageUntil=performance.now()+2200}
function canvasPoint(event){
    const rect = canvas.getBoundingClientRect();
    return {
        x: (event.clientX - rect.left) * 400 / rect.width,
        y: (event.clientY - rect.top) * 600 / rect.height
    };
}
function getCharacterCardRects(){
    const result = [];
    const cardW = 62, cardH = 91, startX = 30, startY = 243;

    for(let i = 0; i < 10; i++){
        const row = Math.floor(i / 5);
        const col = i % 5;
        result.push({
            x: startX + col * 70,
            y: startY + row * 99,
            w: cardW,
            h: cardH
        });
    }

    return result;
}
function handleMenuPointer(point){
    if(currentState!==STATE.MENU)return;
    for(let i=0;i<10;i++){
        const r=getCharacterCardRects()[i];
        if(point.x<r.x||point.x>r.x+r.w||point.y<r.y||point.y>r.y+r.h)continue;
        if(unlockedCharacters.includes(i)){selectedCharacter=i;saveProgress();setMenuMessage(`Выбран персонаж ${i+1}`)}
        else setMenuMessage(`Нужен рекорд ${CHARACTER_SCORES[i]} — осталось ${Math.max(0,CHARACTER_SCORES[i]-highScore)}`);
        return;
    }
    if(point.x>=104&&point.x<=296&&point.y>=524&&point.y<=580)startGame();
}
canvas.addEventListener('pointerdown',event=>{
		document.addEventListener('pointerdown', event => {
			if (currentState === STATE.PAUSE) {
				currentState = STATE.PLAYING;
				lastFrameTime = 0;
				event.stopPropagation();
			} else if (currentState === STATE.GAMEOVER) {
				startGame();
				event.stopPropagation();
			}
		}, true);    
	const point=canvasPoint(event);
    if(currentState===STATE.MENU){
        handleMenuPointer(point);menuButtonDown=point.x>=104&&point.x<=296&&point.y>=524&&point.y<=580;event.preventDefault();return;
    }
    if(currentState===STATE.GAMEOVER){
        if(point.x>=85&&point.x<=315&&point.y>=395&&point.y<=455)currentState=STATE.MENU;
        event.preventDefault();return;
    }
    if(currentState===STATE.PLAYING&&point.x>350&&point.y>550){currentState=STATE.PAUSE;lastFrameTime=0;event.preventDefault()}
});
canvas.addEventListener('pointerup',event=>{
    if(currentState===STATE.MENU&&menuButtonDown){
        const point=canvasPoint(event);
        if(point.x>=104&&point.x<=296&&point.y>=524&&point.y<=580)startGame();
    }
    menuButtonDown=false;
});
canvas.addEventListener('pointercancel',()=>{menuButtonDown=false});

function bindTouchButton(id,keyCode){
    const button=document.getElementById(id);
    const press=event=>{event.preventDefault();keys[keyCode]=true;if(button.setPointerCapture&&event.pointerId!==undefined)button.setPointerCapture(event.pointerId)};
    const release=event=>{event.preventDefault();keys[keyCode]=false};
    button.addEventListener('pointerdown',press);button.addEventListener('pointerup',release);button.addEventListener('pointercancel',release);
    button.addEventListener('lostpointercapture',()=>{keys[keyCode]=false});
}
bindTouchButton('leftButton','ArrowLeft');bindTouchButton('rightButton','ArrowRight');

function update(dt){
    if(currentState!==STATE.PLAYING)return;
    dt=Math.min(dt,2);
    if(keys.ArrowLeft||keys.KeyA)player.vx-=1.2*dt;
    if(keys.ArrowRight||keys.KeyD)player.vx+=1.2*dt;
    player.vx*=Math.pow(.85,dt);player.x+=player.vx*dt;
    player.dy+=.5464*dt;player.y+=player.dy*dt;
    if(player.x<-30)player.x=400;if(player.x>400)player.x=-30;

    platforms.forEach(platform=>{
        if(platform.type==='broken'&&platform.breaking&&player.dy<0&&player.y+35<=platform.y)platform.removeAfterBounce=true;
        if(player.dy>0&&!platform.breaking&&player.x+25>platform.x&&player.x+10<platform.x+platform.w&&player.y+35>platform.y&&player.y+35<platform.y+platform.h+player.dy){
            player.y=platform.y-35;player.dy=-12.98;doubleJumpAvailable=true;if(platform.type==='broken')platform.breaking=true;
        }
        if(platform.type==='moving'){
            platform.x+=platform.dir*dt;
            if(platform.x<=0||platform.x+platform.w>=400){platform.x=Math.max(0,Math.min(400-platform.w,platform.x));platform.dir*=-1}
        }
    });
    platforms=platforms.filter(platform=>!platform.removeAfterBounce);
    springs.forEach(spring=>{
        if(player.dy>0&&player.x+25>spring.x&&player.x<spring.x+20&&player.y+35>spring.y&&player.y+35<spring.y+20){player.dy=-32;doubleJumpAvailable=true}
    });
    for(let i=coins.length-1;i>=0;i--){
        const coin=coins[i];
        if(player.x<coin.x+20&&player.x+30>coin.x&&player.y<coin.y+20&&player.y+30>coin.y){
            runCoins++;bankCoins++;if(runCoins%10===0)lives++;saveProgress();coins.splice(i,1);
        }
    }
    platforms.forEach(platform=>{
        if(!platform.life)return;
        const life=platform.life;
        if(player.x<life.x+20&&player.x+30>life.x&&player.y<life.y+20&&player.y+30>life.y){lives++;platform.life=null}
    });
    if(player.y<250){
        const diff=250-player.y;player.score+=diff;
        while(player.score>=nextLifeScore){lives++;nextLifeScore+=10000}
        player.y=250;platforms.forEach(platform=>platform.y+=diff);springs.forEach(spring=>spring.y+=diff);coins.forEach(coin=>coin.y+=diff);
    }
    platforms=platforms.filter(platform=>platform.y<650);springs=springs.filter(spring=>spring.y<650);coins=coins.filter(coin=>coin.y<650);
    while(platforms.length<8){const lastY=platforms.length?Math.min(...platforms.map(platform=>platform.y)):550;platforms.push(spawnPlatform(lastY-100))}
    if(player.y>600&&lives>0){lives--;player.y=500;player.dy=-8.5;doubleJumpAvailable=true}
    else if(player.y>600){
        currentState=STATE.GAMEOVER;
        const finalScore=Math.floor(player.score);
        if(finalScore>highScore){
            highScore=finalScore;unlockedCharacters=getUnlockedCharacters(highScore);
            if(!unlockedCharacters.includes(selectedCharacter))selectedCharacter=0;
            saveProgress();
        }
    }
}

function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawBackground(){
    const gradient=ctx.createLinearGradient(0,0,0,600);
    gradient.addColorStop(0,'#b7f4ff');gradient.addColorStop(.55,'#e8f8ff');gradient.addColorStop(1,'#d7eaff');
    ctx.fillStyle=gradient;ctx.fillRect(0,0,400,600);
    ctx.fillStyle='rgba(255,255,255,.34)';ctx.beginPath();
    ctx.arc(55,100,42,0,Math.PI*2);ctx.arc(76,95,30,0,Math.PI*2);ctx.arc(320,180,55,0,Math.PI*2);ctx.arc(345,170,37,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';
    for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(210,430+i*34,260,15,0,0,Math.PI*2);ctx.fill()}
}
function drawGlassPanel(x,y,w,h,r=22){
    ctx.save();ctx.shadowColor='rgba(18,70,110,.14)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;
    roundedRect(x,y,w,h,r);ctx.fillStyle='rgba(255,255,255,.48)';ctx.fill();ctx.restore();
    ctx.save();roundedRect(x,y,w,h,r);ctx.fillStyle='rgba(255,255,255,.19)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
}
function drawCharacterImage(index,x,y,w,h,locked=false){
    const image=characterImages[index];ctx.save();roundedRect(x,y,w,h,11);ctx.clip();
    ctx.fillStyle='rgba(30,120,170,.16)';ctx.fillRect(x,y,w,h);
    if(image.complete&&image.naturalWidth>0){
        const scale=Math.max(w/image.naturalWidth,h/image.naturalHeight),sw=image.naturalWidth*scale,sh=image.naturalHeight*scale;
        ctx.drawImage(image,x+(w-sw)/2,y+(h-sh)/2,sw,sh);
    }else{
        const colors=['#ffcf77','#ff8fa3','#8de3db','#9ca9ff','#f4a6e8'];
        ctx.fillStyle=colors[index%colors.length];ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,255,.86)';
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 22px Arial';ctx.fillText(String(index+1),x+w/2,y+h/2);
    }
    if(locked){ctx.fillStyle='rgba(12,25,52,.56)';ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(255,255,255,.94)';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',x+w/2,y+h/2-8)}
    ctx.restore();
}
function drawMenu(){
    drawBackground();
    const glow=ctx.createRadialGradient(200,100,10,200,100,250);glow.addColorStop(0,'rgba(255,255,255,.45)');glow.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=glow;ctx.fillRect(0,0,400,330);drawGlassPanel(18,17,364,566,30);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=16;
    ctx.fillStyle='#174b72';ctx.font='bold 28px Arial';ctx.fillText('Моряка',200,53);ctx.fillStyle='#087fbe';ctx.font='bold 39px Arial';ctx.fillText('JUMP',200,91);ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.84)';roundedRect(113,112,174,32,16);ctx.fill();
    ctx.fillStyle='#155576';ctx.font='bold 14px Arial';ctx.fillText(`🏆 Рекорд: ${highScore}`,200,128);
    drawCharacterImage(selectedCharacter,174,151,52,58,false);
    ctx.fillStyle='#154c68';ctx.font='bold 13px Arial';ctx.fillText(`Выбран: ${selectedCharacter+1}`,200,222);
    ctx.fillStyle='#155576';ctx.font='bold 13px Arial';ctx.fillText('ВЫБЕРИ ПЕРСОНАЖА',200,235);
    getCharacterCardRects().forEach((rect,index)=>{
        const unlocked=unlockedCharacters.includes(index),selected=selectedCharacter===index;
        drawGlassPanel(rect.x,rect.y,rect.w,rect.h,13);drawCharacterImage(index,rect.x+5,rect.y+5,rect.w-10,55,!unlocked);
        ctx.textAlign='center';ctx.textBaseline='middle';
        if(unlocked){ctx.font='bold 11px Arial';ctx.fillStyle=selected?'#087f62':'#23516a';ctx.fillText(selected?'ВЫБРАН':'ОТКРЫТ',rect.x+rect.w/2,rect.y+69)}
        else{ctx.font='bold 9px Arial';ctx.fillStyle='#865100';ctx.fillText(`${CHARACTER_SCORES[index]} очков`,rect.x+rect.w/2,rect.y+69)}
        if(selected){ctx.save();roundedRect(rect.x-1,rect.y-1,rect.w+2,rect.h+2,14);ctx.strokeStyle='#10a981';ctx.lineWidth=3;ctx.stroke();ctx.restore()}
    });
    ctx.save();const gradient=ctx.createLinearGradient(100,524,300,580);gradient.addColorStop(0,'rgba(32,210,170,.92)');gradient.addColorStop(1,'rgba(26,145,220,.92)');
    roundedRect(104,524,192,56,19);ctx.fillStyle=gradient;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ИГРАТЬ',200,552);ctx.restore();
    if(performance.now()<menuMessageUntil&&menuMessage){
        ctx.save();ctx.fillStyle='rgba(20,43,70,.86)';roundedRect(45,480,310,34,13);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(menuMessage,200,497);ctx.restore();
    }
    ctx.fillStyle='#42677b';ctx.font='11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Персонажи открываются за лучший результат',200,594);
}
function drawPlatform(p){
    if(p.type==='broken'){
        const wood=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);wood.addColorStop(0,p.breaking?'#ff9b7a':'#ff6b5e');wood.addColorStop(1,p.breaking?'#b83b3b':'#d94141');
        ctx.fillStyle=wood;ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=5;ctx.shadowOffsetY=3;roundedRect(p.x,p.y,p.w,p.h,5);ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
        ctx.strokeStyle='rgba(120,35,35,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x+5,p.y+5);ctx.lineTo(p.x+p.w-5,p.y+5);ctx.moveTo(p.x+8,p.y+11);ctx.lineTo(p.x+p.w-8,p.y+11);ctx.stroke();
        ctx.strokeStyle='#702b2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w*.35,p.y);ctx.lineTo(p.x+p.w*.42,p.y+5);ctx.lineTo(p.x+p.w*.37,p.y+9);ctx.lineTo(p.x+p.w*.48,p.y+15);ctx.stroke();
    }else{
        ctx.fillStyle=p.type==='moving'?'#4d96ff':currentTheme.plat;ctx.shadowColor='rgba(0,0,0,.22)';ctx.shadowBlur=6;ctx.shadowOffsetY=3;roundedRect(p.x,p.y,p.w,p.h,7);ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    }
    if(p.life){ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(p.life.x+8,p.life.y+8,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',p.life.x+8,p.life.y+8)}
}
function drawSpring(s){
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(s.x+10,s.y+16,11,3,0,0,Math.PI*2);ctx.fill();
    const base=ctx.createLinearGradient(s.x,s.y+11,s.x,s.y+16);base.addColorStop(0,'#48566a');base.addColorStop(1,'#202a38');ctx.fillStyle=base;roundedRect(s.x+1,s.y+11,18,5,2);ctx.fill();
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#34495e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(s.x+4,s.y+11);ctx.lineTo(s.x+7,s.y+8);ctx.lineTo(s.x+13,s.y+8);ctx.lineTo(s.x+16,s.y+5);ctx.lineTo(s.x+13,s.y+2);ctx.lineTo(s.x+7,s.y+2);ctx.stroke();
    ctx.strokeStyle='#d9f2ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(s.x+4,s.y+10);ctx.lineTo(s.x+7,s.y+8);ctx.lineTo(s.x+13,s.y+8);ctx.lineTo(s.x+16,s.y+5);ctx.stroke();
    const top=ctx.createLinearGradient(s.x,s.y-2,s.x,s.y+3);top.addColorStop(0,'#ffb1a8');top.addColorStop(.45,'#ff5548');top.addColorStop(1,'#b9272e');ctx.fillStyle=top;roundedRect(s.x+2,s.y-2,16,5,2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.65)';roundedRect(s.x+4,s.y-1,5,1.5,1);ctx.fill();
}
function drawCoin(c){
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(c.x+1,c.y+c.r+3,c.r*.8,3,0,0,Math.PI*2);ctx.fill();
    const rim=ctx.createRadialGradient(c.x-3,c.y-4,1,c.x,c.y,c.r+2);rim.addColorStop(0,'#fff4a3');rim.addColorStop(.65,'#ffc928');rim.addColorStop(1,'#d88900');ctx.fillStyle=rim;ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
    const face=ctx.createLinearGradient(c.x-c.r,c.y,c.x+c.r,c.y);face.addColorStop(0,'#f5a900');face.addColorStop(.45,'#ffe66d');face.addColorStop(1,'#ffbd18');ctx.fillStyle=face;ctx.beginPath();ctx.arc(c.x,c.y,c.r*.72,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d88900';ctx.font=`bold ${c.r+3}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',c.x,c.y+1);ctx.textAlign='start';ctx.textBaseline='alphabetic';
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(c.x-3,c.y-4,2,3.5,-.5,0,Math.PI*2);ctx.fill();
}
function drawPlayer(){
    const x = player.x - 5;
    const y = player.y - 8;
    const size = 40;
    const cx = x + size / 2;
    const cy = y + size / 2;
    const radius = size / 2;
    const image = characterImages[selectedCharacter];

    ctx.save();

    // Мягкая круглая тень.
    ctx.shadowColor = 'rgba(0, 12, 30, .55)';
    ctx.shadowBlur = 9;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, radius - 1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(12, 27, 48, .9)';
    ctx.fill();

    // Картинка персонажа, обрезанная по кругу.
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius - 3, 0, Math.PI * 2);
    ctx.clip();

    if(image && image.complete && image.naturalWidth > 0){
        // Масштабируем квадратное изображение так, чтобы заполнить круг.
        const imageSize = size - 6;
        ctx.drawImage(image, x + 3, y + 3, imageSize, imageSize);
    }else{
        const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
        gradient.addColorStop(0, '#ffcf77');
        gradient.addColorStop(1, '#e63946');
        ctx.fillStyle = gradient;
        ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
    }

    // Стеклянный блик на верхней части мяча.
    const shine = ctx.createLinearGradient(x, y + 3, x, y + size * .65);
    shine.addColorStop(0, 'rgba(255,255,255,.42)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.fillRect(x + 3, y + 3, size - 6, size * .62);
    ctx.restore();

    // Тёмная обводка и холодный стеклянный контур.
    ctx.beginPath();
    ctx.arc(cx, cy, radius - 1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(5, 13, 27, .95)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, radius - 2.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(190, 225, 255, .78)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
}
function drawCounters(){
    ctx.save();ctx.fillStyle='rgba(255,255,255,.84)';ctx.shadowColor='rgba(30,50,70,.18)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;roundedRect(8,8,190,78,12);ctx.fill();ctx.restore();
    ctx.save();ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='bold 13px Arial';ctx.fillStyle='#64748b';ctx.fillText('СЧЁТ',20,25);ctx.fillText('ЖИЗНИ',20,49);ctx.fillText('ДОП. ПРЫЖОК',20,73);
    ctx.font='bold 16px Arial';ctx.textAlign='right';ctx.fillStyle='#1e293b';ctx.fillText(String(Math.floor(player.score)),180,25);ctx.fillText(String(lives),125,49);
    ctx.font='bold 13px Arial';ctx.fillStyle='#d99400';ctx.fillText(`${runCoins%10}/10`,180,49);ctx.font='bold 16px Arial';ctx.fillStyle=doubleJumpAvailable?'#16a36a':'#94a3b8';ctx.fillText(doubleJumpAvailable?'ГОТОВ':'—',180,73);ctx.restore();
    ctx.save();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(380,580,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#334155';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚙',380,580);ctx.restore();
}
function drawGameOver(){
    ctx.fillStyle='rgba(15,23,42,.62)';ctx.fillRect(0,0,400,600);drawGlassPanel(45,125,310,360,22);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e63946';ctx.font='bold 34px Arial';ctx.fillText('!',200,170);
    ctx.fillStyle='#1e293b';ctx.font='bold 25px Arial';ctx.fillText('ИГРА ОКОНЧЕНА',200,215);
    ctx.fillStyle='#64748b';ctx.font='15px Arial';ctx.fillText('ВАШ РЕЗУЛЬТАТ',200,255);
    ctx.fillStyle='#087fbe';ctx.font='bold 36px Arial';ctx.fillText(String(Math.floor(player.score)),200,290);
    ctx.fillStyle='#64748b';ctx.font='15px Arial';ctx.fillText('ЛУЧШИЙ РЕЗУЛЬТАТ',200,330);
    ctx.fillStyle='#d99400';ctx.font='bold 22px Arial';ctx.fillText(String(highScore),200,358);
    ctx.save();const gradient=ctx.createLinearGradient(85,395,315,455);gradient.addColorStop(0,'#20d2aa');gradient.addColorStop(1,'#1a91dc');
    roundedRect(85,395,230,60,17);ctx.fillStyle=gradient;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText('СМЕНИТЬ ПЕРСОНАЖА',200,425);ctx.restore();
    ctx.fillStyle='#475569';ctx.font='13px Arial';ctx.fillText('Нажмите любую клавишу, чтобы сыграть снова',200,468);
}
function drawPauseMenu(){
    ctx.fillStyle='rgba(15,23,42,.68)';ctx.fillRect(0,0,400,600);drawGlassPanel(38,112,324,376,24);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#155576';ctx.font='bold 26px Arial';ctx.fillText('ПАУЗА',200,165);
    ctx.fillStyle='#64748b';ctx.font='bold 12px Arial';ctx.fillText('ТЕКУЩИЙ РЕЗУЛЬТАТ',200,230);
    ctx.fillStyle='#1e293b';ctx.font='bold 34px Arial';ctx.fillText(String(Math.floor(player.score)),200,265);
    ctx.fillStyle='#64748b';ctx.font='bold 12px Arial';ctx.fillText('РЕКОРД ПОДЪЁМА',200,325);
    ctx.fillStyle='#d99400';ctx.font='bold 26px Arial';ctx.fillText(String(highScore),200,358);
    ctx.fillStyle='#475569';ctx.font='14px Arial';ctx.fillText('Нажмите ESC, чтобы продолжить',200,430);
}

function draw(timestamp){
    const dt=lastFrameTime?Math.min((timestamp-lastFrameTime)/(1000/60),2):1;lastFrameTime=timestamp;
    if(currentState===STATE.MENU)drawMenu();
    else{
        drawBackground();
        if(currentState===STATE.PAUSE){platforms.forEach(drawPlatform);springs.forEach(drawSpring);coins.forEach(drawCoin);drawPlayer();drawCounters();drawPauseMenu()}
        else if(currentState===STATE.GAMEOVER){platforms.forEach(drawPlatform);springs.forEach(drawSpring);coins.forEach(drawCoin);drawPlayer();drawCounters();drawGameOver()}
        else{platforms.forEach(drawPlatform);springs.forEach(drawSpring);coins.forEach(drawCoin);drawPlayer();drawCounters()}
    }
    update(dt);requestAnimationFrame(draw);
}

fullscreenButton.addEventListener('click',async()=>{
    try{
        if(!document.fullscreenElement){if(gameStage.requestFullscreen)await gameStage.requestFullscreen();else fullscreenButton.title='Полноэкранный режим не поддерживается этим браузером'}
        else await document.exitFullscreen();
    }catch(error){console.error('Не удалось переключить полноэкранный режим:',error)}
});
document.addEventListener('fullscreenchange',()=>{
    const isFullscreen=document.fullscreenElement===gameStage;
    fullscreenButton.textContent=isFullscreen?'×':'⛶';
    fullscreenButton.setAttribute('aria-label',isFullscreen?'Выйти из полноэкранного режима':'Включить полноэкранный режим');
});
requestAnimationFrame(draw);
</script>
