<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Моряка Jump</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101a35}
body{min-height:100vh;min-height:100dvh;padding:12px 0;display:flex;justify-content:center;align-items:center;overflow:auto;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}
#gameStage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#game{display:block;width:min(600px,94vw,calc((100dvh - 75px)*2/3));height:auto;aspect-ratio:2/3;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
#gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;gap:0;background:#101a35}
#gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-width:none;max-height:none;border-radius:0}
#fullscreenButton{width:52px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;font:28px Arial,sans-serif;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#gameStage:fullscreen #fullscreenButton{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10}
#gameStage {
    position: relative;
}
#pauseButton {
    display: none; /* показываем только на сенсорных устройствах */
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 30;

    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.72);
    border-radius: 14px;
    background: rgba(15,23,42,.68);
    color: white;
    font: bold 22px Arial, sans-serif;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

@media (pointer: coarse) {
    #pauseButton {
        display: block;
    }
}

#touchControls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 22px;
    pointer-events: none;
}
.touchButton{width:72px;height:72px;border:2px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,255,255,.18);color:white;font:bold 34px Arial,sans-serif;pointer-events:auto;touch-action:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.touchButton:active{background:rgba(255,255,255,.35)}
@media(hover:hover) and (pointer:fine){#touchControls{display:none}}
/* Мобильные улучшения: стили ПК не меняются */
@media (max-width:600px) and (pointer:coarse){
    html,body{width:100%;height:100%;min-height:100%;overflow:hidden;overscroll-behavior:none}
    body {
    padding: max(6px, env(safe-area-inset-top)) 0;
	}
    #gameStage{width:100%;gap:8px}
    #game{width:min(96vw,calc((100dvh - 120px)*2/3));max-height:calc(100dvh - 120px);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.38)}
/*    #fullscreenButton{width:46px;height:42px;border-radius:13px;font-size:26px;background:rgba(255,255,255,.2);box-shadow:0 4px 14px rgba(0,0,0,.2)} */
	#fullscreenButton {
    display: none;
	}
	#touchControls{
		position:fixed;
		left:0;
		right:0;
		bottom:max(18px,env(safe-area-inset-bottom));
		z-index:20;
		display:flex;
		justify-content:space-between;
		align-items:center;
		padding:0 22px;
		pointer-events:none;
	}

	.touchButton{
		width:72px;
		height:72px;
		border:2px solid rgba(255,255,255,.72);
		border-radius:50%;
		background:rgba(255,255,255,.18);
		color:white;
		font:bold 34px Arial,sans-serif;
		pointer-events:auto;
		touch-action:none;
		user-select:none;
		-webkit-user-select:none;
		-webkit-tap-highlight-color:transparent;
		backdrop-filter:blur(12px);
		-webkit-backdrop-filter:blur(12px);
	}

	.touchButton:active{
		background:rgba(255,255,255,.35);
	}
	
	#jumpButton {
    position: absolute;
    right: 22px;
    bottom: 94px; /* кнопка → высотой 82 px + зазор 12 px */
    width: 62px;  /* примерно на 25% меньше 82 px */
    height: 62px;
    font-size: 27px;
	}
	
	#jumpButton:disabled{
		opacity:.45;
	}

	#jumpButton:not(:disabled){
		background:rgba(22,163,106,.7);
		border-color:rgba(255,255,255,.95);
	}
    #gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-height:none;border-radius:0}
    #gameStage:fullscreen #fullscreenButton{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
}
@media (max-width:900px) and (pointer:coarse) and (orientation:landscape){
    body{padding:0}
    #gameStage{height:100dvh;gap:4px}
    #game{width:auto;height:calc(100dvh - 54px);max-width:68vw;border-radius:10px}
    #touchControls{bottom:max(10px,env(safe-area-inset-bottom));padding-right:max(20px,env(safe-area-inset-right));padding-left:max(20px,env(safe-area-inset-left))}
    .touchButton{width:64px;height:64px;font-size:30px}
}
#tiltButton {
    display: none;
}

@media (pointer: coarse) {
    #tiltButton {
        display: block;
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        z-index: 30;
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,.72);
        border-radius: 12px;
        background: rgba(15,23,42,.68);
        color: white;
        font: bold 13px Arial, sans-serif;
        touch-action: manipulation;
    }
}
</style>
</head>
<body>
<div id="gameStage">
<canvas id="game" width="1600" height="2400" aria-label="Игра Моряка Jump"></canvas>
<button id="fullscreenButton" type="button" aria-label="Включить полноэкранный режим">⛶</button>
<button
    id="pauseButton"
    type="button"
    aria-label="Пауза"
    title="Пауза"
>Ⅱ</button>

<div id="touchControls" aria-label="Управление">
    <button class="touchButton" id="leftButton" aria-label="Влево">←</button>
    <button class="touchButton" id="jumpButton" aria-label="Дополнительный прыжок" disabled>↑</button>
    <button class="touchButton" id="rightButton" aria-label="Вправо">→</button>
</div>
</div>
<button id="tiltButton" type="button">Включить наклон</button>
<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const RENDER_SCALE=4;
ctx.scale(RENDER_SCALE,RENDER_SCALE);
// Размер игрового мира в координатах рисования — 400 × 600.
const backgroundCache = document.createElement('canvas');
backgroundCache.width = 400;
backgroundCache.height = 600;

const backgroundCtx = backgroundCache.getContext('2d');

function buildBackgroundCache() {
    const gradient = backgroundCtx.createLinearGradient(0, 0, 0, 600);
    gradient.addColorStop(0, '#b7f4ff');
    gradient.addColorStop(0.55, '#e8f8ff');
    gradient.addColorStop(1, '#d7eaff');

    backgroundCtx.fillStyle = gradient;
    backgroundCtx.fillRect(0, 0, 400, 600);

    backgroundCtx.fillStyle = 'rgba(255,255,255,.34)';
    backgroundCtx.beginPath();
    backgroundCtx.arc(55, 100, 42, 0, Math.PI * 2);
    backgroundCtx.arc(76, 95, 30, 0, Math.PI * 2);
    backgroundCtx.arc(320, 180, 55, 0, Math.PI * 2);
    backgroundCtx.arc(345, 170, 37, 0, Math.PI * 2);
    backgroundCtx.fill();

    backgroundCtx.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < 5; i++) {
        backgroundCtx.beginPath();
        backgroundCtx.ellipse(210, 430 + i * 34, 260, 15, 0, 0, Math.PI * 2);
        backgroundCtx.fill();
    }
}

buildBackgroundCache();
const gameStage=document.getElementById('gameStage');
const fullscreenButton=document.getElementById('fullscreenButton');
const pauseButton = document.getElementById('pauseButton');

pauseButton.addEventListener('pointerdown', event => {
    event.preventDefault();

    if (currentState === STATE.PLAYING) {
        currentState = STATE.PAUSE;
        lastFrameTime = 0;
    }
});
const STATE={MENU:0,PLAYING:1,PAUSE:2,GAMEOVER:3};
let currentState=STATE.MENU,lastFrameTime=0;

const screenShake = {
    time: 0,
    duration: 0,
    intensity: 0,
    x: 0,
    y: 0
};

function startScreenShake(intensity = 2.5, duration = 12) {
    screenShake.time = Math.max(screenShake.time, duration);
    screenShake.duration = Math.max(screenShake.duration, duration);
    screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

function updateScreenShake(dt) {
    if (screenShake.time <= 0) {
        screenShake.time = 0;
        screenShake.x = 0;
        screenShake.y = 0;
        return;
    }

    screenShake.time = Math.max(0, screenShake.time - dt);

    const fade = screenShake.duration > 0
        ? screenShake.time / screenShake.duration
        : 0;

    // Плавно ослабевающая тряска. Координаты заданы в игровых единицах.
    const amount = screenShake.intensity * fade;
    const phase = (screenShake.duration - screenShake.time) * 2.4;

    screenShake.x = Math.sin(phase * 1.7) * amount;
    screenShake.y = Math.cos(phase * 2.3) * amount * 0.7;
}

const CHARACTER_SCORES=Array.from({length:21},(_,index)=>index*2500);
const characterImages=Array.from({length:21},(_,i)=>{
    const image=new Image();
    image.src=`${i+1}.jpg`;
    return image;
});

function readStoredNumber(key,fallback=0){
    try{const value=Number(localStorage.getItem(key));return Number.isFinite(value)&&value>=0?value:fallback}
    catch{return fallback}
}
let bankCoins=readStoredNumber('morjakaBankCoins');
let highScore=readStoredNumber('doodleHighScore');
function getUnlockedCharacters(score){return CHARACTER_SCORES.map((required,index)=>({required,index})).filter(item=>score>=item.required).map(item=>item.index)}
let unlockedCharacters=getUnlockedCharacters(highScore);
let selectedCharacter=readStoredNumber('morjakaSelectedCharacter');
if(!Number.isInteger(selectedCharacter)||selectedCharacter<0||selectedCharacter>20||!unlockedCharacters.includes(selectedCharacter))selectedCharacter=0;

function saveProgress(){
    try{
        localStorage.setItem('morjakaBankCoins',String(bankCoins));
        localStorage.setItem('morjakaUnlockedCharacters',JSON.stringify(unlockedCharacters));
        localStorage.setItem('morjakaSelectedCharacter',String(selectedCharacter));
        localStorage.setItem('doodleHighScore',String(highScore));
    }catch(error){console.warn('Не удалось сохранить прогресс:',error)}
}

let player={x:185,y:500,vx:0,dy:0,score:0};
let platforms=[],fallingPlatforms=[],verticalPlatforms=[],springs=[],coins=[],birds=[],lives=0,nextLifeScore=10000,doubleJumpAvailable=false,runCoins=0;
let menuMessage='',menuMessageUntil=0,menuButtonDown=false;
const keys={};

const currentTheme={bg:'#d8f6ff',plat:'#38cdb4'};

function resetGame(){
    player={x:185,y:500,vx:0,dy:0,score:0};
	platforms=[{x:120,y:550,w:160,h:15,type:'static'}];
	fallingPlatforms=[];
	verticalPlatforms=[];
	springs=[];coins=[];birds=[];lives=0;nextLifeScore=10000;doubleJumpAvailable=false;runCoins=0;	
	for(let i=0;i<7;i++){
		const y=500-i*100;
		platforms.push(spawnPlatform(y));
		maybeSpawnVerticalPlatform(y);
	}
}
function startGame(){resetGame();lastFrameTime=0;currentState=STATE.PLAYING}
function spawnPlatform(y){
    const level=Math.floor(player.score/4000),brokenChance=Math.min(.35,.05+level*.05),movingChance=Math.min(.35,.05+level*.05);
    const rand=Math.random(),type=rand<brokenChance?'broken':rand<brokenChance+movingChance?'moving':'static';
    const width=70*Math.max(.7,2-level*.25);
    const platform={x:Math.random()*(400-width),y,w:width,h:15,type,dir:2*Math.min(2,1+Math.floor(player.score/2500)*.2)};
    if(type==='static'&&Math.random()>.7)springs.push({x:platform.x+platform.w/2-10,y:y-15});
    if(Math.random()>.92)coins.push({x:platform.x+platform.w/2,y:y-25,r:8});
    if(Math.random()>.985)platform.life={x:platform.x+platform.w/2-10,y:y-35};
    return platform;
}

function spawnVerticalPlatform(y) {
    const w = 80;
    const h = 15;
    const sideWidth = 70; // ширина зоны у каждого края

    // Случайно выбираем левый или правый край.
    const x = Math.random() < 0.5
        ? Math.random() * sideWidth
        : 400 - w - Math.random() * sideWidth;

    return {
        x,
        y,
        baseY: y,
        previousY: y,
        w,
        h,
        phase: Math.random() * Math.PI * 2,
        speed: 0.025 + Math.random() * 0.01
    };
}

function maybeSpawnVerticalPlatform(y) {
    // Независимый дополнительный шанс: обычная генерация не меняется.
    if (Math.random() < 0.01) {
        verticalPlatforms.push(spawnVerticalPlatform(y));
    }
}

function spawnBird(){
    const direction=Math.random()<0.5?1:-1;
    const type=Math.floor(Math.random()*3);

    const birdTypes=[
        {speed:2.2, size:1, color:'#4b5563'}, // обычная
        {speed:3.4, size:.78, color:'#9b59b6'}, // маленькая и быстрая
        {speed:1.6, size:1.25, color:'#c0392b'} // крупная и медленная
    ];
    const birdType=birdTypes[type];

    birds.push({
        x:direction===1?-40:440,
        y:100+Math.random()*400,
        vx:direction*(birdType.speed+Math.min(2,player.score/20000)),
        flap:Math.random()*Math.PI*2,
        hitCooldown:0,
        size:birdType.size,
        color:birdType.color
    });
}
window.addEventListener('keydown',event=>{
    keys[event.code]=true;
    if((event.code==='ArrowUp'||event.code==='KeyW'||event.code==='Space')&&currentState===STATE.PLAYING&&doubleJumpAvailable){
        event.preventDefault();player.dy=-15;doubleJumpAvailable=false;
    }
    if(currentState===STATE.MENU){
        if(event.code==='Enter'||event.code==='Space')startGame();
    }else if(currentState===STATE.GAMEOVER)startGame();
    else if(currentState===STATE.PLAYING&&event.code==='Escape'){currentState=STATE.PAUSE;lastFrameTime=0}
    else if(currentState===STATE.PAUSE&&event.code==='Escape'){currentState=STATE.PLAYING;lastFrameTime=0}
});
window.addEventListener('keyup',event=>{keys[event.code]=false});
window.addEventListener('blur', () => {
    keys.ArrowLeft = false;
    keys.ArrowRight = false;
    keys.KeyA = false;
    keys.KeyD = false;
});

function setMenuMessage(text){menuMessage=text;menuMessageUntil=performance.now()+2200}
function canvasPoint(event){
    const rect=canvas.getBoundingClientRect();
    return{x:(event.clientX-rect.left)*400/rect.width,y:(event.clientY-rect.top)*600/rect.height};
}
function getCharacterCardRects(){
    const result=[];
    const cardW=44,cardH=70,startX=22,startY=243;
    const colGap=52,rowGap=76;

    for(let i=0;i<21;i++){
        const row=Math.floor(i/7);
        const col=i%7;
        result.push({
            x:startX+col*colGap,
            y:startY+row*rowGap,
            w:cardW,
            h:cardH
        });
    }

    return result;
}
function handleMenuPointer(point){
    if(currentState!==STATE.MENU)return;
    for(let i=0;i<21;i++){
        const r=getCharacterCardRects()[i];
        if(point.x<r.x||point.x>r.x+r.w||point.y<r.y||point.y>r.y+r.h)continue;
        if(unlockedCharacters.includes(i)){selectedCharacter=i;saveProgress();setMenuMessage(`Выбран персонаж ${i+1}`)}
        else setMenuMessage(`Нужен рекорд ${CHARACTER_SCORES[i]} — осталось ${Math.max(0,CHARACTER_SCORES[i]-highScore)}`);
        return;
    }
    if(point.x>=104&&point.x<=296&&point.y>=524&&point.y<=580)startGame();
}
canvas.addEventListener('pointerdown',event=>{
    const point=canvasPoint(event);
	if(currentState === STATE.PAUSE) {
		// «Продолжить»
		if (point.x >= 85 && point.x <= 315 &&
			point.y >= 370 && point.y <= 412) {
			currentState = STATE.PLAYING;
			lastFrameTime = 0;
		}
		// «В меню»
		else if (point.x >= 85 && point.x <= 315 &&
				 point.y >= 420 && point.y <= 462) {
			currentState = STATE.MENU;
			lastFrameTime = 0;
		}

		event.preventDefault();
		return;
	}
    if(currentState===STATE.GAMEOVER){
        if(point.x>=85&&point.x<=315&&point.y>=395&&point.y<=455)currentState=STATE.MENU;
        else startGame();
        event.preventDefault();return;
    }
    if(currentState===STATE.MENU){
        handleMenuPointer(point);
        menuButtonDown=point.x>=104&&point.x<=296&&point.y>=524&&point.y<=580;
        event.preventDefault();return;
    }
    if(currentState===STATE.PLAYING&&point.x>350&&point.y>550){currentState=STATE.PAUSE;lastFrameTime=0;event.preventDefault()}
});
canvas.addEventListener('pointerup',event=>{
    if(currentState===STATE.MENU&&menuButtonDown){
        const point=canvasPoint(event);
        if(point.x>=104&&point.x<=296&&point.y>=524&&point.y<=580)startGame();
    }
    menuButtonDown=false;
});
canvas.addEventListener('pointercancel',()=>{menuButtonDown=false});

const touchInput = {
    left: false,
    right: false
};

const tiltButton = document.getElementById('tiltButton');

let tiltEnabled = false;
let tiltDirection = 0;
let neutralGamma = null;

function handleTilt(event) {
    if (!tiltEnabled || currentState !== STATE.PLAYING) {
        tiltDirection = 0;
        return;
    }

    // gamma — наклон телефона влево/вправо.
    if (typeof event.gamma !== 'number') return;

    if (neutralGamma === null) neutralGamma = event.gamma;

    const tilt = event.gamma - neutralGamma;
    const deadZone = 5;

    if (tilt < -deadZone) {
        tiltDirection = -1;
    } else if (tilt > deadZone) {
        tiltDirection = 1;
    } else {
        tiltDirection = 0;
    }
}

async function enableTilt() {
    if (!('DeviceOrientationEvent' in window)) {
        tiltButton.textContent = 'Датчик недоступен';
        return;
    }

    // В некоторых версиях iOS разрешение запрашивается по нажатию кнопки.
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
                tiltButton.textContent = 'Нет разрешения';
                return;
            }
        } catch {
            tiltButton.textContent = 'Не удалось включить';
            return;
        }
    }

    tiltEnabled = true;
    neutralGamma = null;
    window.addEventListener('deviceorientation', handleTilt);
    tiltButton.textContent = 'Наклон включён';
}

tiltButton.addEventListener('click', enableTilt);

const mouseControl = {
    targetX: null,
    inside: false
};

canvas.addEventListener('pointermove', event => {
    if (event.pointerType !== 'mouse' || currentState !== STATE.PLAYING) return;

    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;

    // Координата курсора в игровых единицах: ширина игрового мира — 400.
    mouseControl.targetX = Math.max(
        0,
        Math.min(400, (event.clientX - rect.left) * 400 / rect.width)
    );
    mouseControl.inside =
        event.clientX >= rect.left &&
        event.clientX <= rect.right;
});

canvas.addEventListener('pointerleave', event => {
    if (event.pointerType === 'mouse') {
        mouseControl.inside = false;
    }
});

const activePointers = {
    left: new Set(),
    right: new Set()
};

function bindTouchButton(id, direction) {
    const button = document.getElementById(id);

    button.addEventListener('pointerdown', event => {
        event.preventDefault();
        activePointers[direction].add(event.pointerId);
        touchInput[direction] = true;

        try {
            button.setPointerCapture(event.pointerId);
        } catch {}
    });

    function release(event) {
        activePointers[direction].delete(event.pointerId);
        touchInput[direction] = activePointers[direction].size > 0;
    }

    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', release);
    button.addEventListener('contextmenu', event => event.preventDefault());
}

bindTouchButton('leftButton', 'left');
bindTouchButton('rightButton', 'right');

const jumpButton = document.getElementById('jumpButton');

canvas.addEventListener('pointerdown', event => {
    if (event.pointerType !== 'mouse' || event.button !== 0) return;
    if (currentState !== STATE.PLAYING || !doubleJumpAvailable) return;

    event.preventDefault();
    player.dy = -15;
    doubleJumpAvailable = false;
});

function tryDoubleJump(event) {
    event.preventDefault();

    if (currentState === STATE.PLAYING && doubleJumpAvailable) {
        player.dy = -15;
        doubleJumpAvailable = false;
    }
}

jumpButton.addEventListener('pointerdown', tryDoubleJump);
jumpButton.addEventListener('contextmenu', event => event.preventDefault());

function clearTouchInput() {
    activePointers.left.clear();
    activePointers.right.clear();
    touchInput.left = false;
    touchInput.right = false;
}

window.addEventListener('blur', clearTouchInput);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTouchInput();
});

function update(dt){
    if(currentState!==STATE.PLAYING)return;
	jumpButton.disabled = !doubleJumpAvailable;
    dt=Math.min(dt,2);
	const keyboardOrTouchLeft =
		keys.ArrowLeft || keys.KeyA || touchInput.left;
	const keyboardOrTouchRight =
		keys.ArrowRight || keys.KeyD || touchInput.right;

	// Наклон влияет на движение, только если датчик включён
	// и телефон действительно наклонён влево или вправо.
	const tiltLeft =
		tiltEnabled && tiltDirection < 0;
	const tiltRight =
		tiltEnabled && tiltDirection > 0;

	if (
		keyboardOrTouchLeft ||
		keyboardOrTouchRight ||
		tiltLeft ||
		tiltRight
	) {
		// Клавиатура, сенсорные кнопки и наклон управляют движением.
		if (keyboardOrTouchLeft || tiltLeft) player.vx -= 1.2 * dt;
		if (keyboardOrTouchRight || tiltRight) player.vx += 1.2 * dt;
	} else if (
		mouseControl.inside &&
		mouseControl.targetX !== null
	) {
		// Если клавиатура, кнопки и наклон не используются — действует мышь.
		const playerCenter = player.x + 15;
		const error = mouseControl.targetX - playerCenter;
		const deadZone = 8;
		const maxMouseSpeed = 7;

		if (Math.abs(error) <= deadZone) {
			player.vx *= Math.pow(0.65, dt);
		} else {
			const desiredSpeed =
				Math.sign(error) *
				maxMouseSpeed *
				Math.min(1, Math.abs(error) / 100);

			const response = 1 - Math.pow(0.62, dt);
			player.vx += (desiredSpeed - player.vx) * response;
		}
	}
    player.vx*=Math.pow(.85,dt);player.x+=player.vx*dt;
    player.dy+=.5464*dt;player.y+=player.dy*dt;
    if(player.x<-30)player.x=400;if(player.x>400)player.x=-30;
    if(Math.random()<.004*dt)spawnBird();
    for(let i=birds.length-1;i>=0;i--){
        const bird=birds[i];bird.x+=bird.vx*dt;bird.flap+=.22*dt;bird.hitCooldown=Math.max(0,bird.hitCooldown-dt);
        if(bird.x<-55||bird.x>455){birds.splice(i,1);continue}
        const playerCenterX=player.x+15,playerCenterY=player.y+15;
        if(bird.hitCooldown<=0&&Math.abs(playerCenterX-bird.x)<29&&Math.abs(playerCenterY-bird.y)<25){
            startScreenShake(2.5, 12);
			const pushDirection=playerCenterX<bird.x?-1:1;
            player.vx=pushDirection*9;player.dy=-8;player.x+=pushDirection*12;bird.hitCooldown=45;
        }
    }
    // Плавно двигаем платформы в пределах 15 пикселей от исходной высоты.
    // Скорость задаётся в игровых кадрах, а не через системное время.
    verticalPlatforms.forEach(platform => {
        platform.previousY = platform.y;
        platform.phase += platform.speed * dt;
        platform.y = platform.baseY + Math.sin(platform.phase) * 200;
    });

    platforms.forEach(platform => {
        if (
            platform.type === 'broken' &&
            platform.breaking &&
            player.dy < 0 &&
            player.y + 35 <= platform.y
        ) {
            platform.falling = true;
            platform.vy = 0;
            fallingPlatforms.push(platform);
            platform.removeAfterBounce = true;
        }

        if (
            player.dy > 0 &&
            !platform.breaking &&
            player.x + 25 > platform.x &&
            player.x + 10 < platform.x + platform.w &&
            player.y + 35 > platform.y &&
            player.y + 35 < platform.y + platform.h + player.dy
        ) {
            player.y = platform.y - 35;
            player.dy = -12.98;
            doubleJumpAvailable = true;

            if (platform.type === 'broken') {
                platform.breaking = true;
            }
        }

        if (platform.type === 'moving') {
            platform.x += platform.dir * dt;

            if (platform.x <= 0 || platform.x + platform.w >= 400) {
                platform.x = Math.max(0, Math.min(400 - platform.w, platform.x));
                platform.dir *= -1;
            }
        }
    });

    // Проверяем пересечение верхней грани движущейся платформы.
    // Предыдущие координаты нужны, чтобы не пропускать платформу,
    // если она сама успела немного сдвинуться между кадрами.
    const previousPlayerBottom = player.y + 35 - player.dy * dt;
    const currentPlayerBottom = player.y + 35;

    for (const platform of verticalPlatforms) {
        const platformTopBefore = platform.previousY;
        const platformTopNow = platform.y;

        const crossedPlatform =
            previousPlayerBottom <= platformTopBefore + platform.h &&
            currentPlayerBottom >= platformTopNow;

        const overlapsPlatform =
            player.x + 25 > platform.x &&
            player.x + 10 < platform.x + platform.w;

        if (player.dy > 0 && crossedPlatform && overlapsPlatform) {
            player.y = platformTopNow - 35;
            player.dy = -12.98;
            doubleJumpAvailable = true;
            break;
        }
    }   
	platforms.forEach(platform=>{
		if(platform.type==='broken'&&platform.breaking&&player.dy<0&&player.y+35<=platform.y){
			platform.falling=true;
			platform.vy=0;
			fallingPlatforms.push(platform);
			platform.removeAfterBounce=true;
		}
        if(player.dy>0&&!platform.breaking&&player.x+25>platform.x&&player.x+10<platform.x+platform.w&&player.y+35>platform.y&&player.y+35<platform.y+platform.h+player.dy){
            player.y=platform.y-35;player.dy=-12.98;doubleJumpAvailable=true;if(platform.type==='broken')platform.breaking=true;
        }
        if(platform.type==='moving'){
            platform.x+=platform.dir*dt;
            if(platform.x<=0||platform.x+platform.w>=400){platform.x=Math.max(0,Math.min(400-platform.w,platform.x));platform.dir*=-1}
        }
		// Новый отдельный цикл вертикальных платформ.
		verticalPlatforms.forEach(platform => {
			const previousBottom = player.y + 35 - player.dy * dt;
			const currentBottom = player.y + 35;

			const crossedPlatformTop =
				previousBottom <= platform.y &&
				currentBottom >= platform.y;

			const overlapsPlatform =
				player.x + 25 > platform.x &&
				player.x + 10 < platform.x + platform.w;

			if (player.dy > 0 && crossedPlatformTop && overlapsPlatform) {
				player.y = platform.y - 35;
				player.dy = -12.98;
				doubleJumpAvailable = true;
			}
		});		
    });
    platforms=platforms.filter(platform=>!platform.removeAfterBounce);
	const fallingGravity = 0.55;

	for(let i=fallingPlatforms.length-1;i>=0;i--){
		const platform=fallingPlatforms[i];
		platform.vy+=fallingGravity*dt;
		platform.y+=platform.vy*dt;

		// Удаляем объект, когда он ушёл за нижний край игрового поля.
		if(platform.y>640){
			fallingPlatforms.splice(i,1);
		}
	}	
    springs.forEach(spring=>{
        if(player.dy>0&&player.x+25>spring.x&&player.x<spring.x+20&&player.y+35>spring.y&&player.y+35<spring.y+20){player.dy=-32;doubleJumpAvailable=true}
    });
    for(let i=coins.length-1;i>=0;i--){
        const coin=coins[i];
        if(player.x<coin.x+20&&player.x+30>coin.x&&player.y<coin.y+20&&player.y+30>coin.y){
            runCoins++;bankCoins++;if(runCoins%10===0)lives++;saveProgress();coins.splice(i,1);
        }
    }
    platforms.forEach(platform=>{
        if(!platform.life)return;
        const life=platform.life;
        if(player.x<life.x+20&&player.x+30>life.x&&player.y<life.y+20&&player.y+30>life.y){lives++;platform.life=null}
    });
    if(player.y<250){
        const diff=250-player.y;player.score+=diff;
        while(player.score>=nextLifeScore){lives++;nextLifeScore+=10000}
        player.y=250;
		platforms.forEach(platform => platform.y += diff);

        verticalPlatforms.forEach(platform => {
            platform.y += diff;
            platform.baseY += diff;
            platform.previousY += diff;
        });springs.forEach(spring=>spring.y+=diff);coins.forEach(coin=>coin.y+=diff);birds.forEach(bird=>bird.y+=diff);
    }
    platforms=platforms.filter(platform=>platform.y<650);
    verticalPlatforms = verticalPlatforms.filter(
        platform => platform.baseY < 650
    );
	springs=springs.filter(spring=>spring.y<650);coins=coins.filter(coin=>coin.y<650);
	while(platforms.length<8){
		const lastY=platforms.length
			? Math.min(...platforms.map(platform=>platform.y))
			: 550;
		const y=lastY-100;

		platforms.push(spawnPlatform(y));
		maybeSpawnVerticalPlatform(y);
	}
	if(player.y>600&&lives>0){
		startScreenShake(3.5, 16);
		lives--;
		player.y=500;
		player.dy=-42;
		doubleJumpAvailable=true;
	}
    else if(player.y>600){
        currentState=STATE.GAMEOVER;
        const finalScore=Math.floor(player.score);
        if(finalScore>highScore){highScore=finalScore;unlockedCharacters=getUnlockedCharacters(highScore);if(!unlockedCharacters.includes(selectedCharacter))selectedCharacter=0;saveProgress()}
    }	
	else if(player.y>600){
		startScreenShake(4, 20);
		currentState=STATE.GAMEOVER;
	}	
}

    ctx.save();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(380,580,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#334155';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚙',380,580);ctx.restore();
}
function drawGameOver(){
    ctx.fillStyle='rgba(15,23,42,.62)';ctx.fillRect(0,0,400,600);drawGlassPanel(45,125,310,360,22);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e63946';ctx.font='bold 34px Arial';ctx.fillText('!',200,170);
    ctx.fillStyle='#1e293b';ctx.font='bold 25px Arial';ctx.fillText('ИГРА ОКОНЧЕНА',200,215);
    ctx.fillStyle='#64748b';ctx.font='15px Arial';ctx.fillText('ВАШ РЕЗУЛЬТАТ',200,255);
    ctx.fillStyle='#087fbe';ctx.font='bold 36px Arial';ctx.fillText(String(Math.floor(player.score)),200,290);
    ctx.fillStyle='#64748b';ctx.font='15px Arial';ctx.fillText('ЛУЧШИЙ РЕЗУЛЬТАТ',200,330);
    ctx.fillStyle='#d99400';ctx.font='bold 22px Arial';ctx.fillText(String(highScore),200,358);
    ctx.save();const gradient=ctx.createLinearGradient(85,395,315,455);gradient.addColorStop(0,'#20d2aa');gradient.addColorStop(1,'#1a91dc');
    roundedRect(85,395,230,60,17);ctx.fillStyle=gradient;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText('СМЕНИТЬ ПЕРСОНАЖА',200,425);ctx.restore();
    ctx.fillStyle='#475569';ctx.font='13px Arial';ctx.fillText('Нажмите любую клавишу, чтобы сыграть снова',200,468);
}
function drawPauseMenu(){
    ctx.fillStyle='rgba(15,23,42,.68)';
    ctx.fillRect(0,0,400,600);
    drawGlassPanel(38,112,324,376,24);

    ctx.textAlign='center';
    ctx.textBaseline='middle';

    ctx.fillStyle='#155576';
    ctx.font='bold 26px Arial';
    ctx.fillText('ПАУЗА',200,155);

    ctx.fillStyle='#64748b';
    ctx.font='bold 12px Arial';
    ctx.fillText('ТЕКУЩИЙ РЕЗУЛЬТАТ',200,205);

    ctx.fillStyle='#1e293b';
    ctx.font='bold 34px Arial';
    ctx.fillText(String(Math.floor(player.score)),200,238);

    ctx.fillStyle='#64748b';
    ctx.font='bold 12px Arial';
    ctx.fillText('РЕКОРД ПОДЪЁМА',200,285);

    ctx.fillStyle='#d99400';
    ctx.font='bold 26px Arial';
    ctx.fillText(String(highScore),200,316);

    // Кнопка «Продолжить»
    ctx.save();
    let gradient=ctx.createLinearGradient(85,370,315,432);
    gradient.addColorStop(0,'#20d2aa');
    gradient.addColorStop(1,'#1a91dc');
    roundedRect(85,370,230,42,14);
    ctx.fillStyle=gradient;
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 16px Arial';
    ctx.fillText('ПРОДОЛЖИТЬ',200,391);
    ctx.restore();

    // Кнопка «В меню»
    ctx.save();
    roundedRect(85,420,230,42,14);
    ctx.fillStyle='rgba(255,255,255,.68)';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle='#155576';
    ctx.font='bold 16px Arial';
    ctx.fillText('В МЕНЮ',200,441);
    ctx.restore();
}
function draw(timestamp){
    const dt=lastFrameTime
        ? Math.min((timestamp-lastFrameTime)/(1000/60),2)
        : 1;
    lastFrameTime=timestamp;
    updateScreenShake(dt);

    if(currentState===STATE.MENU) {
        drawMenu();
    } else {
        drawBackground();

        ctx.save();
        if (currentState !== STATE.PAUSE) {
            ctx.translate(screenShake.x, screenShake.y);
        }

        if(currentState===STATE.PAUSE){
			verticalPlatforms.forEach(drawVerticalPlatform);
			fallingPlatforms.forEach(drawPlatform);
            platforms.forEach(drawPlatform);
            springs.forEach(drawSpring);
            coins.forEach(drawCoin);
            birds.forEach(drawBird);
            drawPlayer();
            drawCounters();
            drawPauseMenu();
        } else if(currentState===STATE.GAMEOVER){
			verticalPlatforms.forEach(drawVerticalPlatform);
			fallingPlatforms.forEach(drawPlatform);
            platforms.forEach(drawPlatform);
            springs.forEach(drawSpring);
            coins.forEach(drawCoin);
            birds.forEach(drawBird);
            drawPlayer();
            drawCounters();
            drawGameOver();
        } else {
			verticalPlatforms.forEach(drawVerticalPlatform);
			fallingPlatforms.forEach(drawPlatform);
            platforms.forEach(drawPlatform);
            springs.forEach(drawSpring);
            coins.forEach(drawCoin);
            birds.forEach(drawBird);
            drawPlayer();
            drawCounters();
        }

        ctx.restore();
    }

    update(dt);
    requestAnimationFrame(draw);
    jumpButton.disabled = currentState !== STATE.PLAYING || !doubleJumpAvailable;
}
fullscreenButton.addEventListener('click',async()=>{
    try{
        if(!document.fullscreenElement){if(gameStage.requestFullscreen)await gameStage.requestFullscreen();else fullscreenButton.title='Полноэкранный режим не поддерживается этим браузером'}
        else await document.exitFullscreen();
    }catch(error){console.error('Не удалось переключить полноэкранный режим:',error)}
});
document.addEventListener('fullscreenchange',()=>{
    const isFullscreen=document.fullscreenElement===gameStage;
    fullscreenButton.textContent=isFullscreen?'×':'⛶';
    fullscreenButton.setAttribute('aria-label',isFullscreen?'Выйти из полноэкранного режима':'Включить полноэкранный режим');
});
requestAnimationFrame(draw);
</script>
