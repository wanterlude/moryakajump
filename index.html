    drawGroundShadow(x + w / 2, y + h + 5, w * 0.58, 5, 0.16);

    ctx.save();

    const body = ctx.createLinearGradient(0, y, 0, y + h);
    body.addColorStop(0, WINTER.snowMid);
    body.addColorStop(0.55, '#b6d7e8');
    body.addColorStop(1, WINTER.snowDeep);

    roundedRect(x, y + 2, w, h - 1, 7);
    ctx.fillStyle = body;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1;
    ctx.stroke();

    snowCap(x, y + 1, w, 7);

    ctx.fillStyle = 'rgba(255,255,255,.22)';
    roundedRect(x + 3, y + h - 4, w - 6, 2.4, 1.2);
    ctx.fill();

    ctx.restore();
}

function drawIcePlatform(p) {
    const { x, y, w, h } = p;

    drawGroundShadow(x + w / 2, y + h + 5, w * 0.58, 5, 0.20);

    ctx.save();

    const ice = ctx.createLinearGradient(0, y, 0, y + h);
    ice.addColorStop(0, WINTER.iceTop);
    ice.addColorStop(0.34, '#9ee4f8');
    ice.addColorStop(0.72, WINTER.iceMid);
    ice.addColorStop(1, WINTER.iceDeep);

    roundedRect(x, y, w, h, 6);
    ctx.fillStyle = ice;
    ctx.fill();

    ctx.save();
    roundedRect(x, y, w, h, 6);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w * 0.26, y);
    ctx.lineTo(x + w * 0.10, y + h);
    ctx.lineTo(x, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.92)';
    roundedRect(x + 6, y + 2.6, w - 12, 2.2, 1.1);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.30, y + 4);
    ctx.lineTo(x + w * 0.42, y + h - 4);
    ctx.moveTo(x + w * 0.62, y + 4);
    ctx.lineTo(x + w * 0.52, y + h - 4);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(24,96,130,.35)';
    roundedRect(x + 0.5, y + 0.5, w - 1, h - 1, 6);
    ctx.stroke();

    // Движущаяся: заметные «шевроны» по всей длине. Форма и паттерн
    // отличают её от скользкой даже без цвета.
    ctx.save();
    roundedRect(x, y, w, h, 6);
    ctx.clip();
    ctx.strokeStyle = 'rgba(12,72,104,.34)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    const step = 16;
    for (let cx = x + 8; cx < x + w - 4; cx += step) {
        ctx.beginPath();
        ctx.moveTo(cx - 4, y + h - 4);
        ctx.lineTo(cx, y + 4);
        ctx.lineTo(cx + 4, y + h - 4);
        ctx.stroke();
    }
    ctx.restore();

    ctx.restore();
}

function drawWoodPlatform(p) {
    const { x, y, w, h } = p;
    const shake = p.breaking ? Math.sin(frameNow() * 34) * 0.7 : 0;

    ctx.save();
    ctx.translate(shake, 0);

    drawGroundShadow(x + w / 2, y + h + 5, w * 0.58, 5, 0.16);

    const wood = ctx.createLinearGradient(0, y, 0, y + h);
    wood.addColorStop(0, p.breaking ? '#c07a4c' : WINTER.woodTop);
    wood.addColorStop(0.55, p.breaking ? '#8a5030' : WINTER.woodMid);
    wood.addColorStop(1, WINTER.woodDeep);

    roundedRect(x, y, w, h, 5);
    ctx.fillStyle = wood;
    ctx.fill();

    ctx.strokeStyle = 'rgba(58,32,18,.35)';
    ctx.lineWidth = 0.9;
    for (let i = 1; i < 3; i++) {
        const yy = y + (h / 3) * i;
        ctx.beginPath();
        ctx.moveTo(x + 3, yy);
        ctx.lineTo(x + w - 3, yy);
        ctx.stroke();
    }

    snowCap(x, y + 1, w, 6);

    // Ломающаяся: треугольные сколы вдоль нижнего края — читается
    // как «хрупкая» даже в оттенках серого.
    if (!p.breaking) {
        ctx.save();
        roundedRect(x, y, w, h, 5);
        ctx.clip();
        ctx.fillStyle = 'rgba(58,32,18,.22)';
        const notch = 11;
        for (let nx = x + 6; nx < x + w - 6; nx += notch * 2) {
            ctx.beginPath();
            ctx.moveTo(nx, y + h);
            ctx.lineTo(nx + notch / 2, y + h - 4.5);
            ctx.lineTo(nx + notch, y + h);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    if (p.breaking) {
        ctx.strokeStyle = 'rgba(255,238,214,.9)';
        ctx.lineWidth = 1.8;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(x + w * 0.46, y + 2);
        ctx.lineTo(x + w * 0.40, y + h * 0.5);
        ctx.lineTo(x + w * 0.54, y + h * 0.72);
        ctx.lineTo(x + w * 0.48, y + h);
        ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(60,34,18,.30)';
    ctx.lineWidth = 1;
    roundedRect(x + 0.5, y + 0.5, w - 1, h - 1, 5);
    ctx.stroke();

    ctx.restore();
}

function drawSlipperyIce(p) {
    const { x, y, w, h } = p;

    drawGroundShadow(x + w / 2, y + h + 5, w * 0.58, 5, 0.18);

    ctx.save();

    const ice = ctx.createLinearGradient(0, y, 0, y + h);
    ice.addColorStop(0, '#ffffff');
    ice.addColorStop(0.30, '#c8f2ff');
    ice.addColorStop(0.68, '#6fd0ea');
    ice.addColorStop(1, '#2f9bc4');

    roundedRect(x, y, w, h, 4);
    ctx.fillStyle = ice;
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.95)';
    roundedRect(x + 5, y + 2.2, w * 0.55, 2.4, 1.2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 0.9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.18, y + 6);
    ctx.lineTo(x + w * 0.30, y + h - 2);
    ctx.moveTo(x + w * 0.66, y + 5);
    ctx.lineTo(x + w * 0.58, y + h - 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(24,96,130,.30)';
    ctx.lineWidth = 1;
    roundedRect(x + 0.5, y + 0.5, w - 1, h - 1, 4);
    ctx.stroke();

    // Скользкая: волнистые линии по поверхности — «мокрый лёд».
    ctx.save();
    roundedRect(x, y, w, h, 4);
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.62)';
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    for (let row = 0; row < 2; row++) {
        const wy = y + 6 + row * 5;
        ctx.beginPath();
        for (let wx = x + 4; wx <= x + w - 4; wx += 4) {
            const wy2 = wy + Math.sin((wx - x) * 0.32 + row * 1.6) * 1.5;
            if (wx === x + 4) ctx.moveTo(wx, wy2);
            else ctx.lineTo(wx, wy2);
        }
        ctx.stroke();
    }
    ctx.restore();

    // Скользкая — единственная с закруглёнными «уголками» сверху.
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 4, y + h + 3);
    ctx.lineTo(x + 4, y + 3);
    ctx.moveTo(x + w - 4, y + 3);
    ctx.lineTo(x + w - 4, y + h + 3);
    ctx.stroke();

    ctx.restore();
}

function drawVerticalPlatform(p) {
    const { x, y, w, h } = p;
    const half = h / 2;

    drawGroundShadow(x + w / 2, y + h + 4, w * 0.46, 4.5, 0.16);

    ctx.save();

    const shape = () => {
        ctx.beginPath();
        ctx.moveTo(x + 9, y);
        ctx.lineTo(x + w - 9, y);
        ctx.lineTo(x + w, y + half);
        ctx.lineTo(x + w - 9, y + h);
        ctx.lineTo(x + 9, y + h);
        ctx.lineTo(x, y + half);
        ctx.closePath();
    };

    const ice = ctx.createLinearGradient(x, y, x + w, y + h);
    ice.addColorStop(0, '#d6f6ff');
    ice.addColorStop(0.42, '#7dd6ef');
    ice.addColorStop(1, '#2b90bb');

    shape();
    ctx.fillStyle = ice;
    ctx.fill();

    ctx.save();
    shape();
    ctx.clip();

    ctx.fillStyle = 'rgba(255,255,255,.34)';
    ctx.beginPath();
    ctx.moveTo(x + 9, y);
    ctx.lineTo(x + w * 0.42, y);
    ctx.lineTo(x + w * 0.30, y + h);
    ctx.lineTo(x + 9, y + h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.62, y);
    ctx.lineTo(x + w - 9, y);
    ctx.lineTo(x + w - 9, y + h);
    ctx.lineTo(x + w * 0.52, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    snowCap(x + 3, y + 1, w - 6, 6);

    shape();
    ctx.strokeStyle = 'rgba(24,96,130,.40)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
}

function drawSpring(s) {
    const { x, y } = s;
    const w = 20;

    drawGroundShadow(x + w / 2, y + 20, 11, 3, 0.22);

    ctx.save();

    const base = ctx.createLinearGradient(0, y + 13, 0, y + 19);
    base.addColorStop(0, '#b6c0ca');
    base.addColorStop(1, '#4a525c');
    roundedRect(x + 1, y + 13.5, w - 2, 5.5, 2.5);
    ctx.fillStyle = base;
    ctx.fill();

    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(x + 4, y + 15, 3, 2.2);
    ctx.fillRect(x + 13, y + 15, 3, 2.2);

    const coil = () => {
        ctx.beginPath();
        ctx.moveTo(x + 10, y + 12.5);
        ctx.lineTo(x + 4, y + 10.5);
        ctx.lineTo(x + 16, y + 8.5);
        ctx.lineTo(x + 4, y + 6.5);
        ctx.lineTo(x + 16, y + 4.5);
        ctx.lineTo(x + 4, y + 2.5);
        ctx.lineTo(x + 10, y + 0.5);
    };

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    coil();
    ctx.strokeStyle = 'rgba(74,44,0,.85)';
    ctx.lineWidth = 4;
    ctx.stroke();

    const brass = ctx.createLinearGradient(x + 4, 0, x + 16, 0);
    brass.addColorStop(0, '#8a5a00');
    brass.addColorStop(0.32, '#ffe9a8');
    brass.addColorStop(0.68, '#e0b030');
    brass.addColorStop(1, '#8a5a00');
    coil();
    ctx.strokeStyle = brass;
    ctx.lineWidth = 2.3;
    ctx.stroke();

    const top = ctx.createLinearGradient(0, y - 1, 0, y + 3);
    top.addColorStop(0, '#ff7b7b');
    top.addColorStop(1, '#b3202a');
    roundedRect(x + 1, y - 1, w - 2, 4, 2);
    ctx.fillStyle = top;
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.5)';
    roundedRect(x + 3, y - 0.4, 8, 1.3, 0.6);
    ctx.fill();

    ctx.restore();
}

function drawCoin(c) {
    const t = frameNow();
    const spin = Math.cos(t * 2.2 + (c.phase || c.x * 0.05));
    const squashX = Math.max(0.12, Math.abs(spin));
    const r = c.r || 9;

    const cx = c.x;
    const cy = c.y + Math.sin(t * 2.6 + (c.phase || 0)) * 1.2;

    const halo = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r * 2.1);
    halo.addColorStop(0, 'rgba(255,214,90,.34)');
    halo.addColorStop(1, 'rgba(255,214,90,0)');
    ctx.save();
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawGroundShadow(cx, c.y + r + 5, r * 0.85, 2.6, 0.14);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(squashX, 1);

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#8a5a00';
    ctx.fill();

    const rim = ctx.createRadialGradient(-r * 0.35, -r * 0.42, r * 0.1, 0, 0, r);
    rim.addColorStop(0, '#fff8c4');
    rim.addColorStop(0.48, '#ffd23f');
    rim.addColorStop(1, '#c98700');

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
    ctx.fillStyle = rim;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, r * 0.68, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(160,104,0,.55)';
    ctx.lineWidth = r * 0.1;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(-r * 0.34, -r * 0.36, r * 0.19, r * 0.3, -0.55, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fill();

    ctx.strokeStyle = 'rgba(150,96,0,.9)';
    ctx.lineWidth = Math.max(0.9, r * 0.11);
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
        const a = (Math.PI / 3) * i;
        ctx.beginPath();
        ctx.moveTo(-Math.cos(a) * r * 0.4, -Math.sin(a) * r * 0.4);
        ctx.lineTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4);
        ctx.stroke();
    }

    ctx.restore();

    if (squashX > 0.85) {
        const sparkle = (squashX - 0.85) / 0.15;
        ctx.save();
        ctx.globalAlpha = sparkle * 0.9;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.3, cy - r * 0.42, r * 0.11, r * 0.2, -0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawBird(bird) {
    const flap = Math.sin(bird.flap);
    const size = bird.size || 1;
    const body = bird.color;
    const accent = bird.accent || '#e8eef4';

    ctx.save();
    ctx.translate(bird.x, bird.y);

    if (bird.vx < 0) ctx.scale(-size, size);
    else ctx.scale(size, size);

    const groundGap = Math.max(0, 540 - bird.y);
    const shadowY = 26 + groundGap * 0.04;
    const shadowAlpha = 0.16 * Math.max(0.15, 1 - groundGap / 460);
    ctx.fillStyle = `rgba(38,74,102,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(0, shadowY, 11, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();

    const tailLen = bird.kind === 'raven' ? 15 : bird.kind === 'swift' ? 11 : 13;
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-8, -3);
    ctx.lineTo(-8 - tailLen, -7);
    ctx.lineTo(-8 - tailLen * 0.82, 0);
    ctx.lineTo(-8 - tailLen, 6);
    ctx.lineTo(-8, 3);
    ctx.closePath();
    ctx.fill();

    const farTipY = -14 + flap * 8;
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(-1, -3);
    ctx.quadraticCurveTo(-8, farTipY + 3, -19, farTipY);
    ctx.quadraticCurveTo(-9, farTipY + 8, 1, 1);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(24,40,58,.35)';
    ctx.lineWidth = 0.7;
    ctx.stroke();

    const bodyGrad = ctx.createLinearGradient(-9, -8, 11, 7);
    bodyGrad.addColorStop(0, body);
    bodyGrad.addColorStop(0.7, body);
    bodyGrad.addColorStop(1, accent);

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(11, -1);
    ctx.bezierCurveTo(10, -7, 2, -9, -6, -6);
    ctx.bezierCurveTo(-11, -4, -11, 4, -5, 6);
    ctx.bezierCurveTo(2, 8, 9, 6, 11, -1);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.34)';
    ctx.beginPath();
    ctx.ellipse(2, 2.6, 6.4, 3.2, 0.16, 0, Math.PI * 2);
    ctx.fill();

    const nearTipY = 12 - flap * 8;
    const wingGrad = ctx.createLinearGradient(0, -4, 4, nearTipY);
    wingGrad.addColorStop(0, accent);
    wingGrad.addColorStop(0.45, body);
    wingGrad.addColorStop(1, body);

    ctx.fillStyle = wingGrad;
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.quadraticCurveTo(7, nearTipY * 0.7 - 2, 15, nearTipY);
    ctx.quadraticCurveTo(6, nearTipY * 0.5 + 5, -2, 3);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(24,40,58,.42)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.strokeStyle = 'rgba(20,32,46,.34)';
    ctx.lineWidth = 0.8;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
        const px = 6 + i * 3.2;
        const py = nearTipY * (0.55 + i * 0.12) + 1;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + 2.2, py + 2.6);
        ctx.stroke();
    }

    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(9, -3, 5, 0, Math.PI * 2);
    ctx.fill();

    const beak = bird.kind === 'raven' ? 8 : bird.kind === 'swift' ? 4.5 : 6;
    ctx.fillStyle = '#f0a02e';
    ctx.beginPath();
    ctx.moveTo(12.5, -4.6);
    ctx.lineTo(12.5 + beak, -2.6);
    ctx.lineTo(12.5, -0.8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#f8fbff';
    ctx.beginPath();
    ctx.arc(10.4, -5, 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#16202e';
    ctx.beginPath();
    ctx.arc(11, -5, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath();
    ctx.arc(11.4, -5.6, 0.5, 0, Math.PI * 2);
    ctx.fill();

    if (bird.kind === 'raven') {
        ctx.strokeStyle = 'rgba(200,60,45,.8)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.arc(9, -6.2, 3.2, Math.PI * 0.85, Math.PI * 1.75);
        ctx.stroke();
    }

    ctx.restore();
}

function drawLifePickup(life) {
    const t = frameNow();

    // Центр совпадает с хитбоксом сбора (x + 9, y + 9), плавает вверх-вниз.
    const cx = life.x + 9;
    const cy = life.y + 9 + Math.sin(t * 2.4) * 1.6;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3.4);

    // Размер дышит, но чуть — чтобы читалось как предмет, а не как мигание.
    const s = 1 + pulse * 0.06;

    ctx.save();

    // Мягкое свечение под предметом.
    const halo = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
    halo.addColorStop(0, `rgba(255,120,140,${0.42 + pulse * 0.18})`);
    halo.addColorStop(0.55, `rgba(255,100,125,${0.12 + pulse * 0.08})`);
    halo.addColorStop(1, 'rgba(255,100,125,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, Math.PI * 2);
    ctx.fill();

    // Форма сердца: два полукруга сверху и острый низ.
    const heartPath = (k) => {
        const hw = 10.5 * k;
        const top = cy - 7 * k;
        ctx.beginPath();
        ctx.moveTo(cx, cy + 10 * k);
        ctx.bezierCurveTo(cx - hw * 1.3, cy + 3 * k, cx - hw * 1.2, top - 4 * k, cx - hw * 0.45, top - 2 * k);
        ctx.bezierCurveTo(cx - hw * 0.2, top - 3 * k, cx, top - 1 * k, cx, top + 2 * k);
        ctx.bezierCurveTo(cx, top - 1 * k, cx + hw * 0.2, top - 3 * k, cx + hw * 0.45, top - 2 * k);
        ctx.bezierCurveTo(cx + hw * 1.2, top - 4 * k, cx + hw * 1.3, cy + 3 * k, cx, cy + 10 * k);
        ctx.closePath();
    };

    // Тень под сердцем — как у монеток, чтобы предмет стоял «в мире».
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#5a1020';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 15, 7, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Тело: глубокий красный от края к центру, светлее сверху.
    heartPath(s);
    const body = ctx.createLinearGradient(cx, cy - 8, cx, cy + 10);
    body.addColorStop(0, '#ff6b7f');
    body.addColorStop(0.55, '#e63946');
    body.addColorStop(1, '#b3202a');
    ctx.fillStyle = body;
    ctx.fill();

    // Тонкий тёмный контур — отделяет сердце от светлого фона.
    heartPath(s);
    ctx.strokeStyle = 'rgba(110,10,25,.55)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Блик: овал в левой верхней доле, создаёт ощущение глянца.
    ctx.save();
    heartPath(s);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.ellipse(cx - 4.2, cy - 4.2, 2.6, 1.6, -0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Три искры по орбите — оживляют предмет и выделяют его среди платформ.
    for (let k = 0; k < 3; k++) {
        const a = t * 1.6 + (Math.PI * 2 * k) / 3;
        const orbit = 15 + Math.sin(t * 3 + k) * 1.2;
        const sx = cx + Math.cos(a) * orbit;
        const sy = cy - 2 + Math.sin(a) * orbit * 0.55;
        const twinkle = 0.5 + 0.5 * Math.sin(t * 5 + k * 2);

        ctx.save();
        ctx.globalAlpha = 0.35 + twinkle * 0.5;
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(255,140,160,.9)';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(sx, sy, 1.2 + twinkle * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    ctx.restore();
}

function drawPlatform(p) {
    if (p.type === 'broken') drawWoodPlatform(p);
    else if (p.type === 'moving') drawIcePlatform(p);
    else if (p.type === 'ice') drawSlipperyIce(p);
    else drawSnowPlatform(p);

}

function drawPlayer() {
    const size = 40;
    const x = player.x - 5;
    const y = player.y - 8;
    const cx = x + size / 2;
    const cy = y + size / 2;
    const radius = size / 2;
    const image = avatarImages[selectedAvatar];
    const speed = Math.abs(player.vx);

    const shadowSquash = player.dy < 0 ? 0.7 : 1;
    drawGroundShadow(
        cx + Math.max(-4, Math.min(4, player.vx * 0.8)),
        y + size + 5,
        radius * 0.95 * shadowSquash,
        4.5 * shadowSquash,
        0.24
    );

    ctx.save();

    if (squash) {
        ctx.translate(cx, cy + radius * 0.7);
        ctx.scale(1 + squash * 0.55, 1 - squash * 0.9);
        ctx.translate(-cx, -(cy + radius * 0.7));
    }

    ctx.beginPath();
    ctx.arc(cx, cy, radius - 0.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(14,38,60,.92)';
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius - 2.5, 0, Math.PI * 2);
    ctx.clip();

    if (image && image.complete && image.naturalWidth > 0) {
        ctx.drawImage(image, x + 2.5, y + 2.5, size - 5, size - 5);
    } else {
        const fallback = ctx.createLinearGradient(x, y, x + size, y + size);
        fallback.addColorStop(0, '#ffd98a');
        fallback.addColorStop(1, '#e0575f');
        ctx.fillStyle = fallback;
        ctx.fillRect(x + 2.5, y + 2.5, size - 5, size - 5);
    }

    const shine = ctx.createLinearGradient(x, y + 2, x, y + size * 0.6);
    shine.addColorStop(0, 'rgba(255,255,255,.34)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.fillRect(x + 2.5, y + 2.5, size - 5, size * 0.6);

    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, radius - 1.4, Math.PI * 1.12, Math.PI * 1.88);
    ctx.strokeStyle = 'rgba(255,255,255,.72)';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, radius - 0.75, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(6,22,40,.9)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    drawFrame(cx, cy, radius - 1, selectedFrame);

    ctx.restore();

    if (speed > 1.2 && currentState === STATE.PLAYING) {
        const puff = Math.min(1, speed / 6);
        ctx.save();
        ctx.fillStyle = `rgba(255,255,255,${0.35 * puff})`;
        for (let i = 0; i < 3; i++) {
            const dx = -Math.sign(player.vx) * (6 + i * 5);
            const dy = size - 4 + i * 2;
            ctx.beginPath();
            ctx.arc(cx + dx, y + dy, 2.4 - i * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
}

/* ============================================================
   ФИЗИКА И ЛОГИКА ЗАБЕГА
   ============================================================ */

const touchInput = { left: false, right: false };
const activePointers = { left: new Set(), right: new Set() };

let tiltEnabled = false;
let tiltDirection = 0;
let neutralGamma = null;
let tiltFeedbackUntil = 0;

function handleTilt(event) {
    if (!tiltEnabled || currentState !== STATE.PLAYING) {
        tiltDirection = 0;
        return;
    }
    if (typeof event.gamma !== 'number') return;
    if (neutralGamma === null) neutralGamma = event.gamma;

    const tilt = event.gamma - neutralGamma;
    const deadZone = 5;

    if (tilt < -deadZone) tiltDirection = -1;
    else if (tilt > deadZone) tiltDirection = 1;
    else tiltDirection = 0;
}

async function enableTilt() {
    if (!('DeviceOrientationEvent' in window)) return;

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') return;
        } catch {
            return;
        }
    }

    tiltEnabled = true;
    neutralGamma = null;
    window.addEventListener('deviceorientation', handleTilt);
    tiltFeedbackUntil = performance.now() + 1800;
}

const mouseControl = { targetX: null, inside: false };

// Чувствительность управления.
const SENS_MIN = 0.4;
const SENS_MAX = 2.0;
const SENS_STEP = 0.2;

function readSens(key) {
    try {
        const raw = localStorage.getItem(key);
        if (raw === null) return 1.0;
        const value = Number(raw) / 10;
        return Number.isFinite(value) ? value : 1.0;
    } catch {
        return 1.0;
    }
}

const controls = {
    key: Math.max(SENS_MIN, Math.min(SENS_MAX, readSens('morjakaKeySens'))),
    mouse: Math.max(SENS_MIN, Math.min(SENS_MAX, readSens('morjakaMouseSens')))
};

function saveControls() {
    try {
        localStorage.setItem('morjakaKeySens', String(Math.round(controls.key * 10)));
        localStorage.setItem('morjakaMouseSens', String(Math.round(controls.mouse * 10)));
    } catch { /* ignore */ }
}

function stepSensitivity(which, direction) {
    const current = controls[which];
    const next = Math.round((current + SENS_STEP * direction) * 10) / 10;
    controls[which] = Math.max(SENS_MIN, Math.min(SENS_MAX, next));
    saveControls();
    sfx.click();
}

function isCoarsePointer() {
    return typeof window.matchMedia === 'function'
        && window.matchMedia('(pointer: coarse)').matches;
}

function inZone(point, zone) {
    return point.x >= zone.x && point.x <= zone.x + zone.w
        && point.y >= zone.y && point.y <= zone.y + zone.h;
}

function update(dt) {
    if (currentState !== STATE.PLAYING) return;

    dt = Math.min(dt, 2);

    // Пока игрок выбирает перк, мир стоит: иначе карточки читаются
    // под летящими платформами и выбор превращается в лотерею.
    if (perkState.offering) return;

    const keyboardOrTouchLeft = keys.ArrowLeft || keys.KeyA || touchInput.left;
    const keyboardOrTouchRight = keys.ArrowRight || keys.KeyD || touchInput.right;
    const tiltLeft = tiltEnabled && tiltDirection < 0;
    const tiltRight = tiltEnabled && tiltDirection > 0;

    if (keyboardOrTouchLeft || keyboardOrTouchRight || tiltLeft || tiltRight) {
        const keyAccel = 1.2 * controls.key;
        if (keyboardOrTouchLeft || tiltLeft) player.vx -= keyAccel * dt;
        if (keyboardOrTouchRight || tiltRight) player.vx += keyAccel * dt;
    } else if (mouseControl.inside && mouseControl.targetX !== null) {
        const playerCenter = player.x + 15;
        const error = mouseControl.targetX - playerCenter;
        const deadZone = 8;
        const maxMouseSpeed = 7 * controls.mouse;

        if (Math.abs(error) <= deadZone) {
            player.vx *= Math.pow(0.65, dt);
        } else {
            const desiredSpeed =
                Math.sign(error) * maxMouseSpeed * Math.min(1, Math.abs(error) / 100);
            const response = 1 - Math.pow(0.62, dt);
            player.vx += (desiredSpeed - player.vx) * response;
        }
    }

    updateWind(dt);
    applyWind(dt);

    const onIce = platforms.some(p =>
        p.type === 'ice' &&
        player.dy >= 0 &&
        Math.abs((player.y + 35) - p.y) < 3 &&
        player.x + 25 > p.x && player.x + 10 < p.x + p.w
    );

    const friction = onIce ? Math.pow(.955, dt) : Math.pow(.85, dt);
    player.vx *= friction;
    player.x += player.vx * dt;
    player.dy += .5464 * dt;
    player.y += player.dy * dt;

    if (squash) {
        squash *= Math.pow(0.82, dt);
        if (Math.abs(squash) < 0.01) squash = 0;
    }

    if (fallCooldown > 0) fallCooldown = Math.max(0, fallCooldown - dt);

    if (player.x < -30) player.x = 400;
    if (player.x > 400) player.x = -30;

    const birdRate = 0.004 + birdGrowth() * 0.0055;
    if (Math.random() < birdRate * dt) spawnBird();

    for (let i = birds.length - 1; i >= 0; i--) {
        const bird = birds[i];

        bird.x += bird.vx * dt;
        bird.flap += bird.flapSpeed * dt;
        bird.hitCooldown = Math.max(0, bird.hitCooldown - dt);

        bird.phase += bird.waveSpeed * dt;
        bird.y = bird.baseY + Math.sin(bird.phase) * bird.wave * 10;

        if (bird.x < -70 || bird.x > 470 || bird.baseY > 620) {
            birds.splice(i, 1);
            continue;
        }

        const playerCenterX = player.x + 15;
        const playerCenterY = player.y + 15;

        const hitHalfW = 20 + bird.size * 9;
        const hitHalfH = 17 + bird.size * 8;

        if (bird.hitCooldown <= 0 &&
            Math.abs(playerCenterX - bird.x) < hitHalfW &&
            Math.abs(playerCenterY - bird.y) < hitHalfH) {

            const pushDirection = playerCenterX < bird.x ? -1 : 1;
            const kind = BIRD_KINDS[bird.kind] || BIRD_KINDS.gull;
            const push = kind.push;
            const scaleBoost = 1 + (bird.size - 1) * 0.25;

            startScreenShake(2.5 + bird.size * 1.4, 12 + Math.round(bird.size * 3));
            player.vx = pushDirection * push * scaleBoost;
            player.dy = -8 - (push - 12) * 0.5;
            player.x += pushDirection * (push * 0.9);

            bird.hitCooldown = 45;
            questState.birdHit = true;

            sfx.hit();
            vibrate(28);
            hudPop(playerCenterX, playerCenterY - 26, 'ОЙ', '#e63946');
        }
    }

    for (const platform of verticalPlatforms) {
        platform.previousY = platform.y;
        platform.phase += platform.speed * dt;
        platform.y = platform.baseY + Math.sin(platform.phase) * 76;
    }

    for (const platform of platforms) {
        if (
            platform.type === 'broken' &&
            platform.breaking &&
            player.dy < 0 &&
            player.y + 35 <= platform.y
        ) {
            platform.falling = true;
            platform.vy = 0;
            fallingPlatforms.push(platform);
            platform.removeAfterBounce = true;
        }

        if (
            player.dy > 0 &&
            !platform.breaking &&
            player.x + 25 > platform.x &&
            player.x + 10 < platform.x + platform.w &&
            player.y + 35 > platform.y &&
            player.y + 35 < platform.y + platform.h + player.dy
        ) {
            player.y = platform.y - 35;
            player.dy = -12.98;
            doubleJumpAvailable = true;
            squash = 0.14;
            sfx.land();

            if (platform.type === 'broken') {
                platform.breaking = true;
                sfx.crack();
            }
        }

        if (platform.type === 'moving') {
            platform.x += platform.dir * dt;

            if (platform.x <= 0 || platform.x + platform.w >= 400) {
                platform.x = Math.max(0, Math.min(400 - platform.w, platform.x));
                platform.dir *= -1;
            }
        }
    }

    const previousPlayerBottom = player.y + 35 - player.dy * dt;
    const currentPlayerBottom = player.y + 35;

    for (const platform of verticalPlatforms) {
        const platformTopBefore = platform.previousY;
        const platformTopNow = platform.y;

        const crossedPlatform =
            previousPlayerBottom <= platformTopBefore + platform.h &&
            currentPlayerBottom >= platformTopNow;

        const overlapsPlatform =
            player.x + 25 > platform.x &&
            player.x + 10 < platform.x + platform.w;

        if (player.dy > 0 && crossedPlatform && overlapsPlatform) {
            player.y = platformTopNow - 35;
            player.dy = -12.98;
            doubleJumpAvailable = true;
            squash = 0.14;
            sfx.land();
            break;
        }
    }

    removeWhere(platforms, platform => platform.removeAfterBounce);

    const fallingGravity = 0.55;

    for (let i = fallingPlatforms.length - 1; i >= 0; i--) {
        const platform = fallingPlatforms[i];
        platform.vy += fallingGravity * dt;
        platform.y += platform.vy * dt;

        if (platform.y > 640) fallingPlatforms.splice(i, 1);
    }

    for (const spring of springs) {
        if (player.dy > 0 &&
            player.x + 25 > spring.x &&
            player.x < spring.x + 20 &&
            player.y + 35 > spring.y &&
            player.y + 35 < spring.y + 20) {

            player.dy = -24;
            doubleJumpAvailable = true;
            squash = -0.3;
            questState.springUsed = true;

            sfx.spring();
            hudPop(spring.x + 10, spring.y - 14, 'ПРЫЖОК', '#f5a623');
        }
    }

    // Магнит: монета в радиусе подтягивается к игроку. На высоких скоростях
    // точное попадание раздражает, а притяжение превращает сбор в удовольствие.
    const magnetR = COIN_MAGNET_RADIUS * (1 + perkState.magnetBonus);
    const playerCx = player.x + 15;
    const playerCy = player.y + 15;
    const magnetR2 = magnetR * magnetR;

    for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];

        if (magnetR > 0) {
            const dx = playerCx - (coin.x + 9);
            const dy = playerCy - (coin.y + 9);
            const d2 = dx * dx + dy * dy;

            if (d2 < magnetR2 && d2 > 1) {
                const d = Math.sqrt(d2);
                const pull = (1 - d / magnetR) * 7.5;
                coin.x += (dx / d) * pull * dt;
                coin.y += (dy / d) * pull * dt;
            }
        }

        if (player.x < coin.x + 20 && player.x + 30 > coin.x &&
            player.y < coin.y + 20 && player.y + 30 > coin.y) {

            const gained = 1 + perkState.coinMultiplier;
            runCoins += gained;
            bankCoins += gained;
            const reachedLife = runCoins % COINS_PER_LIFE === 0;
            if (reachedLife) lives++;

            hudState.coinPulse = 1;
            sfx.coin();
            vibrate(8);
            hudPop(coin.x, coin.y - 8, '+' + gained, '#ffb300');

            if (reachedLife) {
                hudState.lifePulse = 1;
                hudPop(coin.x, coin.y - 22, '+1 ЖИЗНЬ', '#e63946');
            }

            saveProgress();
            coins.splice(i, 1);
        }
    }

    updateQuests(dt);

    // Перк предлагается на каждом пороге 10 000 очков.
    const perkThreshold = Math.floor(player.score / PERK_SCORE_STEP) * PERK_SCORE_STEP;
    if (perkThreshold > 0 && perkThreshold > perkState.lastOfferScore) {
        perkState.lastOfferScore = perkThreshold;
        offerPerk();
    }

    for (let i = lifePickups.length - 1; i >= 0; i--) {
        const life = lifePickups[i];
        if (player.x < life.x + 22 && player.x + 30 > life.x - 4 &&
            player.y < life.y + 22 && player.y + 30 > life.y - 4) {

            lives++;
            hudState.lifePulse = 1;
            sfx.life();
            hudPop(life.x + 8, life.y - 6, '+1 ЖИЗНЬ', '#e63946');
            lifePickups.splice(i, 1);
        }
    }

    if (player.y < 250) {
        const diff = 250 - player.y;
        player.score += diff;

        while (player.score >= nextLifeScore) {
            lives++;
            nextLifeScore += 20000;
            hudState.lifePulse = 1;
        }

        player.y = 250;

        platforms.forEach(platform => platform.y += diff);

        verticalPlatforms.forEach(platform => {
            platform.y += diff;
            platform.baseY += diff;
            platform.previousY += diff;
        });

        springs.forEach(spring => spring.y += diff);
        coins.forEach(coin => coin.y += diff);
        lifePickups.forEach(life => life.y += diff);

        birds.forEach(bird => {
            bird.baseY += diff;
            bird.y += diff;
        });
    }

    removeWhere(platforms, platform => platform.y >= 650);
    removeWhere(verticalPlatforms, platform => platform.baseY >= 650);
    removeWhere(springs, spring => spring.y >= 650);
    removeWhere(coins, coin => coin.y >= 650);
    removeWhere(lifePickups, life => life.y >= 650);

    while (platforms.length < 8) {
        let lastY = 550;
        if (platforms.length) {
            lastY = platforms[0].y;
            for (let k = 1; k < platforms.length; k++) {
                if (platforms[k].y < lastY) lastY = platforms[k].y;
            }
        }
        const y = lastY - platformStep();

        const step = spawnTerrainStep(y);
        for (const p of step.platforms) platforms.push(p);
        for (const v of step.verticals) verticalPlatforms.push(v);

        // Счётчик перка «×2 монеты»: тает по мере появления новых платформ.
        if (perkState.coinPlatsLeft > 0) {
            perkState.coinPlatsLeft--;
            if (perkState.coinPlatsLeft === 0) perkState.coinMultiplier = 0;
        }
    }

    // Перк «доп. прыжок»: вместо потери жизни игрок возвращается в игру.
    if (player.y > 600 && perkState.shieldArmed) {
        perkState.shieldArmed = false;
        startScreenShake(2.5, 10);
        sfx.jump();
        vibrate(24);
        hudPop(player.x + 15, 470, 'ДОП. ПРЫЖОК', '#0f8a76');
        player.y = 500;
        player.dy = -42;
        doubleJumpAvailable = true;
        return;
    }

    if (player.y > 600 && lives > 0) {
        startScreenShake(3.5, 16);
        sfx.fall();
        vibrate(40);
        lives--;
        player.y = 500;
        player.dy = -42;
        doubleJumpAvailable = true;
    } else if (player.y > 600) {
        currentState = STATE.GAMEOVER;
        const finalScore = Math.floor(player.score);
        gameOverState.openedAt = performance.now();
        pauseState.hover = null;
        gameOverState.newRecord = finalScore > 0 && finalScore > highScore;

        if (finalScore > highScore) {
            highScore = finalScore;
            unlockedAvatars = getUnlockedAvatars(highScore);
            if (!unlockedAvatars.includes(selectedAvatar)) selectedAvatar = 0;
            saveProgress();
        }
    }
}

/* ============================================================
   HUD
   ============================================================ */

const HUD_COLORS = {
    ink: '#0f3d5c',
    inkSoft: 'rgba(21,85,118,.60)',
    gold: '#c28000',
    green: '#0f8a76',
    red: '#e63946'
};

const PAUSE_ZONE = { x: 348, y: 8, w: 40, h: 40 };
const TILT_ZONE = { x: 346, y: 46, w: 32, h: 28 };

const hudState = {
    score: 0,
    pops: [],
    coinPulse: 0,
    lifePulse: 0,
    jumpPulse: 0,
    wasJumpReady: false
};

function resetHud() {
    hudState.score = 0;
    hudState.pops.length = 0;
    hudState.coinPulse = 0;
    hudState.lifePulse = 0;
    hudState.jumpPulse = 0;
    hudState.wasJumpReady = false;
}

function hudPop(x, y, text, color) {
    hudState.pops.push({ x, y, text, color: color || HUD_COLORS.gold, life: 1 });
}

function updateHud(dt) {
    if (player.score < hudState.score) hudState.score = player.score;
    else {
        hudState.score += (player.score - hudState.score) * Math.min(1, 0.22 * dt);
        if (player.score - hudState.score < 0.6) hudState.score = player.score;
    }

    const jumpReady = doubleJumpAvailable && currentState === STATE.PLAYING;
    if (jumpReady && !hudState.wasJumpReady) hudState.jumpPulse = 1;
    hudState.wasJumpReady = jumpReady;

    hudState.coinPulse = Math.max(0, hudState.coinPulse - dt / 16);
    hudState.lifePulse = Math.max(0, hudState.lifePulse - dt / 22);
    hudState.jumpPulse = Math.max(0, hudState.jumpPulse - dt / 18);

    for (let i = hudState.pops.length - 1; i >= 0; i--) {
        const pop = hudState.pops[i];
        pop.life -= dt / 50;
        pop.y -= 0.55 * dt;
        if (pop.life <= 0) hudState.pops.splice(i, 1);
    }
}

function drawHudPops() {
    for (const pop of hudState.pops) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, pop.life * 1.7);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(11, 'bold');
        ctx.lineWidth = 2.6;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255,255,255,.92)';
        ctx.strokeText(pop.text, pop.x, pop.y);
        ctx.fillStyle = pop.color;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();
    }
}

function drawHudChip(x, y, w, h, glow) {
    ctx.save();
    ctx.shadowColor = glow || 'rgba(12,40,64,.16)';
    ctx.shadowBlur = glow ? 12 : 8;
    ctx.shadowOffsetY = 3;
    roundedRect(x, y, w, h, h / 2);
    ctx.fillStyle = 'rgba(255,255,255,.84)';
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    roundedRect(x + 0.5, y + 0.5, w - 1, h - 1, h / 2);
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
}

function drawCoinBadge(x, y, r, progress) {
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.2, x, y, r);
    g.addColorStop(0, '#fff4a3');
    g.addColorStop(0.62, '#ffc928');
    g.addColorStop(1, '#d88900');
    ctx.save();
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    if (progress > 0.001) {
        ctx.strokeStyle = HUD_COLORS.green;
        ctx.lineWidth = 1.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(x, y, r + 2.8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
        ctx.stroke();
    }
    ctx.restore();
}

function drawPauseGlyph(cx, cy, s, color) {
    ctx.save();
    ctx.fillStyle = color;
    const w = s * 0.34, h = s;
    roundedRect(cx - s * 0.42, cy - h / 2, w, h, w * 0.34);
    ctx.fill();
    roundedRect(cx + s * 0.42 - w, cy - h / 2, w, h, w * 0.34);
    ctx.fill();
    ctx.restore();
}

function drawTiltGlyph(cx, cy, s, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.28);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.3;
    roundedRect(-s * 0.36, -s * 0.62, s * 0.72, s * 1.24, s * 0.18);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.fillRect(-s * 0.1, s * 0.42, s * 0.2, s * 0.08);
    ctx.restore();
}

function drawHudButtons() {
    const playing = currentState === STATE.PLAYING;
    ctx.save();

    const px = PAUSE_ZONE.x, py = PAUSE_ZONE.y;
    const pw = PAUSE_ZONE.w, ph = PAUSE_ZONE.h;

    ctx.save();
    ctx.shadowColor = 'rgba(12,40,64,.22)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    roundedRect(px, py, pw, ph, 12);
    ctx.fillStyle = playing ? 'rgba(15,35,55,.46)' : 'rgba(15,35,55,.26)';
    ctx.fill();
    ctx.restore();

    roundedRect(px + 0.5, py + 0.5, pw - 1, ph - 1, 12);
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1;
    ctx.stroke();

    drawPauseGlyph(px + pw / 2, py + ph / 2, 12, 'rgba(255,255,255,.92)');

    if (isCoarsePointer()) {
        const tx = TILT_ZONE.x, ty = TILT_ZONE.y;
        const tw = TILT_ZONE.w, th = TILT_ZONE.h;

        ctx.save();
        roundedRect(tx, ty, tw, th, th / 2);
        ctx.fillStyle = tiltEnabled ? 'rgba(15,138,118,.55)' : 'rgba(15,35,55,.34)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();

        drawTiltGlyph(tx + tw / 2, ty + th / 2, 11, tiltEnabled ? '#ffffff' : 'rgba(255,255,255,.72)');
    }

    ctx.restore();
}

function drawHud() {
    const t = performance.now() / 1000;
    const bigScore = Math.floor(hudState.score);

    const scrim = ctx.createLinearGradient(0, 0, 0, 120);
    scrim.addColorStop(0, 'rgba(6,26,44,.52)');
    scrim.addColorStop(0.66, 'rgba(6,26,44,.30)');
    scrim.addColorStop(1, 'rgba(6,26,44,0)');
    ctx.fillStyle = scrim;
    ctx.fillRect(0, 0, 400, 120);

    ctx.save();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    ctx.shadowColor = 'rgba(4,20,36,.85)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 1;

    setFont(7.5, 'bold');
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    trackedText('СЧЁТ', 15, 15, 2, 'left');

    setFont(27, 'bold');
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(4,20,36,.9)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 1.5;
    trackedText(fmt(bigScore), 15, 36, 0.6, 'left');

    ctx.shadowColor = 'rgba(4,20,36,.85)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetY = 1;

    const beatingRecord = Math.floor(player.score) > highScore && highScore > 0;
    setFont(7.5, 'bold');

    if (beatingRecord) {
        const pulse = 0.72 + 0.28 * Math.sin(t * 4);
        ctx.fillStyle = `rgba(255,214,102,${pulse})`;
        trackedText('НОВЫЙ РЕКОРД', 15, 53, 1.6, 'left');
    } else {
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        trackedText(`РЕКОРД ${fmt(highScore)}`, 15, 53, 1.4, 'left');
    }
    ctx.restore();

    let chipX = 15;
    const chipY = 64, chipH = 22;

    setFont(11, 'bold');
    const livesText = String(Math.min(lives, 999));
    const livesW = Math.max(46, 30 + ctx.measureText(livesText).width + 12);
    drawHudChip(chipX, chipY, livesW, chipH, hudState.lifePulse > 0 ? 'rgba(230,57,70,.75)' : null);

    const heartScale = 5.2 + hudState.lifePulse * 1.6;
    drawHeart(chipX + 15, chipY + chipH / 2 - 1.3, heartScale,
        hudState.lifePulse > 0 ? '#ff4d5e' : HUD_COLORS.red);

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    setFont(11, 'bold');
    ctx.fillStyle = HUD_COLORS.ink;
    ctx.fillText(livesText, chipX + 26, chipY + chipH / 2 + 0.5);
    ctx.restore();

    chipX += livesW + 6;

    const coinProgress = (runCoins % COINS_PER_LIFE) / COINS_PER_LIFE;
    setFont(11, 'bold');
    const coinText = `${runCoins % COINS_PER_LIFE}/${COINS_PER_LIFE}`;
    const coinW = 30 + ctx.measureText(coinText).width + 12;
    drawHudChip(chipX, chipY, coinW, chipH, hudState.coinPulse > 0 ? 'rgba(194,128,0,.7)' : null);

    const coinR = 7 + hudState.coinPulse * 1.8;
    drawCoinBadge(chipX + 16, chipY + chipH / 2, coinR, coinProgress);

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    setFont(8.5, 'bold');
    ctx.fillStyle = HUD_COLORS.gold;
    ctx.fillText(coinText, chipX + 28, chipY + chipH / 2 + 0.5);
    ctx.restore();

    chipX += coinW + 6;

    const jumpReady = doubleJumpAvailable && currentState === STATE.PLAYING;
    const jumpW = 62;
    drawHudChip(chipX, chipY, jumpW, chipH,
        jumpReady ? `rgba(15,138,118,${0.45 + hudState.jumpPulse * 0.4})` : null);

    ctx.save();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    const arrowColor = jumpReady ? HUD_COLORS.green : 'rgba(21,85,118,.30)';
    ctx.strokeStyle = arrowColor;
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < 2; i++) {
        const yy = chipY + chipH / 2 + 3 - i * 4.6;
        ctx.beginPath();
        ctx.moveTo(chipX + 13, yy);
        ctx.lineTo(chipX + 17.5, yy - 3.4);
        ctx.lineTo(chipX + 22, yy);
        ctx.stroke();
    }
    ctx.lineCap = 'butt';

    setFont(8.5, 'bold');
    ctx.fillStyle = jumpReady ? HUD_COLORS.green : 'rgba(21,85,118,.34)';
    ctx.fillText('×2', chipX + 28, chipY + chipH / 2 + 0.5);
    ctx.restore();

    let questPlateAlpha = 1;

    if (questState.active && questState.done && questState.doneAt) {
        const elapsed = performance.now() - questState.doneAt;

        if (elapsed >= QUEST_DONE_SHOW_MS) {
            questPlateAlpha = 0;
        } else if (elapsed > QUEST_DONE_SHOW_MS - QUEST_DONE_FADE_MS) {
            questPlateAlpha = (QUEST_DONE_SHOW_MS - elapsed) / QUEST_DONE_FADE_MS;
        }
    }

    const hasQuest = !!questState.active && questPlateAlpha > 0;
    const hasWind = wind.active;

    if (hasQuest || hasWind) {
        ctx.save();
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        setFont(7, 'bold');

        let label = '';
        let color = '#0f3d5c';

        if (hasQuest) {
            const done = questState.done;
            const failed = questState.failed;
            const q = questState.active;
            const shown = Math.min(questState.progress, q.target);

            label = failed ? 'ЗАДАНИЕ ПРОВАЛЕНО'
                : done ? `ВЫПОЛНЕНО  +${q.reward}`
                : `${q.label}  ${shown}/${q.target}`;
            color = failed ? '#b3202a' : done ? '#0a6b4a' : '#0f3d5c';
        }

        const labelWidth = label ? trackedWidth(label, 1.2) : 0;

        const arrow = wind.dir < 0 ? '←' : wind.dir > 0 ? '→' : '·';
        const windLabel = hasWind ? 'ВЕТЕР ' + arrow : '';
        const windWidth = windLabel ? trackedWidth(windLabel, 2) : 0;

        const padX = 9, gap = 14;
        const totalWidth = labelWidth + (label && windLabel ? gap : 0) + windWidth;
        const plateW = totalWidth + padX * 2;

        const plateX = 15;
        const textX = plateX + padX;

        roundedRect(plateX, 94, plateW, 17, 8.5);
        ctx.fillStyle = 'rgba(255,255,255,.90)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(15,61,92,.22)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.save();
        ctx.globalAlpha = questPlateAlpha;
        ctx.fillStyle = color;
        if (label) trackedText(label, textX, 102.5, 1.2, 'left');
        ctx.restore();

        if (windLabel) {
            const warning = wind.warn > 0;

            if (warning) {
                const pulse = 0.55 + 0.45 * Math.sin(t * 10);
                ctx.fillStyle = `rgba(168,107,0,${0.55 + pulse * 0.45})`;
            } else {
                const strength = Math.abs(wind.force);
                const shade = Math.round(61 - strength * 30);
                ctx.fillStyle = `rgb(${shade},${shade + 40},${shade + 70})`;
            }

            setFont(7, 'bold');
            trackedText(windLabel, textX + labelWidth + (label ? gap : 0), 102.5, 2, 'left');
        }

        ctx.restore();
    }

    drawHudButtons();

    if (performance.now() < tiltFeedbackUntil) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, (tiltFeedbackUntil - performance.now()) / 320);
        ctx.textBaseline = 'middle';
        setFont(7.5, 'bold');
        const label = 'НАКЛОН ВКЛЮЧЁН';
        const w = trackedWidth(label, 1.6) + 20;
        const bx = 400 - w - 15;
        roundedRect(bx, 94, w, 17, 8.5);
        ctx.fillStyle = 'rgba(15,138,118,.88)';
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        trackedText(label, bx + w / 2, 103, 1.6);
        ctx.restore();
    }

    drawHudPops();
}

function drawDangerVignette() {
    if (currentState !== STATE.PLAYING) return;

    const depth = Math.max(0, Math.min(1, (player.y - 470) / 120));
    if (depth <= 0.02) return;

    const pulse = 0.72 + 0.28 * Math.sin(performance.now() / 130);
    const alpha = 0.40 * depth * pulse;

    const g = ctx.createRadialGradient(200, 300, 130, 200, 300, 350);
    g.addColorStop(0, 'rgba(210,32,44,0)');
    g.addColorStop(0.72, `rgba(210,32,44,${(alpha * 0.45).toFixed(3)})`);
    g.addColorStop(1, `rgba(210,32,44,${alpha.toFixed(3)})`);
    ctx.save();
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 400, 600);
    ctx.restore();
}

function sensMinusZone(row) {
    return { x: row.x + 8, y: row.y + 18, w: 22, h: 18 };
}

function sensPlusZone(row) {
    return { x: row.x + row.w - 30, y: row.y + 18, w: 22, h: 18 };
}

function sensHitTest(point) {
    for (const row of SENS_ROWS) {
        if (point.x < row.x || point.x > row.x + row.w) continue;
        if (point.y < row.y || point.y > row.y + row.h) continue;

        const minus = sensMinusZone(row);
        if (point.x >= minus.x && point.x <= minus.x + minus.w &&
            point.y >= minus.y && point.y <= minus.y + minus.h) {
            return { row, action: -1 };
        }

        const plus = sensPlusZone(row);
        if (point.x >= plus.x && point.x <= plus.x + plus.w &&
            point.y >= plus.y && point.y <= plus.y + plus.h) {
            return { row, action: 1 };
        }
    }
    return null;
}

function pauseButtonAt(point) {
    for (const button of PAUSE_BUTTONS) {
        if (point.x >= button.x && point.x <= button.x + button.w &&
            point.y >= button.y && point.y <= button.y + button.h) {
            return button;
        }
    }
    return null;
}

function commitRunScore() {
    const finalScore = Math.floor(player.score);
    if (finalScore <= highScore) return;

    highScore = finalScore;
    unlockedAvatars = getUnlockedAvatars(highScore);
    if (!unlockedAvatars.includes(selectedAvatar)) selectedAvatar = 0;
    saveProgress();
}

function drawPauseButton(button, alpha) {
    const { x, y, w, h, variant } = button;
    const hovered = pauseState.hover === button.id;

    ctx.save();
    ctx.globalAlpha = alpha;

    if (variant === 'primary') {
        ctx.shadowColor = 'rgba(10,60,52,.34)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 6;
        roundedRect(x, y, w, h, 16);
        const fill = ctx.createLinearGradient(x, y, x, y + h);
        fill.addColorStop(0, hovered ? '#2ac4ac' : '#22b6a0');
        fill.addColorStop(1, hovered ? '#159278' : '#12856f');
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        roundedRect(x + 6, y + 4, w - 12, h * 0.42, 12);
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        ctx.fill();
    } else if (variant === 'ghost') {
        roundedRect(x, y, w, h, 14);
        ctx.fillStyle = hovered ? 'rgba(21,85,118,.12)' : 'rgba(21,85,118,.055)';
        ctx.fill();
        roundedRect(x + 0.5, y + 0.5, w - 1, h - 1, 14);
        ctx.strokeStyle = 'rgba(21,85,118,.14)';
        ctx.lineWidth = 1;
        ctx.stroke();
    } else {
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2);
        ctx.fillStyle = hovered ? 'rgba(21,85,118,.15)' : 'rgba(21,85,118,.07)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(21,85,118,.14)';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    const cx = x + w / 2;
    const cy = y + h / 2;

    if (variant === 'close') {
        const s = 5;
        ctx.strokeStyle = 'rgba(21,85,118,.75)';
        ctx.lineWidth = 1.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx - s, cy - s);
        ctx.lineTo(cx + s, cy + s);
        ctx.moveTo(cx + s, cy - s);
        ctx.lineTo(cx - s, cy + s);
        ctx.stroke();
        ctx.restore();
        return;
    }

    ctx.textBaseline = 'middle';
    ctx.fillStyle = variant === 'primary' ? '#ffffff' : '#0f3d5c';
    setFont(button.size || 12, 'bold');

    const labelWidth = trackedWidth(button.label, 1.2);
    const shift = button.icon === 'play' ? 9 : 0;
    const mainY = button.sub ? cy - 7 : cy;

    trackedText(button.label, cx + shift, mainY, 1.2);

    if (button.icon === 'play') {
        const tx = cx + shift - labelWidth / 2 - 11;
        ctx.beginPath();
        ctx.moveTo(tx, mainY - 6);
        ctx.lineTo(tx + 9, mainY);
        ctx.lineTo(tx, mainY + 6);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
    }

    if (button.sub) {
        setFont(7, 'bold');
        ctx.fillStyle = 'rgba(255,255,255,.72)';
        trackedText(button.sub, cx, cy + 9, 1.6);
    }

    ctx.restore();
}

function drawSensRow(row, alpha) {
    const { x, y, w, h, id, label } = row;
    const value = controls[id];
    const hovered = pauseState.hover === id;

    ctx.save();
    ctx.globalAlpha = alpha;

    roundedRect(x, y, w, h, 14);
    ctx.fillStyle = hovered ? 'rgba(21,85,118,.12)' : 'rgba(21,85,118,.055)';
    ctx.fill();
    roundedRect(x + 0.5, y + 0.5, w - 1, h - 1, 14);
    ctx.strokeStyle = 'rgba(21,85,118,.14)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(6.6, 'bold');
    ctx.fillStyle = 'rgba(21,85,118,.55)';
    trackedText(label, x + w / 2, y + 10, 1.2);

    for (const [zone, sign] of [[sensMinusZone(row), -1], [sensPlusZone(row), 1]]) {
        const enabled = sign < 0 ? value > SENS_MIN + 0.01 : value < SENS_MAX - 0.01;

        roundedRect(zone.x, zone.y, zone.w, zone.h, 6);
        ctx.fillStyle = enabled ? 'rgba(21,85,118,.10)' : 'rgba(21,85,118,.04)';
        ctx.fill();

        ctx.strokeStyle = enabled ? 'rgba(15,61,92,.85)' : 'rgba(15,61,92,.25)';
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(zone.x + 7, zone.y + zone.h / 2);
        ctx.lineTo(zone.x + zone.w - 7, zone.y + zone.h / 2);
        if (sign > 0) {
            ctx.moveTo(zone.x + zone.w / 2, zone.y + 5);
            ctx.lineTo(zone.x + zone.w / 2, zone.y + zone.h - 5);
        }
        ctx.stroke();
    }

    const barX = x + 34;
    const barW = w - 68;
    const barY = y + 24;
    const barH = 5;

    roundedRect(barX, barY, barW, barH, 2.5);
    ctx.fillStyle = 'rgba(21,85,118,.12)';
    ctx.fill();

    const fill = (value - SENS_MIN) / (SENS_MAX - SENS_MIN);
    if (fill > 0.001) {
        roundedRect(barX, barY, Math.max(3, barW * fill), barH, 2.5);
        const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, '#7fbfe0');
        grad.addColorStop(1, '#12856f');
        ctx.fillStyle = grad;
        ctx.fill();
    }

    ctx.strokeStyle = 'rgba(21,85,118,.18)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const dx = barX + (barW / 4) * i;
        ctx.beginPath();
        ctx.moveTo(dx, barY - 1.5);
        ctx.lineTo(dx, barY + barH + 1.5);
        ctx.stroke();
    }

    ctx.textAlign = 'center';
    setFont(7, 'bold');
    ctx.fillStyle = '#0f3d5c';
    trackedText('×' + value.toFixed(1), x + w / 2, y + 35, 0.8);

    ctx.restore();
}

function drawPauseMenu() {
    const elapsed = performance.now() - pauseState.openedAt;
    const progress = Math.min(1, elapsed / 170);
    const alpha = 1 - Math.pow(1 - progress, 3);

    const score = Math.floor(player.score);
    const beating = highScore > 0 && score > highScore;
    const remaining = Math.max(0, highScore - score);

    drawPauseScrim(alpha);
    drawPausePanel(alpha);
    drawPauseHeader(alpha);
    drawPauseScore(alpha);

    ctx.save();
    ctx.globalAlpha = alpha;

    drawPauseStatCard(52, 240, 94, 50, 'ЖИЗНИ', String(Math.min(lives, 999)),

    drawPauseStatCard(153, 240, 94, 50, 'МОНЕТЫ', String(runCoins),
        (cx, cy) => drawCoinBadge(cx, cy, 6.4, (runCoins % COINS_PER_LIFE) / COINS_PER_LIFE));

    drawPauseStatCard(254, 240, 94, 50, 'ДО РЕКОРДА',
        beating ? 'ПОБИТ' : (highScore > 0 ? fmt(remaining) : '—'),
        (cx, cy) => drawSparkle(cx, cy, 5, beating ? '#0f8a76' : '#5b8aa6'));

    ctx.restore();

    for (const row of SENS_ROWS) drawSensRow(row, alpha);
    for (const button of PAUSE_BUTTONS) drawPauseButton(button, alpha);

    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(7, 'bold');
    ctx.fillStyle = 'rgba(21,85,118,.45)';

        isCoarsePointer()

            : 'ESC — ПРОДОЛЖИТЬ · R — ЗАНОВО',
        200, 472, 1.2
    );
    ctx.restore();
}

function ensureGameOverCache() {
    if (gameOverCache.canvas) return true;

    const cv = document.createElement('canvas');
    cv.width = 400 * RENDER_SCALE;
    cv.height = 600 * RENDER_SCALE;

    const cacheCtx = cv.getContext('2d');
    if (!cacheCtx) return false;

    cacheCtx.scale(RENDER_SCALE, RENDER_SCALE);
    gameOverCache.canvas = cv;
    gameOverCache.cacheCtx = cacheCtx;
    return true;
}

function drawGameOver() {
    if (!gameOverState.openedAt) gameOverState.openedAt = performance.now();

    const score = Math.floor(player.score);

    ctx.save();
    ctx.fillStyle = gameOverScrim();
    ctx.fillRect(0, 0, 400, 600);
    ctx.restore();

    const key = gameOverCacheKey(score);

    if (ensureGameOverCache() && gameOverCache.key !== key) {
        const cacheCtx = gameOverCache.cacheCtx;

        cacheCtx.clearRect(0, 0, 400, 600);

        const mainCtx = ctx;
        ctx = cacheCtx;
        try {
            drawGameOverCard(score);
        } finally {
            ctx = mainCtx;
        }

        gameOverCache.key = key;
    }

    const progress = Math.min(1, (performance.now() - gameOverState.openedAt) / 260);
    const alpha = 1 - Math.pow(1 - progress, 3);

    ctx.save();
    ctx.globalAlpha = alpha;

    if (gameOverCache.canvas) {
        ctx.drawImage(gameOverCache.canvas, 0, 0, 400, 600);
    } else {
        drawGameOverCard(score);
    }

    ctx.restore();
}
