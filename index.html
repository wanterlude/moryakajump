<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Моряка Jump</title>

<!-- Стили встроены: страница должна открываться двойным кликом,
     без сервера и без внешних запросов. -->
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101a35}
body{min-height:100vh;min-height:100dvh;padding:12px 0;display:flex;justify-content:center;align-items:center;overflow:auto;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}
#gameStage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative}
#game{display:block;width:min(600px,94vw,calc((100dvh - 75px)*2/3));height:auto;aspect-ratio:2/3;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
#gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;gap:0;background:#101a35}
#gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-width:none;max-height:none;border-radius:0}
#toolbar{display:flex;gap:10px;align-items:center;justify-content:center}
#fullscreenButton{width:52px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;font:28px Arial,sans-serif;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#soundButton{width:52px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:0}
#soundButton svg{display:block}
#soundButton .spkCross{display:none}
#soundButton.muted .spkWave,#soundButton.muted .spkWave2{display:none}
#soundButton.muted .spkCross{display:inline}
#soundButton.muted{color:rgba(255,255,255,.55)}
#soundButton:hover,#fullscreenButton:hover{background:rgba(255,255,255,.22)}
#soundButton:active,#fullscreenButton:active,#resetButton:active{transform:scale(.96)}
#resetButton{width:52px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,110,110,.55);border-radius:14px;background:rgba(200,50,60,.20);color:#ffb3b8;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:0;transition:background .15s ease,color .15s ease}
#resetButton svg{display:block}
#resetButton:hover{background:rgba(220,60,70,.38);color:#fff}
#resetButton:active{transform:scale(.96)}
#gameStage:fullscreen #toolbar{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10}
#resetOverlay{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,16,32,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#resetOverlay.open{display:flex}
#resetCard{width:min(340px,92vw);padding:22px 22px 18px;border-radius:20px;background:linear-gradient(180deg,#1b2f4d,#132540);border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 60px rgba(0,0,0,.55);text-align:center;color:#eaf4ff;animation:resetIn .18s ease-out}
@keyframes resetIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
#resetCard h2{margin:0 0 8px;font-size:17px;letter-spacing:.4px;color:#fff}
#resetCard p{margin:0 0 18px;font-size:12.5px;line-height:1.5;color:rgba(210,228,246,.78)}
#resetCard .warn{display:block;margin-top:6px;font-size:11px;color:#ffb3b8}
#resetActions{display:flex;gap:10px}
#resetActions button{flex:1;padding:12px 10px;border-radius:13px;border:1px solid transparent;font:bold 12.5px Arial,sans-serif;letter-spacing:.5px;cursor:pointer;touch-action:manipulation;transition:filter .15s ease,transform .1s ease}
#resetActions button:active{transform:scale(.97)}
#resetCancel{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22);color:#dce9f7}
#resetCancel:hover{background:rgba(255,255,255,.18)}
#resetConfirm{background:linear-gradient(180deg,#e85a63,#c8323c);color:#fff}
#resetConfirm:hover{filter:brightness(1.08)}
#nickOverlay{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,16,32,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#nickOverlay.open{display:flex}
#nickCard{width:min(340px,92vw);padding:22px 22px 18px;border-radius:20px;background:linear-gradient(180deg,#1b2f4d,#132540);border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 60px rgba(0,0,0,.55);text-align:center;color:#eaf4ff;animation:resetIn .18s ease-out}
#nickCard h2{margin:0 0 8px;font-size:17px;letter-spacing:.4px;color:#fff}
#nickCard p{margin:0 0 14px;font-size:12.5px;line-height:1.5;color:rgba(210,228,246,.78)}
#nickInput{width:100%;padding:12px 14px;border-radius:13px;border:1px solid rgba(255,255,255,.22);background:rgba(6,16,32,.55);color:#fff;font:bold 16px "Trebuchet MS","Segoe UI",Arial,sans-serif;text-align:center;letter-spacing:.6px;outline:none;user-select:text;-webkit-user-select:text;touch-action:manipulation}
#nickInput::placeholder{color:rgba(210,228,246,.42);font-weight:normal;letter-spacing:.3px}
#nickInput:focus{border-color:rgba(120,220,255,.6);box-shadow:0 0 0 3px rgba(80,190,240,.18)}
#nickActions{display:flex;gap:10px;margin-top:14px}
#nickActions button{flex:1;padding:12px 10px;border-radius:13px;border:1px solid transparent;font:bold 12.5px Arial,sans-serif;letter-spacing:.5px;cursor:pointer;touch-action:manipulation;transition:filter .15s ease,transform .1s ease}
#nickActions button:active{transform:scale(.97)}
#nickCancel{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22);color:#dce9f7}
#nickCancel:hover{background:rgba(255,255,255,.18)}
#nickConfirm{background:linear-gradient(180deg,#22a884,#0f8a76);color:#fff}
#nickConfirm:hover{filter:brightness(1.08)}
#pauseButton,#tiltButton{display:none!important}
@media (max-width:600px) and (pointer:coarse){
    html,body{width:100%;height:100%;min-height:100%;overflow:hidden;overscroll-behavior:none}
    body{padding:max(6px, env(safe-area-inset-top)) 0}
    #gameStage{width:100%;gap:8px}
    #game{width:min(96vw,calc((100dvh - 120px)*2/3));max-height:calc(100dvh - 120px);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.38)}
    #fullscreenButton{display:none}
    #gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-height:none;border-radius:0}
    #gameStage:fullscreen #toolbar{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
}
@media (max-width:900px) and (pointer:coarse) and (orientation:landscape){
    body{padding:0}
    #gameStage{height:100dvh;gap:4px}
    #game{width:auto;height:calc(100dvh - 54px);max-width:68vw;border-radius:10px}
}

/* Отключаем выделение и iOS long-press callout по всей странице игры.
   Поле ника остаётся редактируемым для ввода, но текст в нём нельзя выделить. */
html, body, body * {
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>
<div id="gameStage">
<canvas id="game" width="1600" height="2400" aria-label="Игра Моряка Jump"></canvas>
<div id="toolbar">
    <button id="soundButton" type="button" aria-label="Выключить звук" title="Звук включён">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path class="spkBody" d="M4 9.2h3.1L11.6 5v14L7.1 14.8H4z" fill="currentColor"/>
            <path class="spkWave" d="M15 8.6a4.2 4.2 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path class="spkWave2" d="M17.8 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
            <path class="spkCross" d="M15.6 9.2l5 5.6M20.6 9.2l-5 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </button>
    <button id="fullscreenButton" type="button" aria-label="Включить полноэкранный режим">⛶</button>
    <button id="resetButton" type="button" aria-label="Сбросить прогресс" title="Сбросить прогресс">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M5 7h14M10 7V5.4c0-.5.4-.9.9-.9h2.2c.5 0 .9.4.9.9V7M7.2 7l.8 11.2c.05.7.63 1.2 1.33 1.2h5.34c.7 0 1.28-.5 1.33-1.2L16.8 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.4 10.6v6M13.6 10.6v6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
        </svg>
    </button>
</div>
<div id="resetOverlay" role="dialog" aria-modal="true" aria-labelledby="resetTitle" aria-hidden="true">
    <div id="resetCard">
        <h2 id="resetTitle">Сбросить прогресс?</h2>
        <p>
            Вы уверены что хотите сбросить прогресс?
            <span class="warn">Рекорд, монеты, рамки и аватары будут удалены безвозвратно.</span>
        </p>
        <div id="resetActions">
            <button id="resetCancel" type="button">ОТМЕНА</button>
            <button id="resetConfirm" type="button">СБРОСИТЬ</button>
        </div>
    </div>
</div>
<div id="nickOverlay" role="dialog" aria-modal="true" aria-labelledby="nickTitle" aria-hidden="true">
    <div id="nickCard">
        <h2 id="nickTitle">Как вас подписать?</h2>
        <p>Имя появится на картинке с вашим счётом.</p>
        <input id="nickInput" type="text" maxlength="20" autocomplete="off"
               autocapitalize="words" spellcheck="false" placeholder="Ваше имя">
        <div id="nickActions">
            <button id="nickCancel" type="button">ОТМЕНА</button>
            <button id="nickConfirm" type="button">ПОДЕЛИТЬСЯ</button>
        </div>
    </div>
</div>
</div>

    ctx.globalAlpha = alpha;
    ctx.save();
    roundedRect(x, y, w, h, 14);
    ctx.clip();
    const bar = ctx.createLinearGradient(x, y, x, y + 54);
    bar.addColorStop(0, info.color);
    bar.addColorStop(1, "rgba(255,255,255,0)");
    ctx.globalAlpha = alpha * (0.16 + pulse * 0.08);
    ctx.fillStyle = bar;
    ctx.fillRect(x, y, w, 54);
    if (legend) {

      const shine = ctx.createLinearGradient(x, y + h, x + w, y);
      shine.addColorStop(0, "rgba(255,215,90,0)");
      shine.addColorStop(0.5, "#ffd75a");
      shine.addColorStop(1, "rgba(255,215,90,0)");

      ctx.fillRect(x, y, w, h);
    }
    ctx.restore();
    ctx.globalAlpha = alpha;
    roundedRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 14);
    ctx.strokeStyle = hovered ? info.color : hexToRgba(info.color, 0.55);
    ctx.lineWidth = hovered ? info.ring + 0.6 : info.ring;
    ctx.stroke();
    ctx.save();
    ctx.textBaseline = "middle";
    const pips = { common: 1, rare: 2, epic: 3, legendary: 1 }[card.rarity] || 1;
    const pipY = y + 9;
    const pipStart = x + w / 2 - (pips - 1) * 4.5;
    ctx.fillStyle = hexToRgba(info.color, 0.9);
    for (let k = 0; k < pips; k++) {
      const px = pipStart + k * 9;
      if (legend) {
        ctx.beginPath();
        ctx.moveTo(px, pipY - 4.5);
        ctx.lineTo(px + 4.5, pipY);
        ctx.lineTo(px, pipY + 4.5);
        ctx.lineTo(px - 4.5, pipY);
        ctx.closePath();

        ctx.beginPath();

        ctx.beginPath();
        ctx.arc(px, pipY, 2.1, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    setFont(4.8, "bold");
    ctx.fillStyle = hexToRgba(info.color, 0.95);
    trackedText(info.label, x + w / 2, y + 21, 0.7);
    ctx.restore();
    drawPerkIcon(card.icon, x + w / 2, y + 52, info.color);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const titleSize = fitTextSize(card.title, w - 12, 0.3, 9.5, 6);
    setFont(titleSize, "bold");
    ctx.fillStyle = info.color;
    trackedText(card.title, x + w / 2, y + 90, 0.3);
    const textW = w - 12;
    const hintLines = wrapLines(card.hint, textW, 0.5);
    const durationText = perkDurationText(card);
    const subText = durationText ? card.hint2 && /счёт\s*\+/.test(card.hint2) ? card.hint2.replace(/счёт\s*\+[\s\d]+/, durationText) : durationText : card.hint2;
    const hint2Lines = subText ? wrapLines(subText, textW, 0.4) : [];
    let hintLH = 9.8;
    let hint2LH = 8.8;
    let blockGap = 5;
    const availTop = y + 104;
    const availBottom = y + h - 12;
    const avail = availBottom - availTop;
    const blockHeight = () => hintLines.length * hintLH + (hint2Lines.length ? blockGap + hint2Lines.length * hint2LH : 0);
    if (blockHeight() > avail) {
      const k = avail / blockHeight();
      hintLH *= k;
      hint2LH *= k;
      blockGap *= k;
    }
    const blockH = blockHeight();
    const firstY = availTop + (avail - blockH) / 2 + hintLH / 2;
    setFont(6.6, "bold");
    ctx.fillStyle = "rgba(21,85,118,.80)";
    let lineY = firstY;
    for (const line of hintLines) {
      trackedText(line, x + w / 2, lineY, 0.5);
      lineY += hintLH;
    }
    if (hint2Lines.length) {
      lineY = firstY + (hintLines.length - 1) * hintLH + blockGap + hint2LH;
      setFont(6, "bold");
      ctx.fillStyle = "rgba(21,85,118,.50)";
      for (const line of hint2Lines) {
        trackedText(line, x + w / 2, lineY, 0.4);
        lineY += hint2LH;
      }
    }
    ctx.restore();
  }
  function wrapLines(text, maxWidth, tracking) {
    const words = String(text).split(" ");
    const lines = [];
    let line = "";
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (trackedWidth(test, tracking) > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

    ctx.restore();

  function drawSpikesOverlay() {
    if (!spikesActiveNow() || currentState !== STATE.PLAYING) return;
    ctx.save();
    for (const p of platforms) {
      if (!isSpiky(p)) continue;
      for (let x = p.x + 4; x + 10 <= p.x + p.w; x += 12) {

        ctx.moveTo(x, p.y);
        ctx.lineTo(x + 6, p.y - 9);

  function drawWalls() {

    ctx.fillStyle = "rgba(120,150,180,0.85)";
    ctx.fillRect(-30, -30, inset + 30, WORLD_H + 60);

  function wrapText(text, maxW) {
    const out = [];
    let cur = "";
    for (const word of text.split(" ")) {
      const t = cur ? cur + " " + word : word;
      if (ctx.measureText(t).width > maxW && cur) {
        out.push(cur);
        cur = word;
      } else {
        cur = t;
      }

    if (cur) out.push(cur);
    return out;
  }
  function drawEventIntro() {
    const info = EVENT_INFO[introKind];
    if (!info) return;
    const reading = eventIntroMs > 0;
    const passed = EVENT_INTRO_MS - eventIntroMs;
    const fadeIn = reading ? Math.min(1, passed / EVENT_FADE_MS) : 1;
    const fadeOut = reading ? Math.min(1, eventIntroMs / EVENT_FADE_MS) : Math.min(1, eventCountdownMs / EVENT_FADE_MS);
    const alpha = Math.min(fadeIn, fadeOut);

    const fade = Math.min(1, dark.left / 2e3, (dark.total - dark.left) / 1e3);

    let steps = 0;
    while (simAccumMs + 1e-6 >= SIM_STEP_MS && steps < MAX_SIM_STEPS_PER_FRAME) {
      update(1);
      simAccumMs -= SIM_STEP_MS;
      steps++;

    if (steps === MAX_SIM_STEPS_PER_FRAME) simAccumMs = Math.min(simAccumMs, SIM_STEP_MS);

    if (!fpsDebugEnabled) return;
    if (fpsPreviousTimestamp) fpsIntervals.push(timestamp - fpsPreviousTimestamp);

    if (!fpsWindowStart) fpsWindowStart = timestamp;

      const p95 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))];
