<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Моряка Jump</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101a35}
body{min-height:100vh;min-height:100dvh;padding:12px 0;display:flex;justify-content:center;align-items:center;overflow:auto;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}
#gameStage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#game{display:block;width:min(600px,94vw,calc((100dvh - 75px)*2/3));height:auto;aspect-ratio:2/3;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
#gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;gap:0;background:#101a35}
#gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-width:none;max-height:none;border-radius:0}
#fullscreenButton{width:52px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;font:28px Arial,sans-serif;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#gameStage:fullscreen #fullscreenButton{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10}
#gameStage {
    position: relative;
}
#pauseButton {
    display: none; /* показываем только на сенсорных устройствах */
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    z-index: 30;

    width: 48px;
    height: 48px;
    border: 1px solid rgba(255,255,255,.72);
    border-radius: 14px;
    background: rgba(15,23,42,.68);
    color: white;
    font: bold 22px Arial, sans-serif;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

@media (pointer: coarse) {
    #pauseButton {
        display: block;
    }
}

#touchControls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 22px;
    pointer-events: none;
}
.touchButton{width:72px;height:72px;border:2px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,255,255,.18);color:white;font:bold 34px Arial,sans-serif;pointer-events:auto;touch-action:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.touchButton:active{background:rgba(255,255,255,.35)}
@media(hover:hover) and (pointer:fine){#touchControls{display:none}}
/* Мобильные улучшения: стили ПК не меняются */
@media (max-width:600px) and (pointer:coarse){
    html,body{width:100%;height:100%;min-height:100%;overflow:hidden;overscroll-behavior:none}
    body {
    padding: max(6px, env(safe-area-inset-top)) 0;
	}
    #gameStage{width:100%;gap:8px}
    #game{width:min(96vw,calc((100dvh - 120px)*2/3));max-height:calc(100dvh - 120px);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.38)}
/*    #fullscreenButton{width:46px;height:42px;border-radius:13px;font-size:26px;background:rgba(255,255,255,.2);box-shadow:0 4px 14px rgba(0,0,0,.2)} */
	#fullscreenButton {
    display: none;
	}
	#touchControls{
		position:fixed;
		left:0;
		right:0;
		bottom:max(18px,env(safe-area-inset-bottom));
		z-index:20;
		display:flex;
		justify-content:space-between;
		align-items:center;
		padding:0 22px;
		pointer-events:none;
	}

	.touchButton{
		width:72px;
		height:72px;
		border:2px solid rgba(255,255,255,.72);
		border-radius:50%;
		background:rgba(255,255,255,.18);
		color:white;
		font:bold 34px Arial,sans-serif;
		pointer-events:auto;
		touch-action:none;
		user-select:none;
		-webkit-user-select:none;
		-webkit-tap-highlight-color:transparent;
		backdrop-filter:blur(12px);
		-webkit-backdrop-filter:blur(12px);
	}

	.touchButton:active{
		background:rgba(255,255,255,.35);
	}

	#jumpButton {
    position: absolute;
    right: 22px;
    bottom: 94px; /* кнопка → высотой 82 px + зазор 12 px */
    width: 62px;  /* примерно на 25% меньше 82 px */
    height: 62px;
    font-size: 27px;
	}

	#jumpButton:disabled{
		opacity:.45;
	}

	#jumpButton:not(:disabled){
		background:rgba(22,163,106,.7);
		border-color:rgba(255,255,255,.95);
	}
    #gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-height:none;border-radius:0}
    #gameStage:fullscreen #fullscreenButton{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
}
@media (max-width:900px) and (pointer:coarse) and (orientation:landscape){
    body{padding:0}
    #gameStage{height:100dvh;gap:4px}
    #game{width:auto;height:calc(100dvh - 54px);max-width:68vw;border-radius:10px}
    #touchControls{bottom:max(10px,env(safe-area-inset-bottom));padding-right:max(20px,env(safe-area-inset-right));padding-left:max(20px,env(safe-area-inset-left))}
    .touchButton{width:64px;height:64px;font-size:30px}
}
#tiltButton {
    display: none;
}

@media (pointer: coarse) {
    #tiltButton {
        display: block;
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        z-index: 30;
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,.72);
        border-radius: 12px;
        background: rgba(15,23,42,.68);
        color: white;
        font: bold 13px Arial, sans-serif;
        touch-action: manipulation;
    }
}
#deathGif {
    display: none;
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 22.0%;
    width: 24.5%;
    height: 8.7%;
    object-fit: contain;
    transform: translateX(-50%);
    pointer-events: none;
}
#gameStage.game-over #deathGif {
    display: block;
}
</style>
</head>
<body>
<div id="gameStage">
<canvas id="game" width="1600" height="2400" aria-label="Игра Моряка Jump"></canvas>
<img id="deathGif" src="babazaki.gif" alt="" aria-hidden="true">
<button id="fullscreenButton" type="button" aria-label="Включить полноэкранный режим">⛶</button>
<button
    id="pauseButton"
    type="button"
    aria-label="Пауза"
    title="Пауза"
>Ⅱ</button>

<div id="touchControls" aria-label="Управление">
    <button class="touchButton" id="leftButton" aria-label="Влево">←</button>
    <button class="touchButton" id="jumpButton" aria-label="Дополнительный прыжок" disabled>↑</button>
    <button class="touchButton" id="rightButton" aria-label="Вправо">→</button>
</div>
</div>
<button id="tiltButton" type="button">Включить наклон</button>
<script>
'use strict';

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const RENDER_SCALE=4;
ctx.scale(RENDER_SCALE,RENDER_SCALE);
// Размер игрового мира в координатах рисования — 400 × 600.
const backgroundCache = document.createElement('canvas');
backgroundCache.width = 400;
backgroundCache.height = 600;

const backgroundCtx = backgroundCache.getContext('2d');

function buildBackgroundCache() {
    const gradient = backgroundCtx.createLinearGradient(0, 0, 0, 600);
    gradient.addColorStop(0, '#8ed8f2');
    gradient.addColorStop(0.55, '#d9f4ff');
    gradient.addColorStop(1, '#f7fcff');

    backgroundCtx.fillStyle = gradient;
    backgroundCtx.fillRect(0, 0, 400, 600);

    // Снежные холмы на фоне
    backgroundCtx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i = 0; i < 5; i++) {
        backgroundCtx.beginPath();
        backgroundCtx.ellipse(200, 430 + i * 34, 260, 20, 0, 0, Math.PI * 2);
        backgroundCtx.fill();
    }

    // Лёгкие облака
    backgroundCtx.fillStyle = 'rgba(255,255,255,.42)';
    backgroundCtx.beginPath();
    backgroundCtx.arc(55, 100, 42, 0, Math.PI * 2);
    backgroundCtx.arc(76, 95, 30, 0, Math.PI * 2);
    backgroundCtx.arc(320, 180, 55, 0, Math.PI * 2);
    backgroundCtx.arc(345, 170, 37, 0, Math.PI * 2);
    backgroundCtx.fill();
}

const snowflakes = Array.from({ length: 70 }, () => ({
    x: Math.random() * 400,
    y: Math.random() * 600,
    r: 1 + Math.random() * 2,
    speed: 0.5 + Math.random() * 1.2
}));

function drawSnow(dt = 1) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.85)';

    for (const flake of snowflakes) {
        flake.y += flake.speed * dt;

        if (flake.y > 600) {
            flake.y = -5;
            flake.x = Math.random() * 400;
        }

        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

buildBackgroundCache();
const gameStage=document.getElementById('gameStage');
const fullscreenButton=document.getElementById('fullscreenButton');
const pauseButton = document.getElementById('pauseButton');

pauseButton.addEventListener('pointerdown', event => {
    event.preventDefault();

    if (currentState === STATE.PLAYING) {
        currentState = STATE.PAUSE;
        lastFrameTime = 0;
    }
});
const STATE={MENU:0,PLAYING:1,PAUSE:2,GAMEOVER:3};
let currentState=STATE.MENU,lastFrameTime=0;

const screenShake = {
    time: 0,
    duration: 0,
    intensity: 0,
    x: 0,
    y: 0
};

function startScreenShake(intensity = 2.5, duration = 12) {
    screenShake.time = Math.max(screenShake.time, duration);
    screenShake.duration = Math.max(screenShake.duration, duration);
    screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

function updateScreenShake(dt) {
    if (screenShake.time <= 0) {
        screenShake.time = 0;
        screenShake.x = 0;
        screenShake.y = 0;
        return;
    }

    screenShake.time = Math.max(0, screenShake.time - dt);

    const fade = screenShake.duration > 0
        ? screenShake.time / screenShake.duration
        : 0;

    // Плавно ослабевающая тряска. Координаты заданы в игровых единицах.
    const amount = screenShake.intensity * fade;
    const phase = (screenShake.duration - screenShake.time) * 2.4;

    screenShake.x = Math.sin(phase * 1.7) * amount;
    screenShake.y = Math.cos(phase * 2.3) * amount * 0.7;
}

const CHARACTER_SCORES=Array.from({length:26},(_,index)=>index*2500);
const characterImages = Array.from({ length: 26 }, (_, i) => {
    const image = new Image();
    image.src = `${i + 1}.jpg`;
    return image;
});

function readStoredNumber(key,fallback=0){
    try{const value=Number(localStorage.getItem(key));return Number.isFinite(value)&&value>=0?value:fallback}
    catch{return fallback}
}
let bankCoins=readStoredNumber('morjakaBankCoins');
let highScore=readStoredNumber('doodleHighScore');
function getUnlockedCharacters(score){return CHARACTER_SCORES.map((required,index)=>({required,index})).filter(item=>score>=item.required).map(item=>item.index)}
let unlockedCharacters=getUnlockedCharacters(highScore);
let selectedCharacter=readStoredNumber('morjakaSelectedCharacter');
if(!Number.isInteger(selectedCharacter)||selectedCharacter<0||selectedCharacter>20||!unlockedCharacters.includes(selectedCharacter))selectedCharacter=0;
const FRAMES = [
    { id: 0, name: 'Без рамки', price: 0, style: 'none', color: null },
    { id: 1, name: 'Золотая', price: 25, style: 'solid', color: '#ffc928' },
    { id: 2, name: 'Ледяная', price: 75, style: 'solid', color: '#69dcff' },
    { id: 3, name: 'Рубиновая', price: 100, style: 'solid', color: '#ef476f' },
    { id: 4, name: 'Изумрудная', price: 125, style: 'double', color: '#23c483' },
    { id: 5, name: 'Фиолетовая', price: 150, style: 'double', color: '#a855f7' },
    { id: 6, name: 'Огненная', price: 175, style: 'dashed', color: '#ff6b35' },
    { id: 7, name: 'Розовая', price: 200, style: 'dashed', color: '#ff75c3' },
    { id: 8, name: 'Морская', price: 225, style: 'glow', color: '#00bcd4' },
    { id: 9, name: 'Солнечная', price: 250, style: 'glow', color: '#ffe066' },
    { id: 10, name: 'Неоновая', price: 300, style: 'neon', color: '#7cff6b' }
];

function readStoredArray(key, fallback) {
    try {
        const value = JSON.parse(localStorage.getItem(key));
        return Array.isArray(value) ? value : fallback;
    } catch {
        return fallback;
    }
}

let menuPage = 'characters';
let selectedFrame = Number(localStorage.getItem('morjakaSelectedFrame')) || 0;
let ownedFrames = readStoredArray('morjakaOwnedFrames', [0]);
let shopFrameIndex = selectedFrame;

if (!FRAMES.some(frame => frame.id === selectedFrame)) selectedFrame = 0;
if (!ownedFrames.includes(0)) ownedFrames.unshift(0);

function saveProgress(){
    try{
        localStorage.setItem('morjakaBankCoins',String(bankCoins));
        localStorage.setItem('morjakaUnlockedCharacters',JSON.stringify(unlockedCharacters));
        localStorage.setItem('morjakaSelectedCharacter',String(selectedCharacter));
        localStorage.setItem('doodleHighScore',String(highScore));
		localStorage.setItem('morjakaOwnedFrames', JSON.stringify(ownedFrames));
		localStorage.setItem('morjakaSelectedFrame', String(selectedFrame));
    }catch(error){console.warn('Не удалось сохранить прогресс:',error)}
}

let player={x:185,y:500,vx:0,dy:0,score:0};
let platforms=[],fallingPlatforms=[],verticalPlatforms=[],springs=[],coins=[],birds=[],lives=0,nextLifeScore=10000,doubleJumpAvailable=false,runCoins=0;
let menuMessage='',menuMessageUntil=0,menuButtonDown=false;
const keys={};

const currentTheme = { bg: '#dff7ff', plat: '#8bd8f0' };

function resetGame(){
    player={x:185,y:500,vx:0,dy:0,score:0};
	platforms=[{x:120,y:550,w:160,h:15,type:'static'}];
	fallingPlatforms=[];
	verticalPlatforms=[];
	springs=[];coins=[];birds=[];lives=0;nextLifeScore=10000;doubleJumpAvailable=false;runCoins=0;
	for(let i=0;i<7;i++){
		const y=500-i*100;
		platforms.push(spawnPlatform(y));
		maybeSpawnVerticalPlatform(y);
	}
}
function startGame(){resetGame();lastFrameTime=0;currentState=STATE.PLAYING}
function spawnPlatform(y){
    const level=Math.floor(player.score/4000),brokenChance=Math.min(.35,.05+level*.05),movingChance=Math.min(.35,.05+level*.05);
    const rand=Math.random(),type=rand<brokenChance?'broken':rand<brokenChance+movingChance?'moving':'static';
    const width=70*Math.max(.7,2-level*.25);
    const platform={x:Math.random()*(400-width),y,w:width,h:15,type,dir:2*Math.min(2,1+Math.floor(player.score/2500)*.2)};
    if(type==='static'&&Math.random()>.7)springs.push({x:platform.x+platform.w/2-10,y:y-15});
    if(Math.random()>.92)coins.push({x:platform.x+platform.w/2,y:y-25,r:8});
    if(Math.random()>.985)platform.life={x:platform.x+platform.w/2-10,y:y-35};
    return platform;
}

function spawnVerticalPlatform(y) {
    const w = 80;
    const h = 15;
    const sideWidth = 70; // ширина зоны у каждого края

    // Случайно выбираем левый или правый край.
    const x = Math.random() < 0.5
        ? Math.random() * sideWidth
        : 400 - w - Math.random() * sideWidth;

    return {
        x,
        y,
        baseY: y,
        previousY: y,
        w,
        h,
        phase: Math.random() * Math.PI * 2,
        speed: 0.025 + Math.random() * 0.01
    };
}

function maybeSpawnVerticalPlatform(y) {
    // Независимый дополнительный шанс: обычная генерация не меняется.
    if (Math.random() < 0.01) {
        verticalPlatforms.push(spawnVerticalPlatform(y));
    }
}

function spawnBird(){
    const direction=Math.random()<.5?1:-1;
    const type=Math.floor(Math.random()*3);

    const birdTypes=[
        {speed:2.2, size:1, color:'#4b5563'}, // обычная
        {speed:3.4, size:.78, color:'#9b59b6'}, // маленькая и быстрая
        {speed:1.6, size:1.25, color:'#c0392b'} // крупная и медленная
    ];
    const birdType=birdTypes[type];

    birds.push({
        x:direction===1?-40:440,
        y:100+Math.random()*400,
        vx:direction*(birdType.speed+Math.min(2,player.score/20000)),
        flap:Math.random()*Math.PI*2,
        hitCooldown:0,
        size:birdType.size,
        color:birdType.color
    });
}
window.addEventListener('keydown',event=>{
    keys[event.code]=true;
    if((event.code==='ArrowUp'||event.code==='KeyW'||event.code==='Space')&&currentState===STATE.PLAYING&&doubleJumpAvailable){
        event.preventDefault();player.dy=-15;doubleJumpAvailable=false;
    }
    if(currentState===STATE.MENU){
        if(event.code==='Enter'||event.code==='Space')startGame();
    }else if(currentState===STATE.GAMEOVER)startGame();
    else if(currentState===STATE.PLAYING&&event.code==='Escape'){currentState=STATE.PAUSE;lastFrameTime=0}
    else if(currentState===STATE.PAUSE&&event.code==='Escape'){currentState=STATE.PLAYING;lastFrameTime=0}
});
window.addEventListener('keyup',event=>{keys[event.code]=false});
window.addEventListener('blur', () => {
    keys.ArrowLeft = false;
    keys.ArrowRight = false;
    keys.KeyA = false;
    keys.KeyD = false;
});

function setMenuMessage(text){menuMessage=text;menuMessageUntil=performance.now()+2200}
function canvasPoint(event){
    const rect=canvas.getBoundingClientRect();
    return{x:(event.clientX-rect.left)*400/rect.width,y:(event.clientY-rect.top)*600/rect.height};
}
const characterGrid = {
    top: 243,
    bottom: 500,
    scrollY: 0,
    maxScroll: 0
};

let menuPointerStart = null;

function getCharacterCardRects() {
    const result = [];
    const cardW = 44;
    const cardH = 70;
    const startX = 22;
    const startY = characterGrid.top - characterGrid.scrollY;
    const colGap = 52;
    const rowGap = 76;
    const count = characterImages.length;
    const rows = Math.ceil(count / 7);

    characterGrid.maxScroll = Math.max(
        0,
        rows * rowGap - (characterGrid.bottom - characterGrid.top)
    );
    characterGrid.scrollY = Math.min(characterGrid.scrollY, characterGrid.maxScroll);

    for (let i = 0; i < count; i++) {
        const row = Math.floor(i / 7);
        const col = i % 7;

        result.push({
            x: startX + col * colGap,
            y: startY + row * rowGap,
            w: cardW,
            h: cardH
        });
    }

    return result;
}
function handleMenuPointer(point) {
    if (currentState !== STATE.MENU) return;

    // Нижняя правая кнопка переключает страницы.
    if (point.y >= 516 && point.y <= 572 && point.x >= 205 && point.x <= 365) {
        menuPage = menuPage === 'characters' ? 'shop' : 'characters';
        menuMessage = '';
        return;
    }

    if (menuPage === 'shop') {
        // Выбор одной из карточек в сетке магазина.
        const columns = 4;
        const cardW = 82;
        const cardH = 60;
        const gapX = 10;
        const gapY = 7;
        const startX = 24;
        const startY = 282;

        for (let i = 0; i < FRAMES.length; i++) {
            const col = i % columns;
            const row = Math.floor(i / columns);
            const x = startX + col * (cardW + gapX);
            const y = startY + row * (cardH + gapY);

            if (
                point.x >= x && point.x <= x + cardW &&
                point.y >= y && point.y <= y + cardH
            ) {
                shopFrameIndex = FRAMES[i].id;
                return;
            }
        }

        // Левая нижняя кнопка: купить рамку или надеть купленную.
        if (point.x >= 35 && point.x <= 195 && point.y >= 516 && point.y <= 572) {
            const frame = FRAMES.find(item => item.id === shopFrameIndex);

            if (ownedFrames.includes(frame.id)) {
                selectedFrame = frame.id;
                saveProgress();
                setMenuMessage(`Выбрана рамка: ${frame.name}`);
            } else if (bankCoins >= frame.price) {
                bankCoins -= frame.price;
                ownedFrames.push(frame.id);
                selectedFrame = frame.id;
                saveProgress();
                setMenuMessage(`Куплена рамка: ${frame.name}`);
            } else {
                setMenuMessage(`Не хватает ${frame.price - bankCoins} монет`);
            }
        }

        return;
    }

    // Выбор персонажа на странице персонажей.
    if (point.y >= characterGrid.top && point.y <= characterGrid.bottom) {
        const rects = getCharacterCardRects();

        for (let i = 0; i < rects.length; i++) {
            const r = rects[i];

            if (
                point.x < r.x || point.x > r.x + r.w ||
                point.y < r.y || point.y > r.y + r.h
            ) continue;

            if (unlockedCharacters.includes(i)) {
                selectedCharacter = i;
                saveProgress();
                setMenuMessage(`Выбран персонаж ${i + 1}`);
            } else {
                setMenuMessage(
                    `Нужен рекорд ${CHARACTER_SCORES[i]} — осталось ${
                        Math.max(0, CHARACTER_SCORES[i] - highScore)
                    }`
                );
            }

            return;
        }
    }

    // Левая нижняя кнопка запускает игру.
    if (
        point.x >= 35 && point.x <= 195 &&
        point.y >= 516 && point.y <= 572
    ) {
        startGame();
    }
}
canvas.addEventListener('pointerdown', event => {
    const point = canvasPoint(event);

    if (currentState === STATE.PAUSE) {
        if (
            point.x >= 85 && point.x <= 315 &&
            point.y >= 370 && point.y <= 412
        ) {
            currentState = STATE.PLAYING;
            lastFrameTime = 0;
        } else if (

const tiltButton = document.getElementById('tiltButton');

let tiltEnabled = false;
let tiltDirection = 0;
let neutralGamma = null;

function handleTilt(event) {
    if (!tiltEnabled || currentState !== STATE.PLAYING) {
        tiltDirection = 0;
        return;
    }

    // gamma — наклон телефона влево/вправо.
    if (typeof event.gamma !== 'number') return;

    if (neutralGamma === null) neutralGamma = event.gamma;

    const tilt = event.gamma - neutralGamma;
    const deadZone = 5;

    if (tilt < -deadZone) {
        tiltDirection = -1;
    } else if (tilt > deadZone) {
        tiltDirection = 1;
    } else {
        tiltDirection = 0;
    }
}

async function enableTilt() {
    if (!('DeviceOrientationEvent' in window)) {
        tiltButton.textContent = 'Датчик недоступен';
        return;
    }

    // В некоторых версиях iOS разрешение запрашивается по нажатию кнопки.
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
                tiltButton.textContent = 'Нет разрешения';
                return;
            }
        } catch {
            tiltButton.textContent = 'Не удалось включить';
            return;
        }
    }

    tiltEnabled = true;
    neutralGamma = null;
    window.addEventListener('deviceorientation', handleTilt);
    tiltButton.textContent = 'Наклон включён';
}

    mouseControl.targetX = Math.max(
        0,

    );

        event.clientX >= rect.left &&

function update(dt){

	const keyboardOrTouchLeft =

	const keyboardOrTouchRight =
		keys.ArrowRight || keys.KeyD || touchInput.right;

	// Наклон влияет на движение, только если датчик включён
	// и телефон действительно наклонён влево или вправо.
	const tiltLeft =
		tiltEnabled && tiltDirection < 0;

		tiltEnabled && tiltDirection > 0;

	if (
		keyboardOrTouchLeft ||

		// Клавиатура, сенсорные кнопки и наклон управляют движением.
		if (keyboardOrTouchLeft || tiltLeft) player.vx -= 1.2 * dt;

    verticalPlatforms.forEach(platform => {
        platform.previousY = platform.y;
        platform.phase += platform.speed * dt;
        platform.y = platform.baseY + Math.sin(platform.phase) * 200;
    });

    platforms.forEach(platform => {
        if (
            platform.type === 'broken' &&
            platform.breaking &&
            player.dy < 0 &&
            player.y + 35 <= platform.y
        ) {
            platform.falling = true;
            platform.vy = 0;
            fallingPlatforms.push(platform);
            platform.removeAfterBounce = true;
        }

        if (
            player.dy > 0 &&
            !platform.breaking &&
            player.x + 25 > platform.x &&
            player.x + 10 < platform.x + platform.w &&
            player.y + 35 > platform.y &&
            player.y + 35 < platform.y + platform.h + player.dy

    // если она сама успела немного сдвинуться между кадрами.

    const currentPlayerBottom = player.y + 35;

    for (const platform of verticalPlatforms) {
        const platformTopBefore = platform.previousY;
        const platformTopNow = platform.y;

        const crossedPlatform =
            previousPlayerBottom <= platformTopBefore + platform.h &&
            currentPlayerBottom >= platformTopNow;

        const overlapsPlatform =
            player.x + 25 > platform.x &&
            player.x + 10 < platform.x + platform.w;

        if (player.dy > 0 && crossedPlatform && overlapsPlatform) {
            player.y = platformTopNow - 35;
            player.dy = -12.98;
            doubleJumpAvailable = true;

        }
    }
	platforms.forEach(platform=>{
		if(platform.type==='broken'&&platform.breaking&&player.dy<0&&player.y+35<=platform.y){
			platform.falling=true;
			platform.vy=0;
			fallingPlatforms.push(platform);
			platform.removeAfterBounce=true;
		}
        if(player.dy>0&&!platform.breaking&&player.x+25>platform.x&&player.x+10<platform.x+platform.w&&player.y+35>platform.y&&player.y+35<platform.y+platform.h+player.dy){
            player.y=platform.y-35;player.dy=-12.98;doubleJumpAvailable=true;if(platform.type==='broken')platform.breaking=true;
        }

            platform.x+=platform.dir*dt;

		verticalPlatforms.forEach(platform => {
			const previousBottom = player.y + 35 - player.dy * dt;
			const currentBottom = player.y + 35;

			const crossedPlatformTop =
				previousBottom <= platform.y &&
				currentBottom >= platform.y;

			const overlapsPlatform =
				player.x + 25 > platform.x &&
				player.x + 10 < platform.x + platform.w;

			if (player.dy > 0 && crossedPlatformTop && overlapsPlatform) {
				player.y = platform.y - 35;

				doubleJumpAvailable = true;
			}

	for(let i=fallingPlatforms.length-1;i>=0;i--){
		const platform=fallingPlatforms[i];

		platform.y+=platform.vy*dt;

    }
	else if(player.y>600){
		startScreenShake(4, 20);
		currentState=STATE.GAMEOVER;
	}
}

function drawFrame(cx, cy, radius, frameId) {
    const frame = FRAMES.find(item => item.id === frameId);
    if (!frame || frame.style === 'none' || !frame.color) return;

    ctx.save();
    ctx.strokeStyle = frame.color;
    ctx.lineWidth = frame.style === 'double' ? 4 : 5;

    if (frame.style === 'glow' || frame.style === 'neon') {
        ctx.shadowColor = frame.color;
        ctx.shadowBlur = frame.style === 'neon' ? 14 : 9;

    if (frame.style === 'dashed') {
        ctx.setLineDash([5, 4]);

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

function drawPlatform(p) {
    ctx.save();

    if (p.type === 'broken') {
        // Тёплые деревянные доски с белой снежной кромкой
        const wood = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        wood.addColorStop(0, p.breaking ? '#b96e42' : '#a85c35');
        wood.addColorStop(1, p.breaking ? '#70402d' : '#6d3929');

        ctx.fillStyle = wood;
        ctx.shadowColor = 'rgba(20, 38, 55, .3)';
        ctx.shadowBlur = 5;
        ctx.shadowOffsetY = 3;
        roundedRect(p.x, p.y, p.w, p.h, 5);
        ctx.fill();

        // Снег сверху
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#f7fdff';
        roundedRect(p.x, p.y - 3, p.w, 7, 4);
        ctx.fill();

        // Прожилки древесины
        ctx.strokeStyle = 'rgba(255, 220, 180, .55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x + 8, p.y + 7);
        ctx.lineTo(p.x + p.w * .38, p.y + 6);
        ctx.moveTo(p.x + p.w * .55, p.y + 11);
        ctx.lineTo(p.x + p.w - 8, p.y + 10);
        ctx.stroke();

        // Трещина на ломающейся платформе
        if (p.breaking) {
            ctx.strokeStyle = '#f8d6b2';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w * .48, p.y + 3);
            ctx.lineTo(p.x + p.w * .42, p.y + 8);
            ctx.lineTo(p.x + p.w * .53, p.y + 12);
            ctx.stroke();
        }
    } else if (p.type === 'moving') {
        // Синяя ледяная плита
        const ice = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        ice.addColorStop(0, '#e9fcff');
        ice.addColorStop(.38, '#79dcf5');
        ice.addColorStop(1, '#268dbd');

        ctx.shadowColor = 'rgba(20, 90, 130, .35)';
        ctx.shadowBlur = 9;
        ctx.shadowOffsetY = 4;
        roundedRect(p.x, p.y, p.w, p.h, 8);
        ctx.fillStyle = ice;
        ctx.fill();

        // Грани и блики на льду
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = 'rgba(255, 255, 255, .9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x + 8, p.y + 4);
        ctx.lineTo(p.x + p.w - 12, p.y + 4);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, .65)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x + p.w * .3, p.y + 5);
        ctx.lineTo(p.x + p.w * .42, p.y + 11);
        ctx.lineTo(p.x + p.w * .55, p.y + 6);
        ctx.stroke();
    } else {
        // Обычная платформа — толстый снежный сугроб
        ctx.shadowColor = 'rgba(35, 80, 110, .25)';
        ctx.shadowBlur = 7;
        ctx.shadowOffsetY = 4;

        roundedRect(p.x, p.y + 3, p.w, p.h - 3, 8);
        const snow = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        snow.addColorStop(0, '#b7d9e8');
        snow.addColorStop(1, '#6d9bb2');
        ctx.fillStyle = snow;
        ctx.fill();

        // Неровная белая снежная шапка
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(p.x + 2, p.y + 8);
        ctx.quadraticCurveTo(p.x + p.w * .2, p.y + 2, p.x + p.w * .38, p.y + 6);
        ctx.quadraticCurveTo(p.x + p.w * .62, p.y - 1, p.x + p.w - 2, p.y + 6);
        ctx.lineTo(p.x + p.w - 2, p.y + 11);
        ctx.lineTo(p.x + 2, p.y + 11);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();

    // Бонусная жизнь остаётся заметной
    if (p.life) {
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(p.life.x + 8, p.life.y + 8, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('+', p.life.x + 8, p.life.y + 8);
    }
}

function drawVerticalPlatform(p) {
    ctx.save();

    // Гранёная ледяная основа
    const ice = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    ice.addColorStop(0, '#b7f1ff');
    ice.addColorStop(0.5, '#55b9dc');
    ice.addColorStop(1, '#287fa8');

    ctx.shadowColor = 'rgba(25, 80, 115, .35)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;

    ctx.beginPath();
    ctx.moveTo(p.x + 8, p.y);
    ctx.lineTo(p.x + p.w - 8, p.y);
    ctx.lineTo(p.x + p.w, p.y + p.h / 2);
    ctx.lineTo(p.x + p.w - 8, p.y + p.h);
    ctx.lineTo(p.x + 8, p.y + p.h);
    ctx.lineTo(p.x, p.y + p.h / 2);
    ctx.closePath();
    ctx.fillStyle = ice;
    ctx.fill();

    // Светлая грань кристалла
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(230, 251, 255, .85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + 10, p.y + 4);
    ctx.lineTo(p.x + p.w * .35, p.y + p.h / 2);
    ctx.lineTo(p.x + 10, p.y + p.h - 4);
    ctx.stroke();

    // Снег сверху: неровная шапка с небольшими свисающими краями
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(p.x + 5, p.y + 3);
    ctx.quadraticCurveTo(p.x + p.w * .22, p.y - 3, p.x + p.w * .42, p.y + 2);
    ctx.quadraticCurveTo(p.x + p.w * .68, p.y - 3, p.x + p.w - 5, p.y + 3);
    ctx.lineTo(p.x + p.w - 8, p.y + 7);
    ctx.lineTo(p.x + p.w * .72, p.y + 6);
    ctx.lineTo(p.x + p.w * .55, p.y + 8);
    ctx.lineTo(p.x + p.w * .34, p.y + 6);
    ctx.lineTo(p.x + 8, p.y + 8);
    ctx.closePath();
    ctx.fill();

    // Снежные блики на боковых гранях
    ctx.strokeStyle = 'rgba(255, 255, 255, .75)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + 3, p.y + p.h / 2);
    ctx.lineTo(p.x + 8, p.y + p.h - 3);
    ctx.moveTo(p.x + p.w - 3, p.y + p.h / 2);
    ctx.lineTo(p.x + p.w - 8, p.y + p.h - 3);
    ctx.stroke();

    ctx.restore();
}

function drawSpring(s) {

    const base = ctx.createLinearGradient(s.x, s.y + 12, s.x, s.y + 17);
    base.addColorStop(0, '#f5fdff');
    base.addColorStop(0.45, '#9ec8d8');

    ctx.fillStyle = base;
    ctx.strokeStyle = '#527b91';
    ctx.lineWidth = 1;
    roundedRect(s.x + 1, s.y + 12, 18, 5, 2);
    ctx.fill();
    ctx.stroke();

    // Голубая металлическая спираль с тёмным контуром
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#387d9b';
    ctx.beginPath();
    ctx.moveTo(s.x + 4, s.y + 12);
    ctx.lineTo(s.x + 7, s.y + 9);
    ctx.lineTo(s.x + 13, s.y + 9);
    ctx.lineTo(s.x + 16, s.y + 6);
    ctx.lineTo(s.x + 13, s.y + 3);
    ctx.lineTo(s.x + 7, s.y + 3);
    ctx.stroke();

    // Светлый блик на витках
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(239, 253, 255, .95)';
    ctx.beginPath();
    ctx.moveTo(s.x + 4, s.y + 11);
    ctx.lineTo(s.x + 7, s.y + 9);
    ctx.lineTo(s.x + 13, s.y + 9);
    ctx.lineTo(s.x + 16, s.y + 6);
    ctx.stroke();

    // Снежная верхушка
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(110, 205, 235, .7)';
    ctx.shadowBlur = 4;
    roundedRect(s.x + 2, s.y - 2, 16, 5, 2);
    ctx.fill();

    // Маленький голубой ледяной блик на снегу
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(115, 205, 235, .65)';
    roundedRect(s.x + 5, s.y - 1, 5, 1.5, 1);
    ctx.fill();

    ctx.restore();
}

function drawPlayer() {
    const x = player.x - 5;
    const y = player.y - 8;
    const size = 40;
    const cx = x + size / 2;
    const cy = y + size / 2;
    const radius = size / 2;
    const image = characterImages[selectedCharacter];

    // Внешнее состояние персонажа, включая тень.
    ctx.save();

    ctx.shadowColor = 'rgba(0,12,30,.55)';
    ctx.shadowBlur = 9;
    ctx.shadowOffsetY = 4;

    ctx.beginPath();
    ctx.arc(cx, cy, radius - 1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(12,27,48,.9)';
    ctx.fill();

    // Изображение персонажа и блик обрезаются по кругу.
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius - 3, 0, Math.PI * 2);
    ctx.clip();

    if (image && image.complete && image.naturalWidth > 0) {
        ctx.drawImage(image, x + 3, y + 3, size - 6, size - 6);
    } else {
        const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
        gradient.addColorStop(0, '#ffcf77');
        gradient.addColorStop(1, '#e63946');
        ctx.fillStyle = gradient;
        ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
    }

    const shine = ctx.createLinearGradient(x, y + 3, x, y + size * 0.65);
    shine.addColorStop(0, 'rgba(255,255,255,.42)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.fillRect(x + 3, y + 3, size - 6, size * 0.62);

    ctx.restore();

    // Контуры персонажа и выбранная рамка.
    ctx.beginPath();
    ctx.arc(cx, cy, radius - 1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(5,13,27,.95)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, radius - 2.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(190,225,255,.78)';
    ctx.lineWidth = 1;
    ctx.stroke();

	if (currentState !== STATE.MENU || menuPage !== 'characters') {
		drawFrame(cx, cy, radius - 1, selectedFrame);
	}

    ctx.restore();

    // Шарфик рисуется поверх персонажа и рамки.
    if (scarfImage.complete && scarfImage.naturalWidth > 0) {
        ctx.drawImage(scarfImage, x + 45, y + 17, size - 90, 35);
    }
}

    ctx.fillStyle='#fff';
    ctx.font='bold 16px Arial';
    ctx.fillText('ПРОДОЛЖИТЬ',200,391);
    ctx.restore();

    // Кнопка «В меню»
    ctx.save();
    roundedRect(85,420,230,42,14);
    ctx.fillStyle='rgba(255,255,255,.68)';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';
    ctx.lineWidth=1.5;
    ctx.stroke();
    ctx.fillStyle='#155576';
    ctx.font='bold 16px Arial';
    ctx.fillText('В МЕНЮ',200,441);
    ctx.restore();
}
function draw(timestamp){
    const dt=lastFrameTime
        ? Math.min((timestamp-lastFrameTime)/(1000/60),2)
        : 1;
    lastFrameTime=timestamp;
    updateScreenShake(dt);

    if(currentState===STATE.MENU) {
        drawMenu();
    } else {
        drawBackground();
		drawSnow(dt);

        ctx.save();
        if (currentState !== STATE.PAUSE) {
            ctx.translate(screenShake.x, screenShake.y);
        }

        if(currentState===STATE.PAUSE){
			verticalPlatforms.forEach(drawVerticalPlatform);
			fallingPlatforms.forEach(drawPlatform);
            platforms.forEach(drawPlatform);
            springs.forEach(drawSpring);
            coins.forEach(drawCoin);
            birds.forEach(drawBird);
            drawPlayer();
            drawCounters();
            drawPauseMenu();
        } else if(currentState===STATE.GAMEOVER){
			verticalPlatforms.forEach(drawVerticalPlatform);
			fallingPlatforms.forEach(drawPlatform);
            platforms.forEach(drawPlatform);
            springs.forEach(drawSpring);
            coins.forEach(drawCoin);
            birds.forEach(drawBird);
            drawPlayer();
            drawCounters();
            drawGameOver();
        } else {
			verticalPlatforms.forEach(drawVerticalPlatform);
			fallingPlatforms.forEach(drawPlatform);
            platforms.forEach(drawPlatform);
            springs.forEach(drawSpring);
            coins.forEach(drawCoin);
            birds.forEach(drawBird);
            drawPlayer();
            drawCounters();
        }

        ctx.restore();
    }

    gameStage.classList.toggle('game-over', currentState === STATE.GAMEOVER);
    update(dt);
    requestAnimationFrame(draw);
    jumpButton.disabled = currentState !== STATE.PLAYING || !doubleJumpAvailable;
}
fullscreenButton.addEventListener('click',async()=>{
    try{
        if(!document.fullscreenElement){if(gameStage.requestFullscreen)await gameStage.requestFullscreen();else fullscreenButton.title='Полноэкранный режим не поддерживается этим браузером'}
        else await document.exitFullscreen();
    }catch(error){console.error('Не удалось переключить полноэкранный режим:',error)}
});
document.addEventListener('fullscreenchange',()=>{
    const isFullscreen=document.fullscreenElement===gameStage;
    fullscreenButton.textContent=isFullscreen?'×':'⛶';
    fullscreenButton.setAttribute('aria-label',isFullscreen?'Выйти из полноэкранного режима':'Включить полноэкранный режим');
});
requestAnimationFrame(draw);
</script>
