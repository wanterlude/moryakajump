<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Моряка Jump</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101a35}
body{min-height:100vh;min-height:100dvh;padding:12px 0;display:flex;justify-content:center;align-items:center;overflow:auto;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}
#gameStage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#game{display:block;width:min(600px,94vw,calc((100dvh - 75px)*2/3));height:auto;aspect-ratio:2/3;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
#gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;gap:0;background:#101a35}
#gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-width:none;max-height:none;border-radius:0}
#fullscreenButton{width:52px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;font:28px Arial,sans-serif;cursor:pointer;touch-action:manipulation}
#gameStage:fullscreen #fullscreenButton{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10}
#touchControls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.touchGroup{display:flex;gap:12px;pointer-events:auto}
.touchButton{width:var(--touch-size,72px);height:var(--touch-size,72px);border:2px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(20,35,60,var(--touch-opacity,.48));color:white;font:bold 34px Arial,sans-serif;pointer-events:auto;touch-action:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.touchButton:active{background:rgba(40,170,190,.7);transform:scale(.95)}
@media(hover:hover) and (pointer:fine){#touchControls{display:none}}
@media(max-width:600px) and (pointer:coarse){
body{padding:4px 0}
#gameStage{gap:8px}
#game{width:min(96vw,calc((100dvh - 90px)*2/3));border-radius:12px}
#touchControls{bottom:max(12px,env(safe-area-inset-bottom));padding:0 12px}
#fullscreenButton{width:48px;height:42px}
}
</style>
</head>
<body>
<div id="gameStage">
<canvas id="game" width="1600" height="2400" aria-label="Игра Моряка Jump"></canvas>
<button id="fullscreenButton" type="button" aria-label="Включить полноэкранный режим">⛶</button>
</div>
<div id="touchControls" aria-label="Управление">
<div class="touchGroup">
<button class="touchButton" id="leftButton" aria-label="Влево">←</button>
<button class="touchButton" id="rightButton" aria-label="Вправо">→</button>
</div>
<button class="touchButton" id="dashButton" aria-label="Реактивный рывок">↑</button>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('gameStage'),fullscreenButton=document.getElementById('fullscreenButton');
ctx.scale(4,4);
const STATE={MENU:0,PLAYING:1,PAUSE:2,GAMEOVER:3,SETTINGS:4};
let state=STATE.MENU,lastTime=0;
const characterScores=[0,15000,22500,30000,37500,45000,52500,60000,67500,75000];
const characterImages=Array.from({length:10},(_,i)=>{const im=new Image();im.src=`${i+1}.jpg`;return im});
function storedNumber(key,def=0){try{const n=Number(localStorage.getItem(key));return Number.isFinite(n)&&n>=0?n:def}catch{return def}}
let highScore=storedNumber('doodleHighScore'),bankCoins=storedNumber('morjakaBankCoins'),selected=storedNumber('morjakaSelectedCharacter');
let unlocked=characterScores.map((v,i)=>highScore>=v?i:-1).filter(i=>i>=0);
if(!Number.isInteger(selected)||selected<0||selected>9||!unlocked.includes(selected))selected=0;
let touchSize=storedNumber('morjakaTouchSize',72),touchOpacity=storedNumber('morjakaTouchOpacity',.48);
if(touchSize<54||touchSize>104)touchSize=72;
if(touchOpacity<.15||touchOpacity>.9)touchOpacity=.48;
function applyTouchSettings(){document.documentElement.style.setProperty('--touch-size',`${touchSize}px`);document.documentElement.style.setProperty('--touch-opacity',touchOpacity)}
applyTouchSettings();
function save(){
try{localStorage.setItem('doodleHighScore',String(highScore));localStorage.setItem('morjakaBankCoins',String(bankCoins));localStorage.setItem('morjakaSelectedCharacter',String(selected));localStorage.setItem('morjakaTouchSize',String(touchSize));localStorage.setItem('morjakaTouchOpacity',String(touchOpacity))}catch(e){console.warn(e)}
}
const keys={};
let player,platforms,springs,coins,birds,particles,lives,runCoins,jumpCount,dashReady,flash,settingsBack=STATE.MENU;
function resetGame(){
player={x:185,y:500,vx:0,dy:0,score:0,rotation:0,squash:0,fallTrail:0};
platforms=[{x:120,y:550,w:160,h:15,type:'static',dir:2,vy:0}];springs=[];coins=[];birds=[];particles=[];lives=0;runCoins=0;jumpCount=0;dashReady=true;flash=0;
for(let i=0;i<7;i++)platforms.push(spawnPlatform(500-i*100));
}
function startGame(){resetGame();state=STATE.PLAYING;lastTime=0}
function spawnPlatform(y){
const level=Math.floor(player.score/5000),rand=Math.random(),broken=Math.min(.32,.12+level*.025),moving=Math.min(.35,.15+level*.025);
let type=rand<broken?'broken':rand<broken+moving?'moving':'static';
if(rand>broken+moving&&rand<broken+moving+.13)type='vertical';
if(rand>.83&&rand<.9)type='danger';
const w=70*Math.max(.7,2-level*.25);
const p={x:Math.random()*(400-w),y,w,h:15,type,dir:2*Math.min(10,1+level*.2),vy:1+Math.random()*1.2,baseY:y,phase:Math.random()*6.28};
if(type==='static'&&Math.random()>.72)springs.push({x:p.x+p.w/2-10,y:y-15});
if(Math.random()>.9)coins.push({x:p.x+p.w/2,y:y-25,r:8});
if(Math.random()>.987)p.life={x:p.x+p.w/2-8,y:y-34};
if(Math.random()>.86&&y<400)birds.push({x:Math.random()<.5?-35:435,y:y-50,vx:Math.random()<.5?1.5:-1.5,w:34,h:22});
return p;
}
function burst(x,y,color='#55d8ff',count=12){
for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:25+Math.random()*15,max:40,color,r:2+Math.random()*3})}
}
function dash(){
if(state!==STATE.PLAYING||!dashReady)return;
dashReady=false;player.dy=-22;flash=8;burst(player.x+15,player.y+28,'#72f4ff',22);
}
function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*400/r.width,y:(e.clientY-r.top)*600/r.height}}
function cardRects(){return Array.from({length:10},(_,i)=>({x:30+i%5*70,y:243+Math.floor(i/5)*99,w:62,h:91}))}
function menuPointer(p){
for(let i=0;i<10;i++){const r=cardRects()[i];if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){if(unlocked.includes(i)){selected=i;save()}return}}
if(p.x>=104&&p.x<=296&&p.y>=524&&p.y<=580)startGame();
}
canvas.addEventListener('pointerdown',e=>{
const p=canvasPoint(e);
if(state===STATE.MENU){menuPointer(p);e.preventDefault();return}
if(state===STATE.PLAYING&&p.x>350&&p.y>550){state=STATE.PAUSE;lastTime=0;e.preventDefault();return}
if(state===STATE.PAUSE){
if(p.x>=75&&p.x<=325&&p.y>=355&&p.y<=407){state=STATE.PLAYING;lastTime=0}
else if(p.x>=75&&p.x<=325&&p.y>=420&&p.y<=472){state=STATE.MENU}
e.preventDefault();return}
if(state===STATE.GAMEOVER){if(p.x>=85&&p.x<=315&&p.y>=395&&p.y<=455)state=STATE.MENU;else startGame();e.preventDefault();return}
if(state===STATE.SETTINGS){
if(p.x>=75&&p.x<=325&&p.y>=390&&p.y<=440){touchSize=Math.max(54,Math.min(104,touchSize+8));applyTouchSettings();save()}
else if(p.x>=75&&p.x<=325&&p.y>=445&&p.y<=495){touchOpacity=Math.min(.9,Math.round((touchOpacity+.1)*10)/10);if(touchOpacity>.9)touchOpacity=.2;applyTouchSettings();save()}
else if(p.x>=75&&p.x<=325&&p.y>=510&&p.y<=560)state=settingsBack;
e.preventDefault();return}
});
window.addEventListener('keydown',e=>{
keys[e.code]=true;
if(state===STATE.MENU){if(e.code==='Enter'||e.code==='Space')startGame();return}
if(state===STATE.GAMEOVER){startGame();return}
if(state===STATE.PLAYING){
if(['ArrowUp','KeyW','Space'].includes(e.code)){e.preventDefault();dash()}
if(e.code==='Escape'){state=STATE.PAUSE;lastTime=0}
}else if(state===STATE.PAUSE&&e.code==='Escape'){state=STATE.PLAYING;lastTime=0}
});
window.addEventListener('keyup',e=>keys[e.code]=false);
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function bind(id,key){const b=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true;if(b.setPointerCapture)b.setPointerCapture(e.pointerId)};const up=e=>{e.preventDefault();keys[key]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',()=>keys[key]=false)}
bind('leftButton','ArrowLeft');bind('rightButton','ArrowRight');
document.getElementById('dashButton').addEventListener('pointerdown',e=>{e.preventDefault();dash()});
function update(dt){
if(state!==STATE.PLAYING)return;dt=Math.min(dt,2);
if(keys.ArrowLeft||keys.KeyA)player.vx-=1.2*dt;
if(keys.ArrowRight||keys.KeyD)player.vx+=1.2*dt;
player.vx*=Math.pow(.85,dt);player.x+=player.vx*dt;
player.dy+=.5464*dt;player.y+=player.dy*dt;
if(player.x<-30)player.x=400;if(player.x>400)player.x=-30;
player.rotation+=player.vx*.012;
if(player.dy>5)player.fallTrail++;
platforms.forEach(p=>{
if(p.type==='moving'){p.x+=p.dir*dt;if(p.x<0||p.x+p.w>400){p.x=Math.max(0,Math.min(400-p.w,p.x));p.dir*=-1}}
if(p.type==='vertical'){p.y+=p.vy*dt;if(p.y<p.baseY-32||p.y>p.baseY+32)p.vy*=-1}
if(player.dy>0&&!p.breaking&&player.x+25>p.x&&player.x+10<p.x+p.w&&player.y+35>=p.y&&player.y+35<=p.y+p.h+player.dy){
if(p.type==='danger'){player.dy=2;continue}
player.y=p.y-35;player.dy=jumpCount>0&&jumpCount%15===0?-25.96:-12.98;jumpCount++;player.squash=1;burst(player.x+15,p.y,'#68dff2',14);flash=4;
if(jumpCount%15===0){player.dy=-25.96;burst(player.x+15,p.y,'#ffd166',24)}
if(p.type==='broken')p.breaking=true;
}
});
platforms=platforms.filter(p=>!p.removeAfterBounce);
for(const b of birds){b.x+=b.vx*dt;if(b.x<-55||b.x>455)b.remove=true;
if(player.x+27>b.x&&player.x+3<b.x+b.w&&player.y+28>b.y&&player.y+4<b.y+b.h){player.dy=Math.max(player.dy,3);player.vx+=(player.x<b.x?-.8:.8);burst(b.x+b.w/2,b.y+b.h/2,'#ff9a8b',10);b.remove=true}}
birds=birds.filter(b=>!b.remove);
for(let i=coins.length-1;i>=0;i--){const c=coins[i];if(player.x<c.x+15&&player.x+30>c.x-8&&player.y<c.y+15&&player.y+30>c.y-8){runCoins++;bankCoins++;if(runCoins%10===0)lives++;coins.splice(i,1);save()}}
platforms.forEach(p=>{if(p.life&&player.x<p.life.x+16&&player.x+30>p.life.x&&player.y<p.life.y+16&&player.y+30>p.life.y){lives++;p.life=null}});
springs.forEach(s=>{if(player.dy>0&&player.x+25>s.x&&player.x<s.x+20&&player.y+35>s.y&&player.y+35<s.y+20){player.dy=-32;burst(player.x+15,s.y,'#ff7168',18)}});
if(player.y<250){const d=250-player.y;player.score+=d;player.y=250;platforms.forEach(p=>{p.y+=d;p.baseY+=d});springs.forEach(s=>s.y+=d);coins.forEach(c=>c.y+=d);birds.forEach(b=>b.y+=d)}
platforms=platforms.filter(p=>p.y<650);springs=springs.filter(s=>s.y<650);coins=coins.filter(c=>c.y<650);
while(platforms.length<8){const y=platforms.length?Math.min(...platforms.map(p=>p.y)):550;platforms.push(spawnPlatform(y-100))}
for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.12*dt;q.life-=dt}
particles=particles.filter(q=>q.life>0);
player.squash=Math.max(0,player.squash-.08*dt);flash=Math.max(0,flash-dt);
if(player.y>600){if(lives>0){lives--;player.y=500;player.dy=-8.5;burst(player.x+15,590,'#8cecff',18)}else{state=STATE.GAMEOVER;const score=Math.floor(player.score);if(score>highScore){highScore=score;unlocked=characterScores.map((v,i)=>score>=v?i:-1).filter(i=>i>=0);if(!unlocked.includes(selected))selected=0;save()}}}
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function background(){const g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#b7f4ff');g.addColorStop(.55,'#e8f8ff');g.addColorStop(1,'#d7eaff');ctx.fillStyle=g;ctx.fillRect(0,0,400,600);ctx.fillStyle='rgba(255,255,255,.34)';ctx.beginPath();ctx.arc(55,100,42,0,7);ctx.arc(76,95,30,0,7);ctx.arc(320,180,55,0,7);ctx.arc(345,170,37,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(210,430+i*34,260,15,0,0,7);ctx.fill()}}
function panel(x,y,w,h){ctx.save();ctx.shadowColor='rgba(18,70,110,.18)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;rr(x,y,w,h,22);ctx.fillStyle='rgba(255,255,255,.76)';ctx.fill();ctx.restore();ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.4;rr(x,y,w,h,22);ctx.stroke()}
function drawImage(i,x,y,w,h){const im=characterImages[i];ctx.save();rr(x,y,w,h,10);ctx.clip();if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h);else{ctx.fillStyle=['#ffcf77','#ff8fa3','#8de3db','#9ca9ff','#f4a6e8'][i%5];ctx.fillRect(x,y,w,h);ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.fillText(String(i+1),x+w/2,y+h/2)}ctx.restore()}
function drawMenu(){
background();panel(18,17,364,566);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#174b72';ctx.font='bold 28px Arial';ctx.fillText('Моряка',200,53);ctx.fillStyle='#087fbe';ctx.font='bold 39px Arial';ctx.fillText('JUMP',200,91);ctx.font='bold 14px Arial';ctx.fillStyle='#155576';ctx.fillText(`🏆 Рекорд: ${highScore}`,200,128);drawImage(selected,174,151,52,58);ctx.font='bold 13px Arial';ctx.fillText(`Выбран: ${selected+1} · Монеты: ${bankCoins}`,200,222);ctx.fillText('ВЫБЕРИ ПЕРСОНАЖА',200,235);
cardRects().forEach((r,i)=>{panel(r.x,r.y,r.w,r.h);drawImage(i,r.x+5,r.y+5,r.w-10,55);ctx.font='bold 9px Arial';ctx.fillStyle=unlocked.includes(i)?'#087f62':'#865100';ctx.fillText(unlocked.includes(i)?(selected===i?'ВЫБРАН':'ОТКРЫТ'):`${characterScores[i]} очков`,r.x+r.w/2,r.y+75);if(selected===i){ctx.strokeStyle='#10a981';ctx.lineWidth=3;rr(r.x-1,r.y-1,r.w+2,r.h+2,13);ctx.stroke()}});
rr(104,524,192,56,19);ctx.fillStyle='#18b9a8';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('ИГРАТЬ',200,552);ctx.fillStyle='#42677b';ctx.font='11px Arial';ctx.fillText('Персонажи открываются за лучший результат',200,594)
}
function drawPlatform(p){
ctx.save();
if(p.type==='danger'){ctx.fillStyle='#e8455f';rr(p.x,p.y,p.w,p.h,5);ctx.fill();ctx.fillStyle='#fff';for(let x=p.x+8;x<p.x+p.w-5;x+=18){ctx.beginPath();ctx.moveTo(x,p.y+3);ctx.lineTo(x+7,p.y-7);ctx.lineTo(x+13,p.y+3);ctx.fill()}}
else{ctx.fillStyle=p.type==='broken'?'#e85c54':p.type==='moving'?'#4d96ff':p.type==='vertical'?'#9b6bdb':'#38cdb4';ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=6;rr(p.x,p.y,p.w,p.h,7);ctx.fill()}
ctx.restore();
if(p.life){ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(p.life.x+8,p.life.y+8,8,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('+',p.life.x+8,p.life.y+12)}
}
function drawBird(b){ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);if(b.vx<0)ctx.scale(-1,1);ctx.fillStyle='#6554a4';ctx.beginPath();ctx.ellipse(0,0,15,9,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-3,0);ctx.quadraticCurveTo(-8,-15,-17,-9);ctx.quadraticCurveTo(-10,0,-3,3);ctx.fill();ctx.fillStyle='#ffc857';ctx.beginPath();ctx.moveTo(11,-2);ctx.lineTo(20,1);ctx.lineTo(11,3);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-3,2.5,0,7);ctx.fill();ctx.restore()}
function drawPlayer(){
const sx=1+player.squash*.18,sy=1-player.squash*.18;
ctx.save();ctx.translate(player.x+15,player.y+15);ctx.rotate(player.rotation);ctx.scale(sx,sy);ctx.shadowColor='rgba(0,12,30,.5)';ctx.shadowBlur=8;ctx.fillStyle='#152b48';ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.fill();ctx.shadowBlur=0;
const im=characterImages[selected];ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.clip();if(im.complete&&im.naturalWidth)ctx.drawImage(im,-17,-17,34,34);else{ctx.fillStyle='#ffcf77';ctx.fillRect(-17,-17,34,34)}ctx.restore();
if(player.dy>5&&player.fallTrail>2){ctx.fillStyle='rgba(255,115,100,.42)';ctx.beginPath();ctx.arc(player.x+15,player.y+37,5+Math.random()*4,0,7);ctx.fill();player.fallTrail=0}
}
function drawCoin(c){ctx.fillStyle='#ffc928';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill();ctx.fillStyle='#9a6400';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',c.x,c.y)}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function drawCounters(){panel(8,8,190,78);ctx.textAlign='left';ctx.textBaseline='middle';ctx.font='bold 12px Arial';ctx.fillStyle='#64748b';ctx.fillText('СЧЁТ',20,25);ctx.fillText('ЖИЗНИ',20,49);ctx.fillText('РЫВОК',20,73);ctx.textAlign='right';ctx.font='bold 15px Arial';ctx.fillStyle='#1e293b';ctx.fillText(String(Math.floor(player.score)),184,25);ctx.fillText(`${lives}  ·  ${runCoins%10}/10`,184,49);ctx.fillStyle=dashReady?'#087f62':'#94a3b8';ctx.fillText(dashReady?'ГОТОВ':'—',184,73);ctx.beginPath();ctx.arc(380,580,16,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#334155';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText('⚙',380,580)}
function button(x,y,w,h,label){rr(x,y,w,h,14);ctx.fillStyle='#18a9a5';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w/2,y+h/2)}
function drawOverlay(title,lines){
ctx.fillStyle='rgba(15,23,42,.68)';ctx.fillRect(0,0,400,600);panel(38,112,324,376);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#155576';ctx.font='bold 26px Arial';ctx.fillText(title,200,160);ctx.fillStyle='#1e293b';ctx.font='bold 17px Arial';lines.forEach((t,i)=>ctx.fillText(t,200,220+i*35))
}
function drawPause(){drawOverlay('ПАУЗА',[`Счёт: ${Math.floor(player.score)}`,`Рекорд: ${highScore}`]);button(75,355,250,52,'ПРОДОЛЖИТЬ');button(75,420,250,52,'В МЕНЮ');ctx.fillStyle='#475569';ctx.font='12px Arial';ctx.fillText('Также: нажмите ESC или коснитесь вне кнопок',200,490)}
function drawGameOver(){drawOverlay('ИГРА ОКОНЧЕНА',[`Результат: ${Math.floor(player.score)}`,`Рекорд: ${highScore}`]);button(85,395,230,60,'СМЕНИТЬ ПЕРСОНАЖА');ctx.fillStyle='#475569';ctx.font='13px Arial';ctx.fillText('Коснитесь экрана, чтобы начать заново',200,475)}
function drawSettings(){
drawOverlay('НАСТРОЙКИ УПРАВЛЕНИЯ',[]);ctx.fillStyle='#475569';ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText(`Размер кнопок: ${touchSize}px`,200,310);button(75,335,250,48,'ИЗМЕНИТЬ РАЗМЕР');ctx.fillText(`Прозрачность: ${Math.round(touchOpacity*100)}%`,200,410);button(75,435,250,48,'ИЗМЕНИТЬ ПРОЗРАЧНОСТЬ');button(75,510,250,48,'НАЗАД')
}
function render(t){
const dt=lastTime?Math.min((t-lastTime)/(1000/60),2):1;lastTime=t;
if(state===STATE.MENU)drawMenu();
else{background();platforms.forEach(drawPlatform);springs.forEach(s=>{ctx.fillStyle='#ff5548';ctx.fillRect(s.x,s.y,20,8)});coins.forEach(drawCoin);birds.forEach(drawBird);drawParticles();drawPlayer();drawCounters();
if(flash>0){ctx.fillStyle=`rgba(100,240,255,${flash*.025})`;ctx.fillRect(0,0,400,600)}
if(state===STATE.PAUSE)drawPause();else if(state===STATE.GAMEOVER)drawGameOver();else if(state===STATE.SETTINGS)drawSettings()}
update(dt);requestAnimationFrame(render)
}
fullscreenButton.addEventListener('click',async()=>{try{if(!document.fullscreenElement&&stage.requestFullscreen)await stage.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen()}catch(e){console.warn(e)}});
document.addEventListener('fullscreenchange',()=>{const full=document.fullscreenElement===stage;fullscreenButton.textContent=full?'×':'⛶';fullscreenButton.setAttribute('aria-label',full?'Выйти из полноэкранного режима':'Включить полноэкранный режим')});
requestAnimationFrame(render);
</script>
</body>
</html>
