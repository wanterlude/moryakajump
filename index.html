<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Моряка Jump</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#101a35}
body{min-height:100vh;min-height:100dvh;padding:12px 0;display:flex;justify-content:center;align-items:center;overflow:auto;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Arial,sans-serif}
#gameStage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative}
#game{display:block;width:min(600px,94vw,calc((100dvh - 75px)*2/3));height:auto;aspect-ratio:2/3;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);touch-action:none;cursor:pointer}
#gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;gap:0;background:#101a35}
#gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-width:none;max-height:none;border-radius:0}
#toolbar{display:flex;gap:10px;align-items:center;justify-content:center}
#fullscreenButton{width:52px;height:44px;flex:0 0 auto;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;font:28px Arial,sans-serif;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#soundButton{width:52px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:rgba(255,255,255,.14);color:white;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:0}
#soundButton svg{display:block}
#soundButton .spkCross{display:none}
#soundButton.muted .spkWave,#soundButton.muted .spkWave2{display:none}
#soundButton.muted .spkCross{display:inline}
#soundButton.muted{color:rgba(255,255,255,.55)}
#soundButton:hover,#fullscreenButton:hover{background:rgba(255,255,255,.22)}
#soundButton:active,#fullscreenButton:active{transform:scale(.96)}
#gameStage:fullscreen #toolbar{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10}
#pauseButton,#tiltButton{display:none!important}
#touchControls{position:absolute;left:0;right:0;bottom:18px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:0 22px;pointer-events:none}
.touchButton{width:72px;height:72px;border:2px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,255,255,.18);color:white;font:bold 34px Arial,sans-serif;pointer-events:auto;touch-action:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.touchButton:active{background:rgba(255,255,255,.35)}
@media(hover:hover) and (pointer:fine){#touchControls{display:none}}
@media (max-width:600px) and (pointer:coarse){
    html,body{width:100%;height:100%;min-height:100%;overflow:hidden;overscroll-behavior:none}
    body{padding:max(6px, env(safe-area-inset-top)) 0}
    #gameStage{width:100%;gap:8px}
    #game{width:min(96vw,calc((100dvh - 120px)*2/3));max-height:calc(100dvh - 120px);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.38)}
    #fullscreenButton{display:none}
    #touchControls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:space-between;align-items:center;padding:0 22px;pointer-events:none}
    .touchButton{width:72px;height:72px;border:2px solid rgba(255,255,255,.72);border-radius:50%;background:rgba(255,255,255,.18);color:white;font:bold 34px Arial,sans-serif;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .touchButton:active{background:rgba(255,255,255,.35)}
    #jumpButton{position:absolute;right:22px;bottom:94px;width:62px;height:62px;font-size:27px}
    #jumpButton:disabled{opacity:.45}
    #jumpButton:not(:disabled){background:rgba(22,163,106,.7);border-color:rgba(255,255,255,.95)}
    #gameStage:fullscreen{width:100vw;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #gameStage:fullscreen #game{width:min(100vw,calc(100dvh*2/3));height:min(100dvh,calc(100vw*3/2));max-height:none;border-radius:0}
    #gameStage:fullscreen #toolbar{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom))}
}
@media (max-width:900px) and (pointer:coarse) and (orientation:landscape){
    body{padding:0}
    #gameStage{height:100dvh;gap:4px}
    #game{width:auto;height:calc(100dvh - 54px);max-width:68vw;border-radius:10px}
    #touchControls{bottom:max(10px,env(safe-area-inset-bottom));padding-right:max(20px,env(safe-area-inset-right));padding-left:max(20px,env(safe-area-inset-left))}
    .touchButton{width:64px;height:64px;font-size:30px}
}
</style>
</head>
<body>
<div id="gameStage">
<canvas id="game" width="1600" height="2400" aria-label="Игра Моряка Jump"></canvas>
<div id="toolbar">
    <button id="soundButton" type="button" aria-label="Выключить звук" title="Звук включён">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path class="spkBody" d="M4 9.2h3.1L11.6 5v14L7.1 14.8H4z" fill="currentColor"/>
            <path class="spkWave" d="M15 8.6a4.2 4.2 0 0 1 0 6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path class="spkWave2" d="M17.8 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
            <path class="spkCross" d="M15.6 9.2l5 5.6M20.6 9.2l-5 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
    </button>
    <button id="fullscreenButton" type="button" aria-label="Включить полноэкранный режим">⛶</button>
</div>
<div id="touchControls" aria-label="Управление">
    <button class="touchButton" id="leftButton" aria-label="Влево">←</button>
    <button class="touchButton" id="jumpButton" aria-label="Дополнительный прыжок" disabled>↑</button>
    <button class="touchButton" id="rightButton" aria-label="Вправо">→</button>
</div>
</div>
<script>
/* ============================================================
   ОГЛАВЛЕНИЕ (поиск по заголовку «====» или по имени функции)
   1. Константы и состояние мира
   2. Данные и сохранения (bankCoins, unlockedAvatars, highScore)
   3. Ветер               4. Задания на забег     5. Звук
   6. Генерация мира (platformStep, spawnPlatform, spawnTerrainStep)
   7. Типография          8. Объекты мира (птицы, монеты, жизни)
   9. Главное меню (витрина, сетка, нижняя панель)
  10. Физика и логика забега (update)   11. HUD
  12. Пауза              13. Game over  14. Ввод (клавиатура, мышь, тач)
  15. Главный цикл (draw / requestAnimationFrame)
   ============================================================ */
'use strict';

const canvas=document.getElementById('game');
let ctx=canvas.getContext('2d');
const RENDER_SCALE=4;
ctx.scale(RENDER_SCALE,RENDER_SCALE);

/* ============================================================
   ЗИМНЯЯ СЦЕНА
   ============================================================ */

const WINTER = {
    skyTop: '#5aa2d2',
    skyHigh: '#7fbde0',
    skyMid: '#b8dcee',
    skyLow: '#e2f2fa',
    skyBottom: '#f7fcff',
    peakFar: '#a8c6db',
    peakMid: '#c3dcec',
    peakCap: '#ffffff',
    iceTop: '#f0feff',
    iceMid: '#5cc3e6',
    iceDeep: '#227fa8',
    snowMid: '#d6ecf8',
    snowDeep: '#8fbdd4',
    woodTop: '#c08a58',
    woodMid: '#9a6039',
    woodDeep: '#633c26',
    goldTop: '#fff4b0',
    goldMid: '#ffc82e',
    goldDeep: '#c88700',
    shadow: 'rgba(60,110,145,.20)'
};

const winterScene = { canvas: null };

// Сцены биомов кэшируются по индексу: каждый фон рисуется один раз.
const biomeScenes = [null, null, null, null];

function winterSurface(w, h) {
    const c2 = document.createElement('canvas');
    c2.width = w * RENDER_SCALE;
    c2.height = h * RENDER_SCALE;
    const c = c2.getContext('2d');
    if (!c) return { canvas: null, c: null };
    c.scale(RENDER_SCALE, RENDER_SCALE);
    return { canvas: c2, c };
}

function drawMountain(c, apexX, apexY, halfW, baseY, body, cap) {
    c.beginPath();
    c.moveTo(apexX - halfW, baseY);
    c.lineTo(apexX, apexY);
    c.lineTo(apexX + halfW, baseY);
    c.closePath();
    c.fillStyle = body;
    c.fill();

    const capY = apexY + (baseY - apexY) * 0.36;
    const capHalf = halfW * 0.32;

    c.beginPath();
    c.moveTo(apexX - capHalf, capY);
    c.lineTo(apexX, apexY);
    c.lineTo(apexX + capHalf, capY);
    c.quadraticCurveTo(apexX + capHalf * 0.4, capY + 5, apexX, capY + 3);
    c.quadraticCurveTo(apexX - capHalf * 0.4, capY + 6, apexX - capHalf, capY);
    c.closePath();
    c.fillStyle = cap;
    c.fill();
}

function buildWinterBackground() {
    if (winterScene.canvas) return winterScene.canvas;

    const surface = winterSurface(400, 600);
    if (!surface.c) return null;

    const { canvas: cv, c } = surface;

    const sky = c.createLinearGradient(0, 0, 0, 600);
    sky.addColorStop(0, WINTER.skyTop);
    sky.addColorStop(0.34, WINTER.skyHigh);
    sky.addColorStop(0.60, WINTER.skyMid);
    sky.addColorStop(0.84, WINTER.skyLow);
    sky.addColorStop(1, WINTER.skyBottom);
    c.fillStyle = sky;
    c.fillRect(0, 0, 400, 600);

    const sun = c.createRadialGradient(310, 86, 4, 310, 86, 160);
    sun.addColorStop(0, 'rgba(255,253,238,.95)');
    sun.addColorStop(0.22, 'rgba(255,250,224,.42)');
    sun.addColorStop(1, 'rgba(255,250,224,0)');
    c.fillStyle = sun;
    c.fillRect(0, 0, 400, 320);

    const far = [
        [-16, 196, 128, 352], [64, 150, 112, 352], [146, 210, 104, 352],
        [236, 132, 126, 352], [316, 186, 110, 352], [398, 156, 118, 352]
    ];
    for (const p of far) drawMountain(c, p[0], p[1], p[2], p[3], WINTER.peakFar, WINTER.peakCap);

    const mid = [
        [8, 268, 116, 400], [104, 214, 108, 400], [204, 262, 118, 400],
        [300, 202, 118, 400], [396, 258, 110, 400]
    ];
    for (const p of mid) drawMountain(c, p[0], p[1], p[2], p[3], WINTER.peakMid, WINTER.peakCap);

    const haze = c.createLinearGradient(0, 250, 0, 430);
    haze.addColorStop(0, 'rgba(255,255,255,0)');
    haze.addColorStop(0.55, 'rgba(255,255,255,.72)');
    haze.addColorStop(1, 'rgba(255,255,255,.95)');
    c.fillStyle = haze;
    c.fillRect(0, 250, 400, 180);

    for (let i = 0; i < 5; i++) {
        const baseY = 430 + i * 34;
        const hill = c.createLinearGradient(0, baseY - 26, 0, baseY + 22);
        hill.addColorStop(0, '#ffffff');
        hill.addColorStop(1, '#e6f3fb');
        c.fillStyle = hill;
        c.beginPath();
        c.ellipse(200 + (i % 2 ? 40 : -40), baseY, 260, 26, 0, 0, Math.PI * 2);
        c.fill();
    }

    c.fillStyle = 'rgba(250,253,255,.34)';
    c.fillRect(0, 0, 400, 600);

    const edge = c.createRadialGradient(200, 300, 150, 200, 300, 380);
    edge.addColorStop(0, 'rgba(40,90,125,0)');
    edge.addColorStop(1, 'rgba(40,90,125,.14)');
    c.fillStyle = edge;
    c.fillRect(0, 0, 400, 600);

    winterScene.canvas = cv;
    return cv;
}

/* ============================================================
   БИОМЫ: ФОН МЕНЯЕТСЯ КАЖДЫЕ 20 000 ОЧКОВ
   ============================================================ */

const BIOME_STEP = 20000;
const BIOME_BLEND = 2500;   // сколько очков длится плавный переход

const BIOME_PALETTES = [
    // 0: день, снежные вершины — исходная сцена
    { sky: ['#5aa2d2', '#7fbde0', '#b8dcee', '#e2f2fa', '#f7fcff'], far: '#a8c6db', mid: '#c3dcec', cap: '#ffffff', veil: 'rgba(250,253,255,.34)', tint: null },
    // 1: синее небо на закате
    { sky: ['#2b5b96', '#5a86c4', '#c08bb8', '#f3b391', '#ffd9a8'], far: '#7b8fb8', mid: '#a3a8cc', cap: '#ffe9d6', veil: 'rgba(255,214,180,.20)', tint: 'rgba(255,150,90,.10)' },
    // 2: полярное сияние
    { sky: ['#071b3a', '#0d2a55', '#12496e', '#0f6d7a', '#0b4a55'], far: '#1c3f63', mid: '#22567c', cap: '#b8f5e0', veil: 'rgba(120,255,220,.10)', tint: 'rgba(60,255,200,.10)' },
    // 3: ночь со звёздами
    { sky: ['#050d1e', '#0a1730', '#101f42', '#16264d', '#1b2c55'], far: '#22304f', mid: '#2b3d61', cap: '#dfe8ff', veil: 'rgba(180,205,255,.08)', tint: 'rgba(80,120,220,.12)' }
];

function biomeIndexForScore(score) {
    return Math.min(BIOME_PALETTES.length - 1, Math.floor(score / BIOME_STEP));
}

// Доля перехода между текущим и следующим биомом: 0 — чистый текущий, 1 — следующий.
function biomeBlend(score) {
    const index = biomeIndexForScore(score);
    if (index >= BIOME_PALETTES.length - 1) return 0;

    const start = (index + 1) * BIOME_STEP - BIOME_BLEND;
    if (score <= start) return 0;
    return Math.min(1, (score - start) / BIOME_BLEND);
}

function drawStars(c, count, alpha) {
    c.fillStyle = `rgba(255,255,255,${alpha})`;
    for (let i = 0; i < count; i++) {
        // Детерминированное распределение: без Math.random, чтобы фон не мерцал.
        const x = ((i * 73) % 400) + ((i * 31) % 7);
        const y = ((i * 137) % 330) + ((i * 19) % 5);
        const r = 0.5 + ((i * 13) % 10) / 12;
        c.beginPath();
        c.arc(x, y, r, 0, Math.PI * 2);
        c.fill();
    }
}

function drawAurora(c, time) {
    c.save();
    c.globalCompositeOperation = 'lighter';

    for (let band = 0; band < 3; band++) {
        const baseY = 90 + band * 46;
        const grad = c.createLinearGradient(0, baseY - 60, 0, baseY + 90);
        const hue = band === 0 ? '120,255,200' : band === 1 ? '90,180,255' : '180,130,255';
        grad.addColorStop(0, `rgba(${hue},0)`);
        grad.addColorStop(0.45, `rgba(${hue},.30)`);
        grad.addColorStop(1, `rgba(${hue},0)`);
        c.fillStyle = grad;

        c.beginPath();
        c.moveTo(0, baseY + 90);
        for (let x = 0; x <= 400; x += 20) {
            const wave = Math.sin((x / 400) * Math.PI * 2 + band * 1.7 + time * 0.0006) * 26;
            c.lineTo(x, baseY + wave);
        }
        c.lineTo(400, baseY + 90);
        c.closePath();
        c.fill();
    }

    c.restore();
}

function buildBiomeScene(index) {
    if (biomeScenes[index]) return biomeScenes[index];

    // Нулевой биом — прежняя зимняя сцена, её не перерисовываем.
    if (index === 0 && winterScene.canvas) {
        biomeScenes[0] = winterScene.canvas;
        return biomeScenes[0];
    }

    // Нулевой биом — оригинальная зимняя сцена. Проверяем до выделения
    // нового канваса, иначе каждый вызов создавал бы мусорный холст.
    if (index === 0) {
        const original = buildWinterBackground();
        if (original) {
            biomeScenes[0] = original;
            return original;
        }
    }

    const surface = winterSurface(400, 600);
    if (!surface.c) return null;

    const { canvas: cv, c } = surface;
    const pal = BIOME_PALETTES[index];

    const sky = c.createLinearGradient(0, 0, 0, 600);
    sky.addColorStop(0, pal.sky[0]);
    sky.addColorStop(0.34, pal.sky[1]);
    sky.addColorStop(0.60, pal.sky[2]);
    sky.addColorStop(0.84, pal.sky[3]);
    sky.addColorStop(1, pal.sky[4]);
    c.fillStyle = sky;
    c.fillRect(0, 0, 400, 600);

    if (index === 2) drawAurora(c, 0);
    if (index === 3) drawStars(c, 90, 0.85);
    if (index === 1) {
        // Солнце у горизонта — тёплое пятно.
        const sun = c.createRadialGradient(120, 300, 6, 120, 300, 150);
        sun.addColorStop(0, 'rgba(255,236,190,.95)');
        sun.addColorStop(0.3, 'rgba(255,190,140,.45)');
        sun.addColorStop(1, 'rgba(255,170,120,0)');
        c.fillStyle = sun;
        c.fillRect(0, 150, 400, 320);
    }

    const far = [
        [-16, 196, 128, 352], [64, 150, 112, 352], [146, 210, 104, 352],
        [236, 132, 126, 352], [316, 186, 110, 352], [398, 156, 118, 352]
    ];
    for (const p of far) drawMountain(c, p[0], p[1], p[2], p[3], pal.far, pal.cap);

    const mid = [
        [8, 268, 116, 400], [104, 214, 108, 400], [204, 262, 118, 400],
        [300, 202, 118, 400], [396, 258, 110, 400]
    ];
    for (const p of mid) drawMountain(c, p[0], p[1], p[2], p[3], pal.mid, pal.cap);

    const haze = c.createLinearGradient(0, 250, 0, 430);
    haze.addColorStop(0, 'rgba(255,255,255,0)');
    haze.addColorStop(0.55, pal.veil);
    haze.addColorStop(1, pal.veil);
    c.fillStyle = haze;
    c.fillRect(0, 250, 400, 180);

    for (let i = 0; i < 5; i++) {
        const baseY = 430 + i * 34;
        const hill = c.createLinearGradient(0, baseY - 26, 0, baseY + 22);
        hill.addColorStop(0, pal.cap);
        hill.addColorStop(1, pal.mid);
        c.fillStyle = hill;
        c.beginPath();
        c.ellipse(200 + (i % 2 ? 40 : -40), baseY, 260, 26, 0, 0, Math.PI * 2);
        c.fill();
    }

    c.fillStyle = pal.veil;
    c.fillRect(0, 0, 400, 600);

    if (pal.tint) {
        c.fillStyle = pal.tint;
        c.fillRect(0, 0, 400, 600);
    }

    const edge = c.createRadialGradient(200, 300, 150, 200, 300, 380);
    edge.addColorStop(0, 'rgba(10,30,60,0)');
    edge.addColorStop(1, 'rgba(10,30,60,.18)');
    c.fillStyle = edge;
    c.fillRect(0, 0, 400, 600);

    biomeScenes[index] = cv;
    return cv;
}

const backgroundImage = new Image();
backgroundImage.src = 'fon.jpg';

const windStreaks = Array.from({ length: 26 }, () => ({
    x: Math.random() * 400,
    y: Math.random() * 600,
    len: 8 + Math.random() * 22,
    speed: 0.6 + Math.random() * 1.1,
    alpha: 0.16 + Math.random() * 0.26
}));

let windStreakClock = 0;

function frameNow() {
    return performance.now() / 1000;
}

function drawWindStreaks() {
    if (!wind.active) return;
    const strength = Math.abs(wind.force);
    if (strength < 0.08) return;

    const now = frameNow();
    const dt = windStreakClock
        ? Math.min(3, Math.max(0, (now - windStreakClock) * 60))
        : 0;
    windStreakClock = now;

    const dir = Math.sign(wind.force) || 1;

    ctx.save();
    ctx.lineCap = 'round';

    for (const streak of windStreaks) {
        streak.x += dir * streak.speed * (1 + strength * 3.2) * dt;

        if (streak.x < -40) {
            streak.x = 440;
            streak.y = Math.random() * 600;
        } else if (streak.x > 440) {
            streak.x = -40;
            streak.y = Math.random() * 600;
        }

        const alpha = Math.min(0.85, streak.alpha * (0.5 + strength * 1.5));
        const headX = streak.x;
        const tailX = streak.x - dir * streak.len * (0.5 + strength * 0.7);
        const width = 1.1 + strength * 1.0;

        ctx.strokeStyle = `rgba(214,240,252,${alpha * 0.45})`;
        ctx.lineWidth = width + 1.8;
        ctx.beginPath();
        ctx.moveTo(headX, streak.y);
        ctx.lineTo(tailX, streak.y + 0.6);
        ctx.stroke();

        const ice = ctx.createLinearGradient(tailX, streak.y, headX, streak.y);
        ice.addColorStop(0, 'rgba(140,206,238,0)');
        ice.addColorStop(0.45, `rgba(96,178,224,${alpha * 0.75})`);
        ice.addColorStop(1, `rgba(34,116,176,${alpha})`);

        ctx.strokeStyle = ice;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(headX, streak.y);
        ctx.lineTo(tailX, streak.y + 0.6);
        ctx.stroke();
    }

    ctx.restore();
}

let backgroundHighlight = null;

function drawBackground() {
    if (backgroundImage.complete && backgroundImage.naturalWidth > 0) {
        ctx.drawImage(backgroundImage, 0, 0, 400, 600);
        ctx.fillStyle = 'rgba(220,245,255,.8)';
        ctx.fillRect(0, 0, 400, 600);

        // Координаты градиента не меняются — создаём один раз, а не каждый кадр.
        if (!backgroundHighlight) {
            backgroundHighlight = ctx.createLinearGradient(0, 0, 0, 260);
            backgroundHighlight.addColorStop(0, 'rgba(255,255,255,.36)');
            backgroundHighlight.addColorStop(1, 'rgba(255,255,255,0)');
        }
        ctx.fillStyle = backgroundHighlight;
        ctx.fillRect(0, 0, 400, 260);
        return;
    }

    const index = biomeIndexForScore(player.score);
    const blend = biomeBlend(player.score);

    const scene = buildBiomeScene(index);

    if (scene) {
        ctx.drawImage(scene, 0, 0, 400, 600);
    } else {
        ctx.fillStyle = WINTER.skyLow;
        ctx.fillRect(0, 0, 400, 600);
    }

    // Плавный переход: следующий биом проявляется поверх текущего.
    if (blend > 0) {
        const nextScene = buildBiomeScene(index + 1);

        if (nextScene) {
            ctx.save();
            ctx.globalAlpha = blend;
            ctx.drawImage(nextScene, 0, 0, 400, 600);
            ctx.restore();
        }
    }
}

function drawSnow(dt = 1) {
    const t = frameNow();
    ctx.save();

    for (const layer of snowLayers) {
        ctx.fillStyle = `rgba(255,255,255,${layer.alpha})`;

        for (const flake of layer.flakes) {
            flake.y += flake.speed * dt;

            if (flake.y > 610) {
                flake.y = -10;
                flake.x = Math.random() * 400;
            }

            const sway = Math.sin(t * flake.swaySpeed + flake.phase) * flake.sway;

            ctx.beginPath();
            ctx.arc(flake.x + sway, flake.y, flake.r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.restore();
}

const screenShake = { time: 0, duration: 0, intensity: 0, x: 0, y: 0 };

function startScreenShake(intensity = 2.5, duration = 12) {
    screenShake.time = Math.max(screenShake.time, duration);
    screenShake.duration = Math.max(screenShake.duration, duration);
    screenShake.intensity = Math.max(screenShake.intensity, intensity);
}

function updateScreenShake(dt) {
    if (screenShake.time <= 0) {
        screenShake.time = 0;
        screenShake.x = 0;
        screenShake.y = 0;
        return;
    }
    screenShake.time = Math.max(0, screenShake.time - dt);
    const fade = screenShake.duration > 0 ? screenShake.time / screenShake.duration : 0;
    const amount = screenShake.intensity * fade;
    const phase = (screenShake.duration - screenShake.time) * 2.4;
    screenShake.x = Math.sin(phase * 1.7) * amount;
    screenShake.y = Math.cos(phase * 2.3) * amount * 0.7;
}

   ============================================================ */

const WIND_FROM_SCORE = 10000;

// Потолок силы: дальше ветер не растёт, иначе высокие очки
// становятся непроходимыми.
const WIND_FULL_SCORE = 60000;

// На 10 000 ветер едва заметен, к 60 000 — сбивает с платформы.
const WIND_STRENGTH_MIN = 0.9;
const WIND_STRENGTH_MAX = 4.6;

// Пауза между порывами, в кадрах (1 кадр ≈ 16.7 мс).
// В начале забега порывы редкие и длинные, к потолку — частые и короткие.
// ПАУЗА — время от конца одного порыва до начала следующего.
// На 10 000 это долгий покой, к 60 000 — короткая передышка.
const WIND_REST_LONG_MIN = 750;   // 12.5 с
const WIND_REST_LONG_MAX = 1050;  // 17.5 с
const WIND_REST_FAST_MIN = 90;    // 1.5 с
const WIND_REST_FAST_MAX = 180;   // 3 с

// ДЛИТЕЛЬНОСТЬ самого порыва. Раньше её не было: ветер дул от телеграфа
// до следующего телеграфа, и пауза съедалась почти целиком.
const WIND_GUST_LONG_MIN = 210;   // 3.5 с
const WIND_GUST_LONG_MAX = 330;   // 5.5 с
const WIND_GUST_FAST_MIN = 75;    // 1.25 с
const WIND_GUST_FAST_MAX = 130;   // 2.2 с

// Телеграф: сколько кадров ветер «предупреждает» перед включением.
const WIND_WARN_START = 130;      // ~2.2 с
const WIND_WARN_END = 80;         // ~1.3 с

const wind = {
    force: 0,
    dir: 0,
    phase: 'rest', // 'rest' | 'warn' | 'gust'
    timer: 0,      // сколько длится текущая пауза
    nextAt: 340,   // сколько пауза должна длиться
    gustLeft: 0,   // сколько осталось дуть
    warn: 0,       // сколько осталось телеграфа
    active: false
};

// Насколько игрок продвинулся от порога включения до потолка: 0..1.
function windProgress() {
    const span = Math.max(1, WIND_FULL_SCORE - WIND_FROM_SCORE);
    return Math.max(0, Math.min(1, (player.score - WIND_FROM_SCORE) / span));
}

function windStrength() {
    return WIND_STRENGTH_MIN
        + (WIND_STRENGTH_MAX - WIND_STRENGTH_MIN) * windProgress();
}

// Сколько кадров ждать до следующего порыва.
function windRestFrames() {
    const p = windProgress();
    const lo = WIND_REST_LONG_MIN + (WIND_REST_FAST_MIN - WIND_REST_LONG_MIN) * p;
    const hi = WIND_REST_LONG_MAX + (WIND_REST_FAST_MAX - WIND_REST_LONG_MAX) * p;
    return lo + Math.random() * (hi - lo);
}

// Длительность предупреждения тоже сокращается: на высоких очках
// игрок уже знает, что делать, и долгий телеграф только тянет время.
function windWarnFrames() {
    return Math.round(WIND_WARN_START + (WIND_WARN_END - WIND_WARN_START) * windProgress());
}

// Сколько кадров длится сам порыв.
function windGustFrames() {
    const p = windProgress();
    const lo = WIND_GUST_LONG_MIN + (WIND_GUST_FAST_MIN - WIND_GUST_LONG_MIN) * p;
    const hi = WIND_GUST_LONG_MAX + (WIND_GUST_FAST_MAX - WIND_GUST_LONG_MAX) * p;
    return lo + Math.random() * (hi - lo);
}

function resetWind() {
    wind.force = 0;
    wind.dir = 0;
    wind.phase = 'rest';
    wind.timer = 0;
    wind.warn = 0;
    wind.gustLeft = 0;
    wind.nextAt = 340;
    wind.active = false;
}

function updateWind(dt) {
    const wasActive = wind.active;
    // Перк «без ветра» гасит механику на 10 000 очков, но не ломает цикл:
    // как только перк кончается, ветер возвращается сам.
    wind.active = player.score >= WIND_FROM_SCORE && !windSuppressedByPerk();

    if (!wind.active) {
        wind.force = 0;
        wind.dir = 0;
        wind.phase = 'rest';
        wind.timer = 0;
        wind.warn = 0;
        wind.gustLeft = 0;
        return;
    }

    // Первый порыв после включения приходит скоро: игрок только что
    // пересёк порог и должен сразу понять, что это за механика.
    if (!wasActive) {
        wind.phase = 'rest';
        wind.timer = 0;
        wind.warn = 0;
        wind.force = 0;
        wind.gustLeft = 0;
        wind.nextAt = 110 + Math.random() * 70;
    }

    // Цикл из трёх фаз. Раньше таймер паузы тикал и во время телеграфа,
    // и во время порыва — из-за этого реальная пауза выходила короче
    // заданной, а на высоких очках уходила в минус и ветер дул подряд.
    if (wind.phase === 'warn') {
        wind.warn = Math.max(0, wind.warn - dt);

        if (wind.warn === 0) {
            wind.phase = 'gust';
            wind.gustLeft = windGustFrames();
        }
    } else if (wind.phase === 'gust') {
        wind.gustLeft = Math.max(0, wind.gustLeft - dt);

        if (wind.gustLeft === 0) {
            wind.phase = 'rest';
            wind.timer = 0;
            wind.nextAt = windRestFrames();
        }
    } else {
        // Пауза: отсчёт начинается только после того, как ветер стих.
        wind.timer += dt;

        if (wind.timer >= wind.nextAt) {
            // Направление всегда ненулевое: «штиль» читался бы как пропавший ветер.
            wind.dir = Math.random() < 0.5 ? -1 : 1;
            wind.warn = windWarnFrames();
            wind.phase = 'warn';
        }
    }

    const target = wind.phase === 'gust' ? wind.dir : 0;

    // Разгон резче на высоких очках: поток должен ощущаться как порыв,
    // а не как постепенно нарастающее течение.
    const accel = 0.060 + windProgress() * 0.070;
    wind.force += (target - wind.force) * Math.min(1, accel * dt);
}

function applyWind(dt) {
    if (!wind.active || !wind.force) return;
    player.x += wind.force * windStrength() * dt;
}

        hudState.coinPulse = 1;
        hudPop(player.x + 15, player.y - 24, `+${quest.reward} ЗА ЗАДАНИЕ`, '#0f8a76');
    }
}

const sound = { ctx: null, enabled: true, master: null };

function initSound() {
    if (sound.ctx) return sound.ctx;

    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;

    try {
        sound.ctx = new Ctor();
        sound.master = sound.ctx.createGain();
        sound.master.gain.value = 0.05;
        sound.master.connect(sound.ctx.destination);
    } catch {
        sound.ctx = null;
    }

    return sound.ctx;
}

function playTone(freqFrom, freqTo, duration, type = 'sine', volume = 1) {
    if (!sound.enabled) return;
    const ac = initSound();
    if (!ac) return;
    if (ac.state === 'suspended') ac.resume();

    try {
        const t0 = ac.currentTime;
        const osc = ac.createOscillator();
        const gain = ac.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freqFrom, t0);
        osc.frequency.exponentialRampToValueAtTime(Math.max(30, freqTo), t0 + duration);

        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

        osc.connect(gain);
        gain.connect(sound.master);
        osc.start(t0);
        osc.stop(t0 + duration + 0.02);
    } catch { /* звук необязателен */ }
}

function playNoise(duration, volume = 1) {
    if (!sound.enabled) return;
    const ac = initSound();
    if (!ac) return;

    try {
        const frames = Math.floor(ac.sampleRate * duration);
        const buffer = ac.createBuffer(1, frames, ac.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < frames; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
        }

        const src = ac.createBufferSource();
        const gain = ac.createGain();
        const filter = ac.createBiquadFilter();

        filter.type = 'lowpass';
        filter.frequency.value = 1400;

        src.buffer = buffer;
        gain.gain.value = volume;

        src.connect(filter);
        filter.connect(gain);
        gain.connect(sound.master);
        src.start();
    } catch { /* ignore */ }
}

function vibrate(pattern) {
    if (!sound.enabled) return;
    if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch { /* ignore */ }
    }
}

const sfx = {
    jump()   { playTone(300, 520, 0.09, 'sine', 0.7); },
    coin()   { playTone(880, 1180, 0.07, 'triangle', 0.8); setTimeout(() => playTone(1180, 1480, 0.07, 'triangle', 0.6), 55); },
    spring() { playTone(220, 780, 0.16, 'sine', 0.8); },
    land()   { playTone(160, 110, 0.06, 'sine', 0.4); },
    crack()  { playNoise(0.14, 0.5); },
    fall()   { playTone(300, 70, 0.34, 'sine', 0.9); },
    life()   { playTone(660, 990, 0.12, 'triangle', 0.7); },
    hit()    { playTone(190, 90, 0.12, 'square', 0.55); playNoise(0.08, 0.35); },
    click()  { playTone(520, 460, 0.04, 'sine', 0.35); }
};

function loadSoundSetting() {
    try {
        if (localStorage.getItem('morjakaSound') === '0') sound.enabled = false;
    } catch { /* ignore */ }
}

function syncSoundButton() {
    if (!soundButton) return;
    soundButton.classList.toggle('muted', !sound.enabled);
    soundButton.setAttribute('aria-label', sound.enabled ? 'Выключить звук' : 'Включить звук');
    soundButton.title = sound.enabled ? 'Звук включён' : 'Звук выключен';
}

function toggleSound() {
    sound.enabled = !sound.enabled;
    try { localStorage.setItem('morjakaSound', sound.enabled ? '1' : '0'); } catch { /* ignore */ }
    syncSoundButton();
    if (sound.enabled) sfx.click();
}

let platforms = [], fallingPlatforms = [], verticalPlatforms = [],
    springs = [], coins = [], lifePickups = [], birds = [],
    lives = 0, nextLifeScore = 20000, doubleJumpAvailable = false,
    runCoins = 0;

const keys = {};

function resetGame() {
    player = { x: 185, y: 500, vx: 0, dy: 0, score: 0 };
    platforms = [{ x: 120, y: 550, w: 160, h: 15, type: 'static' }];
    fallingPlatforms = [];
    verticalPlatforms = [];
    springs = [];
    coins = [];
    lifePickups = [];
    birds = [];
    lives = 0;
    nextLifeScore = 20000;
    doubleJumpAvailable = false;
    runCoins = 0;
    resetPerks();
    resetWind();
    resetQuests();
    fallCooldown = 0;
    squash = 0;

    for (let i = 0; i < 7; i++) {
        const y = 500 - i * 100;
        const step = spawnTerrainStep(y);
        for (const p of step.platforms) platforms.push(p);
        for (const v of step.verticals) verticalPlatforms.push(v);
    }
}

function startGame() {
    resetGame();
    resetHud();
    gameOverState.openedAt = 0;
    pauseState.hover = null;
    lastFrameTime = 0;
    currentState = STATE.PLAYING;
}

function resumeGame() {
    currentState = STATE.PLAYING;
    pauseState.hover = null;
    lastFrameTime = 0;
}

function pauseGame() {
    if (currentState !== STATE.PLAYING) return;
    currentState = STATE.PAUSE;
    lastFrameTime = 0;
    pauseState.openedAt = performance.now();
}

// Удаляет элементы на месте (без нового массива) и сохраняет порядок.
// Если ничего не удалено — массив не трогаем вовсе.
function removeWhere(arr, shouldRemove) {
    let write = 0;
    for (let read = 0; read < arr.length; read++) {
        const item = arr[read];
        if (!shouldRemove(item)) {
            if (write !== read) arr[write] = item;
            write++;
        }
    }
    arr.length = write;
    return arr;
}

function platformStep() {
    return 90 + Math.random() * 40;
}

function spawnPlatform(y) {
    const level = Math.floor(player.score / 4000);
    const brokenChance = Math.min(.35, .05 + level * .05);
    const movingChance = Math.min(.35, .05 + level * .05);
    const iceChance = player.score >= 12000 ? Math.min(.18, .06 + level * .02) : 0;

    const rand = Math.random();
    let type = 'static';

    if (rand < brokenChance) type = 'broken';
    else if (rand < brokenChance + movingChance) type = 'moving';
    else if (rand < brokenChance + movingChance + iceChance) type = 'ice';

    const width = 70 * Math.max(.7, 2 - level * .25);
    const platform = {
        x: Math.random() * (400 - width),
        y,
        w: width,
        h: 15,
        type,
        dir: 2 * Math.min(2, 1 + Math.floor(player.score / 2500) * .2)
    };

    // Пружины, монеты и жизни ставятся по фиксированным координатам в момент
    // спавна. Движущаяся платформа потом уезжает из-под них, и предмет
    // остаётся висеть в воздухе. Поэтому на 'moving' их не ставим вообще.
    // 'broken' тоже не годится: платформа ломается и падает.
    const holdsPickups = type === 'static' || type === 'ice';

    if (holdsPickups && Math.random() > .7) {
        springs.push({ x: platform.x + platform.w / 2 - 10, y: y - 15 });
    }

    // Дуга выпадает часто: примерно одна на 8 подходящих платформ.
    // Монет в связке меньше, но встречаются они заметно чаще —
    // собирать приятнее, чем ждать редкую жирную гирлянду.
    if (holdsPickups && Math.random() < 0.12) {
        spawnCoinArc(platform, y);
    }

    // Жизнь — редкий предмет: шанс 1 к 160 на подходящую платформу.
    // Подобран так, чтобы за 60 000 очков выпадало примерно 1–2 жизни.
    // Одновременно на экране не больше одной, иначе они бы копились.
    if (holdsPickups && lifePickups.length === 0 && Math.random() < 1 / 160) {
        lifePickups.push({ x: platform.x + platform.w / 2 - 9, y: y - 34, r: 10 });
    }

    return platform;
}

function spawnCoinArc(platform, platformY) {
    // 1-3 монеты: короткая связка читается лучше длинной гирлянды
    // и не заставляет прыгать по всей ширине платформы.
    const count = 1 + Math.floor(Math.random() * 3);

    const spanW = count === 1 ? 0 : Math.min(platform.w + 26, 78);
    const centerX = platform.x + platform.w / 2;
    const startX = count === 1 ? centerX : centerX - spanW / 2;
    const stepX = count > 1 ? spanW / (count - 1) : 0;

    const baseY = platformY - 26 - Math.random() * 8;
    const lift = 9 + Math.random() * 5;

    for (let i = 0; i < count; i++) {
        const t = count === 1 ? 0.5 : i / (count - 1);
        const arc = Math.sin(t * Math.PI);

        coins.push({
            x: startX + stepX * i,
            y: baseY - lift * arc,
            r: 9,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function spawnBrokenRun(baseY) {
    const gap = platformStep();
    const created = [];

    for (let i = 0; i < 3; i++) {
        const width = 62;
        created.push({
            x: Math.random() * (400 - width),
            y: baseY - gap * i,
            w: width,
            h: 15,
            type: 'broken',
            dir: 2
        });
    }

    return created;
}

function spawnTwinPlatforms(y) {
    const width = 60;
    return [
        { x: 14 + Math.random() * 40, y, w: width, h: 15, type: 'static', dir: 2 },
        { x: 400 - width - 14 - Math.random() * 40, y: y - 26, w: width, h: 15, type: 'static', dir: 2 }
    ];
}

function spawnVerticalPlatform(y) {
    const w = 80;
    const sideWidth = 70;
    const x = Math.random() < 0.5
        ? Math.random() * sideWidth
        : 400 - w - Math.random() * sideWidth;

    return {
        x, y, baseY: y, previousY: y, w, h: 15,
        phase: Math.random() * Math.PI * 2,
        speed: 0.025 + Math.random() * 0.01
    };
}

function spawnVerticalStep(y) {
    const crystal = spawnVerticalPlatform(y);

    const gap = 16;
    const crystalAtLeft = crystal.x < 200;
    const freeStart = crystalAtLeft ? crystal.x + crystal.w + gap : 0;
    const freeEnd = crystalAtLeft ? 400 : crystal.x - gap;
    const freeWidth = Math.max(40, freeEnd - freeStart);

    const regular = spawnPlatform(y);
    regular.w = Math.min(regular.w, freeWidth);
    regular.x = freeStart + Math.random() * Math.max(0, freeWidth - regular.w);

    return { platform: regular, crystal };
}

function spawnTerrainStep(y) {
    const level = Math.floor(player.score / 4000);
    const roll = Math.random();
    const specialsUnlocked = player.score >= 14000;
    const specialsSpan = specialsUnlocked ? 0.20 : 0;

    if (specialsUnlocked && roll < 0.10) {
        return { platforms: spawnBrokenRun(y), verticals: [] };
    }

    if (specialsUnlocked && roll < 0.20) {
        return { platforms: spawnTwinPlatforms(y), verticals: [] };
    }

    const verticalChance = Math.min(0.16, 0.06 + level * 0.012);

    if (roll < specialsSpan + verticalChance) {
        const step = spawnVerticalStep(y);
        return { platforms: [step.platform], verticals: [step.crystal] };
    }

    return { platforms: [spawnPlatform(y)], verticals: [] };
}

const BIRD_KINDS = {
    gull:  { scale: 1.0,  speed: 2.2,  color: '#4b5563', accent: '#e8eef4', wave: 0.9, waveSpeed: 0.035, push: 14 },
    swift: { scale: 0.78, speed: 3.5,  color: '#7c4dbe', accent: '#e8dcff', wave: 2.6, waveSpeed: 0.085, push: 8 },
    raven: { scale: 1.28, speed: 1.55, color: '#2f3a48', accent: '#8a97a8', wave: 1.5, waveSpeed: 0.03,  push: 26 }
};

function birdGrowth() {
    return Math.min(1, Math.max(0, player.score / 60000));
}

function spawnBird() {
    const kindName = Math.random() < 0.5 ? 'gull'
        : Math.random() < 0.55 ? 'swift'
        : 'raven';
    const kind = BIRD_KINDS[kindName];

    const growth = birdGrowth();
    const direction = Math.random() < 0.5 ? 1 : -1;
    const size = kind.scale * (0.85 + growth * 0.6);
    const speed = kind.speed + growth * 2.2;

    const bird = {
        kind: kindName,
        color: kind.color,
        accent: kind.accent,
        x: direction === 1 ? -46 : 446,
        y: 110 + Math.random() * 380,
        vx: direction * speed,
        dir: direction,
        baseY: 0,
        wave: kind.wave * (0.8 + growth * 0.7),
        waveSpeed: kind.waveSpeed,
        phase: Math.random() * Math.PI * 2,
        size,
        flap: Math.random() * Math.PI * 2,
        flapSpeed: 0.20 + growth * 0.16,
        hitCooldown: 0
    };

    bird.baseY = bird.y;
    birds.push(bird);
}

   ============================================================ */

const FONT_STACK = '"Trebuchet MS","Segoe UI",Arial,sans-serif';

function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
}

function fmt(n) {
    return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
}

function setFont(size, weight = 'bold') {
    ctx.font = `${weight} ${size}px ${FONT_STACK}`;
}

const charWidthCache = new Map();

function charWidth(ch) {
    const key = ctx.font + '\u0000' + ch;
    let w = charWidthCache.get(key);

    if (w === undefined) {
        w = ctx.measureText(ch).width;
        if (charWidthCache.size > 600) charWidthCache.clear();
        charWidthCache.set(key, w);
    }

    return w;
}

function trackedWidth(text, tracking = 0) {
    const chars = [...text];
    let sum = 0;
    for (const ch of chars) sum += charWidth(ch);
    return sum + tracking * Math.max(0, chars.length - 1);
}

function trackedText(text, x, y, tracking = 0, align = 'center') {
    const chars = [...text];
    const total = trackedWidth(text, tracking);
    let cursor = align === 'center' ? x - total / 2
        : align === 'right' ? x - total
        : x;
    const prevAlign = ctx.textAlign;
    ctx.textAlign = 'left';
    for (const ch of chars) {
        ctx.fillText(ch, cursor, y);
        cursor += charWidth(ch) + tracking;
    }
    ctx.textAlign = prevAlign;
    return total;
}

function shadeHex(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255]
        .map(v => Math.max(0, Math.min(255, Math.round(v + 255 * amount))))
        .map(v => v.toString(16).padStart(2, '0'))
        .join('');
}

function hexToRgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function drawSparkle(x, y, s, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.quadraticCurveTo(x, y, x + s, y);
    ctx.quadraticCurveTo(x, y, x, y + s);
    ctx.quadraticCurveTo(x, y, x - s, y);
    ctx.quadraticCurveTo(x, y, x, y - s);
    ctx.fill();
    ctx.restore();
}

function drawHeart(x, y, s, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.2, x - s * 0.6, y - s * 1.2, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.4, y - s * 0.2, x, y + s * 0.9);
    ctx.fill();
    ctx.restore();
}

function drawLockIcon(cx, cy, s, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, s * 0.2);
    ctx.beginPath();
    ctx.arc(cx, cy - s * 0.34, s * 0.4, Math.PI, 0);
    ctx.stroke();
    roundedRect(cx - s * 0.62, cy - s * 0.06, s * 1.24, s * 0.92, s * 0.22);
    ctx.fill();
    ctx.restore();
}

function drawAvatarCircle(cx, cy, r, index) {
    const img = avatarImages[index];
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2);
    } else {
        const fallback = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
        fallback.addColorStop(0, '#ffd98a');
        fallback.addColorStop(1, '#e0575f');
        ctx.fillStyle = fallback;
        ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        ctx.fillStyle = 'rgba(255,255,255,.86)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(Math.max(10, r * 0.9), 'bold');
        ctx.fillText(String(index + 1), cx, cy);
    }
    ctx.restore();
}

/* ---------- рамки: кольцо, орнаменты, эффекты ---------- */

function drawFrameRing(cx, cy, r, look, t) {
    const s = r / 24;
    const w = look.width * s;

    ctx.save();

    const g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    g.addColorStop(0, look.colors[0]);
    g.addColorStop(0.5, look.colors[1]);
    g.addColorStop(1, look.colors[2]);

    ctx.shadowColor = look.glow;
    ctx.shadowBlur = look.pulse ? 10 + Math.sin(t * 4) * 5 : 8;
    ctx.strokeStyle = g;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = Math.max(0.8, w * 0.18);
    ctx.beginPath();
    ctx.arc(cx, cy, r - w * 0.25, Math.PI * 1.15, Math.PI * 1.6);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(10,20,35,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r + w / 2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.arc(cx, cy, r - w / 2, 0, Math.PI * 2);
    ctx.stroke();

    if (look.double) {
        ctx.strokeStyle = look.colors[1];
        ctx.lineWidth = 1.5 * s;
        ctx.beginPath();
        ctx.arc(cx, cy, r + w / 2 + 3 * s, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();
}

function drawOrnaments(cx, cy, r, look, t) {
    const k = r / 24;
    const angles = count => Array.from({ length: count }, (_, i) => i / count * Math.PI * 2);

    ctx.save();

    switch (look.ornament) {
        case 'rivets':
            for (const a of angles(12)) {
                const x = cx + Math.cos(a) * r;
                const y = cy + Math.sin(a) * r;
                const g = ctx.createRadialGradient(x - k, y - k, 0.5 * k, x, y, 2.6 * k);
                g.addColorStop(0, '#fffbe0');
                g.addColorStop(1, look.colors[2]);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, 2.4 * k, 0, Math.PI * 2);
                ctx.fill();
            }
            break;

        case 'crystals':
            for (const a of angles(8)) {
                ctx.save();
                ctx.translate(cx + Math.cos(a) * (r + k), cy + Math.sin(a) * (r + k));
                ctx.rotate(a + Math.PI / 2);
                ctx.fillStyle = 'rgba(190,245,255,.95)';
                ctx.strokeStyle = look.colors[1];
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(-2.5 * k, 0);
                ctx.lineTo(0, -6 * k);
                ctx.lineTo(2.5 * k, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            break;

        case 'gems':
            for (const a of angles(6)) {
                ctx.save();
                ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                ctx.rotate(Math.PI / 4);
                const g = ctx.createLinearGradient(-3 * k, -3 * k, 3 * k, 3 * k);
                g.addColorStop(0, '#ffffff');
                g.addColorStop(0.4, look.colors[1]);
                g.addColorStop(1, look.colors[2]);
                ctx.fillStyle = g;
                ctx.strokeStyle = 'rgba(60,0,15,.6)';
                ctx.lineWidth = 0.8;
                ctx.fillRect(-3 * k, -3 * k, 6 * k, 6 * k);
                ctx.strokeRect(-3 * k, -3 * k, 6 * k, 6 * k);
                ctx.restore();
            }
            break;

        case 'leaves':
            for (const a of angles(8)) {
                ctx.save();
                ctx.translate(cx + Math.cos(a) * (r + 2 * k), cy + Math.sin(a) * (r + 2 * k));
                ctx.rotate(a);
                ctx.fillStyle = look.colors[1];
                ctx.beginPath();
                ctx.ellipse(0, 0, 5 * k, 2.2 * k, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            break;

        case 'sparkles':
            for (let i = 0; i < 4; i++) {
                const a = t * 0.8 + i * Math.PI / 2;
                const s = (3 + Math.sin(t * 5 + i) * 1.2) * k;
                drawSparkle(
                    cx + Math.cos(a) * (r + 3 * k),
                    cy + Math.sin(a) * (r + 3 * k),
                    s,
                    i % 2 ? '#ffffff' : look.colors[0]
                );
            }
            break;

        case 'flames':
            for (const a of angles(12)) {
                const flick = 0.5 + 0.5 * Math.sin(t * 9 + a * 3);
                const h = (4 + flick * 4) * k;
                ctx.save();
                ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                ctx.rotate(a + Math.PI / 2);
                const g = ctx.createLinearGradient(0, 0, 0, -h);
                g.addColorStop(0, look.colors[1]);
                g.addColorStop(1, 'rgba(255,240,150,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.moveTo(-2.6 * k, 0);
                ctx.quadraticCurveTo(-2.6 * k, -h * 0.6, 0, -h);
                ctx.quadraticCurveTo(2.6 * k, -h * 0.6, 2.6 * k, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            break;

        case 'hearts':
            for (const a of angles(6)) {
                drawHeart(cx + Math.cos(a) * (r + 3 * k), cy + Math.sin(a) * (r + 3 * k), 2.6 * k, look.colors[1]);
            }
            break;

        case 'waves':
            ctx.strokeStyle = look.colors[1];
            ctx.lineWidth = 1.6 * k;
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            for (let i = 0; i <= 120; i++) {
                const a = i / 120 * Math.PI * 2;
                const rr = r + 3 * k + Math.sin(a * 6 + t * 3) * 1.6 * k;
                const x = cx + Math.cos(a) * rr;
                const y = cy + Math.sin(a) * rr;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.globalAlpha = 1;
            break;

        case 'rays':
            ctx.lineCap = 'round';
            for (const a0 of angles(12)) {
                const a = a0 + t * 0.4;
                const len = (5 + Math.sin(t * 4 + a0) * 1.5) * k;
                ctx.strokeStyle = 'rgba(255,224,102,.9)';
                ctx.lineWidth = 1.6 * k;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(a) * (r + 2 * k), cy + Math.sin(a) * (r + 2 * k));
                ctx.lineTo(cx + Math.cos(a) * (r + 2 * k + len), cy + Math.sin(a) * (r + 2 * k + len));
                ctx.stroke();
            }
            break;

        case 'neon':
            ctx.shadowColor = look.glow;
            ctx.shadowBlur = 12;
            ctx.strokeStyle = `rgba(124,255,107,${0.35 + 0.25 * Math.sin(t * 4)})`;
            ctx.lineWidth = 2 * k;
            ctx.beginPath();
            ctx.arc(cx, cy, r + 4 * k + Math.sin(t * 4) * k, 0, Math.PI * 2);
            ctx.stroke();
            break;
    }

    ctx.restore();
}

function drawExtrasBack(cx, cy, r, look, t) {
    const k = r / 24;
    const extras = look.extras || [];
    ctx.save();

    if (extras.includes('aura')) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);
        const g = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.9);
        g.addColorStop(0, hexToRgba(look.glow, 0.05));
        g.addColorStop(0.6, hexToRgba(look.glow, 0.25 + 0.15 * pulse));
        g.addColorStop(1, hexToRgba(look.glow, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 1.9, 0, Math.PI * 2);
        ctx.fill();
    }

    if (extras.includes('wings')) {
        const flap = Math.sin(t * 3) * 0.35;
        for (const side of [-1, 1]) {
            ctx.save();
            ctx.translate(cx + side * r * 0.95, cy - r * 0.1);
            ctx.scale(side, 1);
            ctx.rotate(-0.3 + flap);
            const g = ctx.createLinearGradient(0, 0, r * 1.8, 0);
            g.addColorStop(0, look.colors[1]);
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.ellipse(r * (0.6 + i * 0.45), i * 2.2 * k - 2 * k, r * (0.55 - i * 0.08), r * 0.22, -0.2 + i * 0.18, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    ctx.restore();
}

function drawExtrasFront(cx, cy, r, look, t) {
    const k = r / 24;
    const extras = look.extras || [];
    ctx.save();

    if (extras.includes('shock')) {
        for (let i = 0; i < 2; i++) {
            const p = (t * 0.7 + i * 0.5) % 1;
            ctx.strokeStyle = hexToRgba(look.glow, 0.7 * (1 - p));
            ctx.lineWidth = 1.5 * k;
            ctx.beginPath();
            ctx.arc(cx, cy, r + p * 10 * k, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    if (extras.includes('aurora')) {
        const cols = [look.colors[0], look.glow, look.colors[1], '#ffffff'];
        for (let i = 0; i < 4; i++) {
            const start = t * 0.9 + i * Math.PI / 2;
            ctx.strokeStyle = hexToRgba(cols[i], 0.85);
            ctx.lineWidth = 2 * k;
            ctx.beginPath();
            ctx.arc(cx, cy, r + 3 * k, start, start + Math.PI / 3);
            ctx.stroke();
        }
    }

    if (extras.includes('orbit')) {
        for (let i = 0; i < 3; i++) {
            const a = t * 1.3 + i * Math.PI * 2 / 3;
            drawSparkle(
                cx + Math.cos(a) * (r + 6 * k),
                cy + Math.sin(a) * (r + 6 * k),
                2.2 * k,
                i % 2 ? '#ffffff' : look.glow
            );
        }
    }

    if (extras.includes('twinkle')) {
        for (let i = 0; i < 5; i++) {
            const a = i * 1.257 + 0.4;
            const s = (1.5 + 1.5 * (0.5 + 0.5 * Math.sin(t * 3 + i * 2))) * k;
            drawSparkle(cx + Math.cos(a) * (r + 8 * k), cy + Math.sin(a) * (r + 8 * k), s, '#ffffff');
        }
    }

    if (extras.includes('lightning')) {
        const slot = Math.floor(t * 2.5);
        const flash = (t * 2.5) % 1;
        if (flash < 0.45) {
            for (let b = 0; b < 2; b++) {
                const a = (slot * 2.4 + b * Math.PI) % (Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,.95)';
                ctx.shadowColor = look.glow;
                ctx.shadowBlur = 6;
                ctx.lineWidth = 1.2 * k;
                ctx.beginPath();
                for (let s = 0; s <= 4; s++) {
                    const rr = r + (1 + s * 2.2) * k;
                    const aa = a + (s % 2 ? 1 : -1) * 0.12;
                    const px = cx + Math.cos(aa) * rr;
                    const py = cy + Math.sin(aa) * rr;
                    if (s === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }
    }

    if (extras.includes('halo')) {
        const y = cy - r - 17 * k + Math.sin(t * 2) * 0.8 * k;
        ctx.shadowColor = look.glow;
        ctx.shadowBlur = 8;
        ctx.strokeStyle = look.colors[0];
        ctx.lineWidth = 2 * k;
        ctx.beginPath();
        ctx.ellipse(cx, y, 9 * k, 3 * k, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    if (extras.includes('crown')) {
        const bx = cx, by = cy - r - 2 * k;
        const w = 12 * k, h = 8 * k;
        ctx.fillStyle = look.colors[1];
        ctx.strokeStyle = look.colors[2];
        ctx.lineWidth = 1 * k;
        ctx.beginPath();
        ctx.moveTo(bx - w, by);
        ctx.lineTo(bx - w, by - h * 0.6);
        ctx.lineTo(bx - w * 0.5, by - h);
        ctx.lineTo(bx, by - h * 0.5);
        ctx.lineTo(bx + w * 0.5, by - h);
        ctx.lineTo(bx + w, by - h * 0.6);
        ctx.lineTo(bx + w, by);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(bx, by - h * 0.2, 1.4 * k, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawFrame(cx, cy, radius, frameId, compact = false) {
    const frame = FRAMES.find(item => item.id === frameId);
    if (!frame || !frame.look) return;

    const t = frameNow();

    // В компактной сетке эффекты с большим радиусом (крылья, молнии, ореол)
    // вылезали за карточку и наезжали на соседей. Оставляем кольцо и орнамент,
    // полный набор эффектов показывается в bottom sheet и на игроке.
    if (compact) {
        drawFrameRing(cx, cy, radius, frame.look, t);
        drawOrnaments(cx, cy, radius, frame.look, t);
        return;
    }

    drawExtrasBack(cx, cy, radius, frame.look, t);
    drawFrameRing(cx, cy, radius, frame.look, t);
    drawOrnaments(cx, cy, radius, frame.look, t);
    drawExtrasFront(cx, cy, radius, frame.look, t);
}

/* ============================================================
   ГЛАВНОЕ МЕНЮ: ВИТРИНА + СЕТКА-ВЫБОРЩИК + ЛИПКАЯ ПАНЕЛЬ
   Одноэкранная композиция без модальных окон: сверху витрина
   выбранного элемента, ниже прокручиваемая сетка, внизу действие.
   ============================================================ */

const MENU = {
    padX: 20,
    titleY: 20,
    tabsY: 40,
    tabsH: 32,
    showcaseY: 80,
    showcaseH: 148,
    gridY: 236,
    gridH: 250,
    cols: 5,
    cardW: 64,
    cardH: 78,
    gapX: 8,
    gapY: 10,
    barY: 494,
    barH: 52
};

const menuCursors = {
    avatars: selectedAvatar,
    shop: Math.max(0, FRAMES.findIndex(f => f.id === selectedFrame))
};

const menuState = {
    tab: 'avatars',
    scroll: 0,
    dragging: false,
    dragStartY: 0,
    dragScrollStart: 0,
    dragMoved: 0,
    pointerId: null,
    fadeT: 1,
    tabAnim: 0,
    pressIndex: -1,
    pressT: 0
};

function menuTabCount() {
    return menuState.tab === 'shop' ? FRAMES.length : avatarImages.length;
}

function menuCursor() {
    return menuCursors[menuState.tab];
}

function gridRowH() {
    return MENU.cardH + MENU.gapY;
}

function gridLeft() {
    const rowW = MENU.cols * MENU.cardW + (MENU.cols - 1) * MENU.gapX;
    return MENU.padX + (400 - MENU.padX * 2 - rowW) / 2;
}

function gridHeight() {
    return Math.ceil(menuTabCount() / MENU.cols) * gridRowH();
}

function menuMaxScroll() {
    return Math.max(0, gridHeight() - MENU.gridH);
}

function clampScroll() {
    menuState.scroll = Math.max(0, Math.min(menuMaxScroll(), menuState.scroll));
}

// Подкручиваем сетку так, чтобы выбранная карточка была в кадре.
function revealCursor(index) {
    const rowTop = Math.floor(index / MENU.cols) * gridRowH();
    const rowBottom = rowTop + MENU.cardH;

    if (rowTop < menuState.scroll) menuState.scroll = rowTop;
    else if (rowBottom > menuState.scroll + MENU.gridH) {
        menuState.scroll = rowBottom - MENU.gridH;
    }

    clampScroll();
}

// reveal — подтянуть карточку в кадр. Включаем только для клавиатуры:
// при тапе карточка уже под пальцем, и прыжок сетки выглядел бы как
// самопроизвольная домотка.
function setMenuCursor(index, reveal = false) {
    const next = Math.max(0, Math.min(menuTabCount() - 1, index));
    if (next === menuCursor()) return;

    menuCursors[menuState.tab] = next;
    menuState.fadeT = 0;

    if (reveal) revealCursor(next);
}

function switchMenuTab(tab) {
    if (menuState.tab === tab) return;

    menuState.tab = tab;
    menuState.scroll = 0;
    menuState.fadeT = 0;
    clampScroll();
    sfx.click();
}

function cardAtPoint(point) {
    if (point.y < MENU.gridY || point.y > MENU.gridY + MENU.gridH) return -1;

    const left = gridLeft();
    const localX = point.x - left;
    if (localX < 0) return -1;

    const pitch = MENU.cardW + MENU.gapX;
    const col = Math.floor(localX / pitch);
    if (col >= MENU.cols) return -1;
    if (localX - col * pitch > MENU.cardW) return -1;

    const localY = point.y - MENU.gridY + menuState.scroll;
    const row = Math.floor(localY / gridRowH());
    if (row < 0) return -1;
    if (localY - row * gridRowH() > MENU.cardH) return -1;

    const index = row * MENU.cols + col;
    return index < menuTabCount() ? index : -1;
}

/* ---------- состояние выбранного элемента ---------- */

function menuItemUnlocked(index) {
    return menuState.tab === 'shop'
        ? ownedFrames.includes(FRAMES[index].id)
        : unlockedAvatars.includes(index);
}

function menuItemWorn(index) {
    return menuState.tab === 'shop'
        ? selectedFrame === FRAMES[index].id
        : selectedAvatar === index;
}

const FRAME_RARITY = frame => frame.price === 0 ? 'БАЗОВАЯ'
    : frame.price < 100 ? 'ОБЫЧНАЯ'
    : frame.price < 200 ? 'РЕДКАЯ'
    : frame.price < 340 ? 'ЭПИЧЕСКАЯ'
    : frame.price < 560 ? 'ЛЕГЕНДАРНАЯ'
    : 'БОЖЕСТВЕННАЯ';

const EXTRAS_LABELS = {
    aura: 'свечение', wings: 'крылья', orbit: 'искры', aurora: 'сияние',
    lightning: 'молнии', twinkle: 'звёзды', shock: 'волны',
    halo: 'ореол', crown: 'корона'
};

// Кнопка действия нужна только вкладке аватаров: у рамок свой экран.
function menuPrimary() {
    const i = menuCursor();

    if (!unlockedAvatars.includes(i)) return { label: 'ЗАКРЫТО', color: '#8a97a8', enabled: false };
    if (selectedAvatar === i) return { label: 'ВЫБРАНА', color: '#0f8a76', enabled: false };

    return { label: 'ВЫБРАТЬ', color: '#287db4', enabled: true };
}

function runPrimary() {
    const i = menuCursor();

    if (!unlockedAvatars.includes(i)) {
        const need = AVATAR_SCORES[i];
        setMenuMessage(
            'Аватар закрыт',
            'Нужен рекорд ' + fmt(need) + ' · не хватает ' + fmt(Math.max(0, need - highScore))
        );
        sfx.click();
        return;
    }

    if (selectedAvatar === i) { sfx.click(); return; }

    selectedAvatar = i;
    saveProgress();
    setMenuMessage('Аватар выбран', 'Моряка · ' + (i + 1));
    sfx.click();
}

/* ---------- типографика меню ---------- */

function drawMenuButton(x, y, w, h, label, color = '#20a9b8', options = {}) {
    const { size = 14, tracking = 1.2, sub = '', icon = null, dim = false } = options;

    ctx.save();
    if (dim) ctx.globalAlpha = 0.62;

    ctx.shadowColor = 'rgba(10,55,85,.30)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 5;
    roundedRect(x, y, w, h, 16);
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, shadeHex(color, 0.10));
    g.addColorStop(1, shadeHex(color, -0.16));
    ctx.fillStyle = g;
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    roundedRect(x + 5, y + 3.5, w - 10, h * 0.44, 12);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.fill();

    roundedRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 16);
    ctx.strokeStyle = 'rgba(255,255,255,.88)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';

    const mainY = sub ? y + h / 2 - 6.5 : y + h / 2;
    setFont(size, 'bold');
    const labelW = trackedWidth(label, tracking);
    const shift = icon === 'play' ? 10 : 0;

    trackedText(label, x + w / 2 + shift, mainY, tracking);

    if (icon === 'play') {
        const tx = x + w / 2 + shift - labelW / 2 - 12;
        ctx.beginPath();
        ctx.moveTo(tx, mainY - 6.5);
        ctx.lineTo(tx + 10, mainY);
        ctx.lineTo(tx, mainY + 6.5);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.fill();
    }

    if (sub) {
        setFont(7.5, 'bold');
        ctx.fillStyle = 'rgba(255,255,255,.75)';
        trackedText(sub, x + w / 2, y + h / 2 + 9, 1.5);
    }

    ctx.restore();
}

/* ---------- шапка ---------- */

function drawMenuHeader() {
    ctx.save();
    ctx.textBaseline = 'middle';

    // Логотип в одну строку — место сверху дорогое, витрине оно нужнее.
    setFont(15, 'bold');
    ctx.fillStyle = '#0f3d5c';
    ctx.shadowColor = 'rgba(255,255,255,.9)';
    ctx.shadowBlur = 12;
    trackedText('МОРЯКА', MENU.padX, MENU.titleY, 2.2, 'left');

    const shift = trackedWidth('МОРЯКА', 2.2) + 7;
    ctx.shadowBlur = 0;

    const g = ctx.createLinearGradient(0, MENU.titleY - 9, 0, MENU.titleY + 9);
    g.addColorStop(0, '#1187c8');
    g.addColorStop(1, '#0a4e80');
    ctx.fillStyle = g;
    trackedText('JUMP', MENU.padX + shift, MENU.titleY, 2.2, 'left');

    // Кошелёк справа: в магазине рамок он нужен постоянно.
    const label = fmt(bankCoins);
    setFont(11, 'bold');
    const tw = trackedWidth(label, 0.4);
    const chipW = 30 + tw + 12;
    const chipX = 400 - MENU.padX - chipW;

    drawHudChip(chipX, MENU.titleY - 11, chipW, 22, null);
    drawCoinBadge(chipX + 13, MENU.titleY, 7, 0);

    ctx.fillStyle = '#c28000';
    trackedText(label, chipX + chipW - 10, MENU.titleY + 0.5, 0.4, 'right');

    ctx.restore();
}

/* ---------- табы с бегущей подложкой ---------- */

const MENU_TABS = [
    { id: 'avatars', label: 'АВАТАРЫ' },
    { id: 'shop', label: 'РАМКИ' }
];

function drawMenuTabs() {
    const x = MENU.padX;
    const y = MENU.tabsY;
    const w = 400 - MENU.padX * 2;
    const h = MENU.tabsH;
    const segW = (w - 8) / 2;

    ctx.save();

    roundedRect(x, y, w, h, h / 2);
    ctx.fillStyle = 'rgba(255,255,255,.42)';
    ctx.fill();

    // Подложка едет между сегментами, а не переключается рывком.
    const ix = x + 4 + menuState.tabAnim * segW;

    ctx.save();
    ctx.shadowColor = 'rgba(20,119,168,.35)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 3;
    roundedRect(ix, y + 4, segW, h - 8, (h - 8) / 2);
    const fill = ctx.createLinearGradient(ix, y, ix, y + h);
    fill.addColorStop(0, '#2bb6d8');
    fill.addColorStop(1, '#1477a8');
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();

    for (let k = 0; k < MENU_TABS.length; k++) {
        const tab = MENU_TABS[k];
        const cx = x + 4 + segW * (k + 0.5);
        const active = menuState.tab === tab.id;

        setFont(9.5, 'bold');
        ctx.fillStyle = active ? '#ffffff' : 'rgba(21,85,118,.6)';
        trackedText(tab.label, cx, y + h / 2 + 0.5, 1.8);
    }

    ctx.restore();
}

/* ---------- витрина выбранного ---------- */

// Вертикальная раскладка витрины: считаем высоту содержимого и
// центрируем его в панели. Раньше элементы были прибиты к верхнему
// краю, из-за чего весь блок читался как «съехавший вверх».
function showcaseLayout() {
    const y = MENU.showcaseY;
    const h = MENU.showcaseH;
    const i = menuCursor();

    const locked = !menuItemUnlocked(i);
    const hasMeter = menuState.tab !== 'shop' && locked;

    const r = 31;
    const avatarD = r * 2 + 8;      // круг + ореол
    const titleH = 15;
    const subH = 11;
    const meterH = hasMeter ? 26 : 0;

    const gapTitle = 9;
    const gapSub = 7;

    const contentH = avatarD + gapTitle + titleH + gapSub + subH + meterH;
    const top = y + Math.max(7, (h - contentH) / 2);

    const cy = top + avatarD / 2;
    const titleY = top + avatarD + gapTitle + titleH / 2;
    const subY = titleY + titleH / 2 + gapSub + subH / 2;
    const meterY = subY + subH / 2 + 7;
    const meterTextY = meterY + 15;

    return { y, h, r, cy, titleY, subY, meterY, meterTextY, locked, hasMeter };
}

function drawShowcase() {
    const i = menuCursor();
    const isShop = menuState.tab === 'shop';

    const x = MENU.padX;
    const y = MENU.showcaseY;
    const w = 400 - MENU.padX * 2;
    const h = MENU.showcaseH;

    const frameId = isShop ? FRAMES[i].id : selectedFrame;
    const look = (FRAMES.find(f => f.id === frameId) || {}).look || null;
    const glow = a => look ? hexToRgba(look.glow, a) : 'rgba(30,110,150,' + a + ')';

    const L = showcaseLayout();

    ctx.save();
    ctx.shadowColor = 'rgba(18,70,110,.16)';
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 8;
    roundedRect(x, y, w, h, 22);
    ctx.fillStyle = 'rgba(255,255,255,.62)';
    ctx.fill();
    ctx.restore();

    // Ореол от рамки: панель подсвечивается цветом выбранного.
    ctx.save();
    roundedRect(x, y, w, h, 22);
    ctx.clip();

    const halo = ctx.createRadialGradient(200, L.cy, 8, 200, L.cy, 118);
    halo.addColorStop(0, glow(0.30));
    halo.addColorStop(0.55, glow(0.10));
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(x, y, w, h);
    ctx.restore();

    ctx.save();
    roundedRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 22);
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();

    const cx = 200;
    const cy = L.cy;
    const r = L.r;
    const locked = L.locked;
    const fade = menuState.fadeT;

    // Аватар проявляется при смене выбора, а не прыгает.
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(0, (1 - fade) * 9);

    ctx.save();
    ctx.shadowColor = glow(0.55);
    ctx.shadowBlur = 26;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawAvatarCircle(cx, cy, r, isShop ? selectedAvatar : i);
    drawFrame(cx, cy, r, frameId);

    if (locked) {
        ctx.save();
        ctx.fillStyle = 'rgba(10,40,60,.5)';
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        drawLockIcon(cx, cy, r * 0.46, 'rgba(255,255,255,.95)');
        ctx.restore();
    }

    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    setFont(7, 'bold');
    ctx.fillStyle = 'rgba(21,85,118,.42)';
    trackedText((i + 1) + ' / ' + menuTabCount(), x + w - 16, y + 14, 1.2, 'right');

    setFont(14, 'bold');
    ctx.fillStyle = '#0f3d5c';
    const title = isShop ? FRAMES[i].name.toUpperCase() : 'МОРЯКА · ' + (i + 1);
    trackedText(title, cx, L.titleY, 0.9);

    setFont(8, 'bold');

    if (isShop) {
        const frame = FRAMES[i];
        const rarity = FRAME_RARITY(frame);

        if (locked) {
            ctx.fillStyle = '#c28000';
            trackedText(rarity + ' · ' + fmt(frame.price) + ' МОНЕТ', cx, L.subY, 1.0);
        } else {
            ctx.fillStyle = '#0f8a76';
            trackedText(rarity + ' · КУПЛЕНА', cx, L.subY, 1.0);
        }

        const extras = (frame.look && frame.look.extras) || [];
        const names = extras.map(e => EXTRAS_LABELS[e]).filter(Boolean).slice(0, 4).join(' · ');

        if (names) {
            setFont(7, 'bold');
            ctx.fillStyle = 'rgba(21,85,118,.48)';
            trackedText(names, cx, L.subY + 13, 0.7);
        }
    } else if (locked) {
        const need = AVATAR_SCORES[i];
        const p = need > 0 ? Math.min(1, highScore / need) : 1;

        ctx.fillStyle = '#a86b00';
        trackedText('НУЖЕН РЕКОРД ' + fmt(need), cx, L.subY, 1.0);

        const barW = 190;
        const barX = cx - barW / 2;
        const barY = L.meterY;

        ctx.fillStyle = 'rgba(21,85,118,.12)';
        roundedRect(barX, barY, barW, 6, 3);
        ctx.fill();

        if (p > 0.001) {
            const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            grad.addColorStop(0, '#7fbfe0');
            grad.addColorStop(1, '#12a08c');
            ctx.fillStyle = grad;
            roundedRect(barX, barY, barW * p, 6, 3);
            ctx.fill();
        }

        setFont(7, 'bold');
        ctx.fillStyle = 'rgba(21,85,118,.55)';
        trackedText('ЕЩЁ ' + fmt(Math.max(0, need - highScore)) + ' ДО ОТКРЫТИЯ', cx, L.meterTextY, 0.85);
    } else {
        const worn = menuItemWorn(i);
        ctx.fillStyle = worn ? '#0f8a76' : 'rgba(21,85,118,.55)';
        trackedText(worn ? 'ВЫБРАН' : 'ОТКРЫТ', cx, L.subY, 1.2);
    }

    ctx.restore();
}

/* ---------- сетка-выборщик ---------- */

function drawMenuCard(index, x, y) {
    const isShop = menuState.tab === 'shop';
    const w = MENU.cardW;
    const h = MENU.cardH;
    const unlocked = menuItemUnlocked(index);
    const worn = menuItemWorn(index);
    const active = menuCursor() === index;

    const pressed = menuState.pressIndex === index ? menuState.pressT : 0;
    const scale = 1 - pressed * 0.08;

    const cx = x + w / 2;
    const cy = y + 26;
    const r = 20;

    ctx.save();

    const ccx = x + w / 2;
    const ccy = y + h / 2;
    ctx.translate(ccx, ccy);
    ctx.scale(scale, scale);
    ctx.translate(-ccx, -ccy);

    roundedRect(x, y, w, h, 12);
    ctx.fillStyle = active
        ? 'rgba(219,250,244,.96)'
        : worn ? 'rgba(255,255,255,.86)'
        : unlocked ? 'rgba(255,255,255,.70)'
        : 'rgba(255,255,255,.42)';
    ctx.fill();

    if (active) {
        roundedRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 12);
        ctx.strokeStyle = '#12a08c';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.save();
    if (!unlocked) ctx.globalAlpha = 0.62;
    drawAvatarCircle(cx, cy, r, isShop ? selectedAvatar : index);
    drawFrame(cx, cy, r, isShop ? FRAMES[index].id : selectedFrame, true);
    ctx.restore();

    if (!unlocked) {
        ctx.save();
        ctx.fillStyle = 'rgba(10,40,60,.5)';
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        drawLockIcon(cx, cy, r * 0.48, 'rgba(255,255,255,.95)');
        ctx.restore();
    }

    // Точка «надето» — не нужно читать подпись, чтобы понять статус.
    if (worn) {
        ctx.save();
        ctx.fillStyle = '#12a08c';
        ctx.beginPath();
        ctx.arc(x + w - 9, y + 9, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x + w - 11, y + 9);
        ctx.lineTo(x + w - 9.5, y + 10.7);
        ctx.lineTo(x + w - 6.8, y + 7.4);
        ctx.stroke();
        ctx.restore();
    }

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(6.5, 'bold');

    let label;
    let color = 'rgba(21,85,118,.66)';

    if (isShop) {
        if (active) { label = 'ВЫБРАНА'; color = '#0f8a76'; }
        else if (worn) { label = 'НАДЕТА'; color = '#0f8a76'; }
        else if (unlocked) { label = 'ЕСТЬ'; }
        else { label = '—'; color = 'rgba(21,85,118,.34)'; }
    } else {
        label = '№ ' + (index + 1);
        if (active) color = '#0f8a76';
    }

    ctx.fillStyle = color;
    trackedText(label, cx, y + h - 13, 0.5);

    ctx.restore();
    ctx.restore();
}

function drawMenuGrid() {
    const count = menuTabCount();
    const left = gridLeft();
    const viewTop = MENU.gridY;
    const viewBottom = MENU.gridY + MENU.gridH;
    const rowH = gridRowH();

    ctx.save();
    ctx.beginPath();
    ctx.rect(MENU.padX - 6, viewTop, 400 - (MENU.padX - 6) * 2, MENU.gridH);
    ctx.clip();

    for (let i = 0; i < count; i++) {
        const col = i % MENU.cols;
        const row = Math.floor(i / MENU.cols);
        const x = left + col * (MENU.cardW + MENU.gapX);
        const y = viewTop + row * rowH - menuState.scroll;

        if (y + MENU.cardH < viewTop - 20 || y > viewBottom + 20) continue;

        drawMenuCard(i, x, y);
    }

    ctx.restore();

    if (menuMaxScroll() > 0) {
        const ratio = MENU.gridH / gridHeight();
        const thumbH = Math.max(26, MENU.gridH * ratio);
        const t = menuState.scroll / menuMaxScroll();
        const ty = viewTop + t * (MENU.gridH - thumbH);

        ctx.save();
        ctx.fillStyle = 'rgba(15,61,92,.12)';
        roundedRect(389, viewTop, 3, MENU.gridH, 1.5);
        ctx.fill();
        ctx.fillStyle = 'rgba(15,61,92,.42)';
        roundedRect(389, ty, 3, thumbH, 1.5);
        ctx.fill();
        ctx.restore();
    }

    // Растушёвка снизу: намёк, что список продолжается.
    if (menuState.scroll < menuMaxScroll() - 1) {
        const fade = ctx.createLinearGradient(0, viewBottom - 26, 0, viewBottom);
        fade.addColorStop(0, 'rgba(247,252,255,0)');
        fade.addColorStop(1, 'rgba(247,252,255,.92)');
        ctx.fillStyle = fade;
        ctx.fillRect(MENU.padX - 6, viewBottom - 26, 400 - (MENU.padX - 6) * 2, 26);
    }
}

/* ---------- нижняя панель действия ---------- */

function drawMenuActions() {
    const primary = menuPrimary();

    drawMenuButton(MENU.padX, MENU.barY, 228, MENU.barH, primary.label, primary.color, {
        size: 13,
        dim: !primary.enabled
    });

    drawMenuButton(260, MENU.barY, 120, MENU.barH, 'ИГРАТЬ', '#12a08c', {
        size: 11,
        tracking: 1.0
    });

    ctx.save();
    ctx.textBaseline = 'middle';
    setFont(7, 'bold');
    ctx.fillStyle = 'rgba(21,85,118,.45)';

    trackedText('РЕКОРД ' + fmt(highScore), MENU.padX, 566, 1.2, 'left');
    trackedText(
        isCoarsePointer() ? 'ПРОВЕДИ ПО СЕТКЕ — ПРОКРУТКА' : '← → ВЫБОР · ENTER ДЕЙСТВИЕ',
        400 - MENU.padX, 566, 1.2, 'right'
    );

    ctx.restore();
}

/* ---------- плашка-уведомление ---------- */

let menuMessage = '';
let menuMessageSub = '';
let menuMessageUntil = 0;

function setMenuMessage(text, sub = '') {
    menuMessage = text;
    menuMessageSub = sub;
    menuMessageUntil = performance.now() + (sub ? 2800 : 2100);
}

function drawMenuToast() {
    if (performance.now() >= menuMessageUntil || !menuMessage) return;

    const hasSub = Boolean(menuMessageSub);
    const h = hasSub ? 34 : 26;
    const top = MENU.barY - 10 - h;

    ctx.save();
    ctx.globalAlpha = Math.min(1, (menuMessageUntil - performance.now()) / 280);

    ctx.shadowColor = 'rgba(8,28,48,.4)';
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 5;
    roundedRect(45, top, 310, h, hasSub ? 13 : h / 2);
    ctx.fillStyle = 'rgba(18,42,68,.94)';
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    setFont(10.5, 'bold');
    trackedText(menuMessage, 200, hasSub ? top + 13 : top + h / 2 + 0.5, 0.7);

    if (hasSub) {
        ctx.fillStyle = 'rgba(190,216,236,.82)';
        setFont(8, 'normal');
        trackedText(menuMessageSub, 200, top + 25, 0.5);
    }

    ctx.restore();
}

/* ---------- обновление и сборка ---------- */

function updateMenu(dt) {
    const tabTarget = menuState.tab === 'shop' ? 1 : 0;
    menuState.tabAnim += (tabTarget - menuState.tabAnim) * Math.min(1, 0.24 * dt);
    if (Math.abs(tabTarget - menuState.tabAnim) < 0.002) menuState.tabAnim = tabTarget;

    if (menuState.fadeT < 1) {
        menuState.fadeT = Math.min(1, menuState.fadeT + 0.14 * dt);
    }

    if (menuState.pressT > 0) {
        menuState.pressT = Math.max(0, menuState.pressT - 0.09 * dt);
        if (menuState.pressT === 0) menuState.pressIndex = -1;
    }

    // Прокрутка управляется только пальцем или клавишами —
    // сама по себе сетка не двигается.
}

function drawMenu() {
    drawBackground();

    const glow = ctx.createRadialGradient(200, 60, 10, 200, 60, 240);
    glow.addColorStop(0, 'rgba(255,255,255,.5)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 400, 300);

    drawMenuHeader();
    drawMenuTabs();

    // Вкладка рамок — полноценный экран гачи, без сетки и нижней панели.
    if (menuState.tab === 'shop') {
        drawGachaShop();
    } else {
        drawShowcase();
        drawMenuGrid();
        drawMenuActions();
    }

    drawMenuToast();
}

/* ============================================================
   ОБЪЕКТЫ МИРА
   ============================================================ */

function drawGroundShadow(cx, y, rx, ry, alpha = 0.18) {
    const g = ctx.createRadialGradient(cx, y, 0, cx, y, rx);
    g.addColorStop(0, `rgba(46,92,124,${alpha})`);
    g.addColorStop(1, 'rgba(46,92,124,0)');
    ctx.save();
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function snowCap(x, y, w, height, fillTop = '#ffffff', fillBottom = '#dceffa') {
    const g = ctx.createLinearGradient(0, y - height, 0, y + height);
    g.addColorStop(0, fillTop);
    g.addColorStop(1, fillBottom);

    ctx.beginPath();
    ctx.moveTo(x + 1.5, y + height * 0.35);
    ctx.quadraticCurveTo(x + w * 0.16, y - height * 0.85, x + w * 0.36, y - height * 0.32);
    ctx.quadraticCurveTo(x + w * 0.54, y - height * 1.12, x + w * 0.74, y - height * 0.30);
    ctx.quadraticCurveTo(x + w * 0.90, y - height * 0.80, x + w - 1.5, y + height * 0.28);
    ctx.lineTo(x + w - 1.5, y + height * 0.92);
    ctx.lineTo(x + 1.5, y + height * 0.92);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
}

function drawSnowPlatform(p) {
    const { x, y, w, h } = p;
