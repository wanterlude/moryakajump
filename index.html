function canvasPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (event.clientX - rect.left) * 400 / rect.width,
        y: (event.clientY - rect.top) * 600 / rect.height
    };
}

/* ---------- клавиатура ---------- */

window.addEventListener('keydown', event => {
    keys[event.code] = true;

    if (perkState.offering) {
        const byCode = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
        if (event.code in byCode) {
            event.preventDefault();
            choosePerk(byCode[event.code]);
            return;
        }
    }

    if ((event.code === 'ArrowUp' || event.code === 'KeyW' || event.code === 'Space') &&
        currentState === STATE.PLAYING && doubleJumpAvailable) {
        event.preventDefault();
        player.dy = -15;
        doubleJumpAvailable = false;
        sfx.jump();
        return;
    }

    if (currentState === STATE.MENU) {
        const dirByCode = {
            ArrowLeft: -1, ArrowRight: 1,
            ArrowUp: -MENU.cols, ArrowDown: MENU.cols
        };

        if (event.code === 'Enter' || event.code === 'Space') {
            event.preventDefault();

            // У вкладки рамок нет сетки: Enter/Space крутит гачу.
            if (menuState.tab === 'shop') {
                if (gachaState.phase === 'reveal') gachaState.phase = 'idle';
                startGacha();
            } else if (event.code === 'Enter') runPrimary();
            else startGame();

            return;
        }

        if (event.code === 'Tab') {
            event.preventDefault();
            switchMenuTab(menuState.tab === 'avatars' ? 'shop' : 'avatars');
            revealCursor(menuCursor());
            return;
        }

        if (event.code === 'Escape') {
            event.preventDefault();
            startGame();
            return;
        }

        // На экране гачи навигации по сетке нет — стрелки только переключают вкладку.
        if (menuState.tab === 'shop' && dirByCode[event.code] !== undefined) {
            event.preventDefault();
            if (dirByCode[event.code] === -MENU.cols) {
                switchMenuTab('avatars');
                revealCursor(menuCursor());
            }
            return;
        }

        if (dirByCode[event.code] !== undefined) {
            event.preventDefault();
            const step = dirByCode[event.code];

            // Вверх/вниз у границы переключают вкладку — так не теряется ритм.
            if (step === -MENU.cols && menuCursor() < MENU.cols &&
                menuState.tab === 'shop') {
                switchMenuTab('avatars');
                revealCursor(menuCursor());
                return;
            }

            if (step === MENU.cols &&
                menuCursor() >= menuTabCount() - MENU.cols &&
                menuState.tab === 'avatars') {
                switchMenuTab('shop');
                revealCursor(menuCursor());
                return;
            }

            setMenuCursor(menuCursor() + step);
            sfx.click();
            return;
        }

        return;
    }

    if (currentState === STATE.GAMEOVER) {
        if (!event.repeat && performance.now() - gameOverState.openedAt > GAMEOVER_INPUT_DELAY) {
            event.preventDefault();
            if (event.code === 'KeyM') {
                pauseState.hover = null;
                currentState = STATE.MENU;
                lastFrameTime = 0;
            } else {
                startGame();
            }
        }
        return;
    }

    if (currentState === STATE.PLAYING && event.code === 'Escape') {
        pauseGame();
        return;
    }

    if (currentState === STATE.PAUSE) {
        if (event.code === 'Escape') resumeGame();
        else if (event.code === 'KeyR' || event.code === 'Enter') {
            commitRunScore();
            startGame();
        } else if (event.code === 'KeyM') {
            commitRunScore();
            pauseState.hover = null;
            currentState = STATE.MENU;
            lastFrameTime = 0;
        }
    }
});

window.addEventListener('keyup', event => { keys[event.code] = false; });

window.addEventListener('blur', () => {
    keys.ArrowLeft = false;
    keys.ArrowRight = false;
    keys.KeyA = false;
    keys.KeyD = false;
    clearTouchInput();
});

/* ---------- указатель на canvas ---------- */

canvas.addEventListener('pointerdown', event => {
    const point = canvasPoint(event);

    // Выбор перка перехватывает ввод целиком: пока он открыт, игра стоит.
    if (perkState.offering) {
        const index = perkCardAt(point);
        if (index >= 0) choosePerk(index);
        event.preventDefault();
        return;
    }

    if (currentState === STATE.PAUSE) {
        const sens = sensHitTest(point);
        if (sens) {
            stepSensitivity(sens.row.id, sens.action);
            event.preventDefault();
            return;
        }

        const button = pauseButtonAt(point);

        if (button) {
            if (button.id === 'resume' || button.id === 'close') resumeGame();
            else if (button.id === 'restart') { commitRunScore(); startGame(); }
            else if (button.id === 'menu') {
                commitRunScore();
                pauseState.hover = null;
                currentState = STATE.MENU;
                lastFrameTime = 0;
            }
        }

        event.preventDefault();
        return;
    }

    if (currentState === STATE.GAMEOVER) {
        const button = gameOverButtonAt(point);
        const ready = performance.now() - gameOverState.openedAt > GAMEOVER_INPUT_DELAY;

        if (ready) {
            if (button && button.id === 'menu') {
                pauseState.hover = null;
                currentState = STATE.MENU;
                lastFrameTime = 0;
            } else if (button && button.id === 'share') {
                shareResult();
            } else {
                startGame();
            }
        }

        event.preventDefault();
        return;
    }

    if (currentState === STATE.MENU) {
        // Экран гачи забирает ввод целиком (кроме табов).
        if (menuState.tab === 'shop') {
            const onTabs = point.y >= MENU.tabsY && point.y <= MENU.tabsY + MENU.tabsH &&
                point.x >= MENU.padX && point.x <= 400 - MENU.padX;

            if (!onTabs) {
                const action = gachaShopHitTest(point);

                if (action === 'spin') {
                    if (gachaState.phase === 'reveal') gachaState.phase = 'idle';
                    startGacha();
                } else if (action === 'equip' && gachaState.result) {
                    selectedFrame = gachaState.result.id;
                    saveProgress();
                    setMenuMessage('Рамка надета', '«' + gachaState.result.name + '»');
                    sfx.click();
                }

                event.preventDefault();
                return;
            }
        }

        // Табы.
        if (point.y >= MENU.tabsY && point.y <= MENU.tabsY + MENU.tabsH &&
            point.x >= MENU.padX && point.x <= 400 - MENU.padX) {
            switchMenuTab(point.x < 200 ? 'avatars' : 'shop');
            revealCursor(menuCursor());
            event.preventDefault();
            return;
        }

        // Кнопки нижней панели.
        if (point.y >= MENU.barY && point.y <= MENU.barY + MENU.barH) {
            if (point.x >= 260 && point.x <= 380) {
                startGame();
            } else if (point.x >= MENU.padX && point.x <= MENU.padX + 228) {
                if (menuPrimary().enabled) runPrimary();
                else {
                    const i = menuCursor();
                    if (menuState.tab === 'avatars' && !menuItemUnlocked(i)) runPrimary();
                    else sfx.click();
                }
            }

            event.preventDefault();
            return;
        }

        // Сетка: тап выбирает карточку, движение — скролл.
        if (point.y >= MENU.gridY - 8 && point.y <= MENU.gridY + MENU.gridH + 8) {
            menuState.dragging = true;
            menuState.dragStartY = point.y;
            menuState.dragScrollStart = menuState.scroll;
            menuState.dragMoved = 0;
            menuState.pointerId = event.pointerId;

            try { canvas.setPointerCapture(event.pointerId); } catch { /* ignore */ }

            event.preventDefault();
            return;
        }

        event.preventDefault();
        return;
    }

    if (currentState === STATE.PLAYING) {
        if (inZone(point, PAUSE_ZONE)) {
            pauseGame();
            event.preventDefault();
            return;
        }

        if (isCoarsePointer() && inZone(point, TILT_ZONE)) {
            if (!tiltEnabled) enableTilt();
            event.preventDefault();
            return;
        }

        // Мышь: двойной прыжок кликом.
        if (event.pointerType === 'mouse' && event.button === 0 && doubleJumpAvailable) {
            event.preventDefault();
            player.dy = -15;
            doubleJumpAvailable = false;
            sfx.jump();
        }
    }
});

// Колесо мыши: сетка меню должна крутиться и им, не только пальцем.
// passive:false — иначе браузер прокрутит страницу вместо сетки.
canvas.addEventListener('wheel', event => {
    // Экран гачи не скроллится: колесо ему не нужно.
    if (menuState.tab === 'shop' && currentState === STATE.MENU && gachaState.phase === 'idle') {
        event.preventDefault();
        return;
    }

    if (currentState !== STATE.MENU) return;

    const point = canvasPoint(event);

    if (point.y < MENU.gridY - 12 || point.y > MENU.gridY + MENU.gridH + 12) return;

    if (menuMaxScroll() <= 0) return;

    // deltaMode: 0 — пиксели, 1 — строки, 2 — страницы.
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? 400 : 1;
    const delta = event.deltaY * unit;

    menuState.scroll += delta;
    clampScroll();

    event.preventDefault();
}, { passive: false });

canvas.addEventListener('pointermove', event => {
    const point = canvasPoint(event);

    // Скролл сетки.
    if (currentState === STATE.MENU && menuState.dragging &&
        menuState.pointerId === event.pointerId) {
        const dy = point.y - menuState.dragStartY;
        menuState.dragMoved = Math.max(menuState.dragMoved, Math.abs(dy));

        // dy уже в игровых единицах: canvasPoint перевёл пиксели экрана.
        // Сетка идёт ровно за пальцем, без догоняющей инерции.
        menuState.scroll = menuState.dragScrollStart - dy;

        clampScroll();
        event.preventDefault();
        return;
    }

    // Управление мышью в игре.
    if (event.pointerType === 'mouse' && currentState === STATE.PLAYING) {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return;

        mouseControl.targetX = Math.max(0, Math.min(400,
            (event.clientX - rect.left) * 400 / rect.width));
        mouseControl.inside =
            event.clientX >= rect.left && event.clientX <= rect.right;
        return;
    }

    // Подсветка кнопок паузы и gameover.
    if (event.pointerType !== 'mouse') return;

    // Экран гачи: курсор-рука над кнопкой крутки и подиумом.
    if (currentState === STATE.MENU && menuState.tab === 'shop') {
        const action = gachaShopHitTest(point);
        const next = action ? 'gacha-' + action : null;

        if (next !== pauseState.hover) {
            pauseState.hover = next;
            canvas.style.cursor = next ? 'pointer' : 'default';
        }
        return;
    }

    if (perkState.offering) {
        const index = perkCardAt(point);
        const next = index >= 0 ? 'perk' + index : null;
        if (next !== pauseState.hover) {
            pauseState.hover = next;
            canvas.style.cursor = next ? 'pointer' : 'default';
        }
        return;
    }

    if (currentState !== STATE.PAUSE && currentState !== STATE.GAMEOVER) return;

    if (currentState === STATE.GAMEOVER) {
        const button = gameOverButtonAt(point);
        const next = button ? button.id : null;

        if (next !== pauseState.hover) {
            pauseState.hover = next;
            canvas.style.cursor = button ? 'pointer' : 'default';
        }
        return;
    }

    let next = null;

    for (const row of SENS_ROWS) {
        if (point.x >= row.x && point.x <= row.x + row.w &&
            point.y >= row.y && point.y <= row.y + row.h) {
            next = row.id;
            break;
        }
    }

    if (!next) {
        const button = pauseButtonAt(point);
        next = button ? button.id : null;
    }

    if (next !== pauseState.hover) {
        pauseState.hover = next;
        canvas.style.cursor = next ? 'pointer' : 'default';
    }
});

function finishMenuPointer(event) {
    if (currentState !== STATE.MENU) return;
    if (!menuState.dragging) return;
    if (menuState.pointerId !== event.pointerId) return;

    const point = canvasPoint(event);
    const moved = menuState.dragMoved;

    menuState.dragging = false;
    menuState.pointerId = null;

    if (moved < 8) {
        const i = cardAtPoint(point);

        if (i !== -1) {
            if (i === menuCursor()) {
                // Повторный тап по выбранной карточке — сразу действие.
                if (menuPrimary().enabled) runPrimary();
                else sfx.click();
            } else {
                setMenuCursor(i);
                sfx.click();
            }

            menuState.pressIndex = i;
            menuState.pressT = 1;
        }
    }
}

canvas.addEventListener('pointerup', event => {
    finishMenuPointer(event);
    menuState.dragging = false;
    menuState.pointerId = null;
});

canvas.addEventListener('pointercancel', event => {
    if (menuState.pointerId === event.pointerId) {
        menuState.dragging = false;
        menuState.pointerId = null;
    }
});

canvas.addEventListener('pointerleave', event => {
    if (event.pointerType === 'mouse') {
        mouseControl.inside = false;
        if (pauseState.hover) {
            pauseState.hover = null;
            canvas.style.cursor = 'pointer';
        }
    }
});

/* ---------- тач-кнопки ---------- */

function bindTouchButton(id, direction) {
    const button = document.getElementById(id);

    button.addEventListener('pointerdown', event => {
        event.preventDefault();
        activePointers[direction].add(event.pointerId);
        touchInput[direction] = true;

        try { button.setPointerCapture(event.pointerId); } catch { /* ignore */ }
    });

    function release(event) {
        activePointers[direction].delete(event.pointerId);
        touchInput[direction] = activePointers[direction].size > 0;
    }

    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', release);
    button.addEventListener('contextmenu', event => event.preventDefault());
}

bindTouchButton('leftButton', 'left');
bindTouchButton('rightButton', 'right');

const jumpButton = document.getElementById('jumpButton');

function tryDoubleJump(event) {
    event.preventDefault();
    if (currentState === STATE.PLAYING && doubleJumpAvailable) {
        player.dy = -15;
        doubleJumpAvailable = false;
        sfx.jump();
    }
}

jumpButton.addEventListener('pointerdown', tryDoubleJump);
jumpButton.addEventListener('contextmenu', event => event.preventDefault());

function clearTouchInput() {
    activePointers.left.clear();
    activePointers.right.clear();
    touchInput.left = false;
    touchInput.right = false;
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        clearTouchInput();
        if (currentState === STATE.PLAYING) pauseGame();
    }
});

/* ============================================================
   ГАЧА РАМОК: ПРОКРУТКА + РЕДКОСТЬ
   ============================================================ */

// Ставки по редкости. Сумма = 1. Базовую рамку не выдаём — она и так у всех.
const GACHA_RATES = {
    common:    0.50,
    rare:      0.28,
    epic:      0.15,
    legendary: 0.06,
    divine:    0.01
};

const GACHA_COST = 40;

// Редкость определяется ценой рамки — та же шкала, что в магазине.
const GACHA_TIER = frame => frame.price === 0 ? 'base'
    : frame.price < 100 ? 'common'
    : frame.price < 200 ? 'rare'
    : frame.price < 340 ? 'epic'
    : frame.price < 560 ? 'legendary'
    : 'divine';

const GACHA_TIER_COLORS = {
    base: '#8a97a8',
    common: '#5a7f9c',
    rare: '#287db4',
    epic: '#a855f7',
    legendary: '#e8a317',
    divine: '#ff4d6d'
};

const GACHA_TIER_LABELS = {
    base: 'БАЗОВАЯ',
    common: 'ОБЫЧНАЯ',
    rare: 'РЕДКАЯ',
    epic: 'ЭПИЧЕСКАЯ',
    legendary: 'ЛЕГЕНДАРНАЯ',
    divine: 'БОЖЕСТВЕННАЯ'
};

const gachaState = {
    phase: 'idle',       // 'idle' | 'spin' | 'reveal'
    startedAt: 0,
    duration: 2400,      // сколько крутится прокрутка
    result: null,        // выпавшая рамка
    duplicate: false,    // выпала уже имеющаяся
    refund: 0,           // компенсация за дубликат
    scroll: 0            // текущий сдвиг ленты для отрисовки
};

// Взвешенный выбор редкости по ставкам.
function rollGachaTier() {
    const roll = Math.random();
    let acc = 0;

    for (const tier of ['common', 'rare', 'epic', 'legendary', 'divine']) {
        acc += GACHA_RATES[tier];
        if (roll < acc) return tier;
    }
    return 'common';
}

// Рамка нужной редкости из ещё не купленных. Если таких нет —
// отдаём любую этой редкости (выпадет дубликат с компенсацией).
function pickFrameOfTier(tier) {
    const pool = FRAMES.filter(f => GACHA_TIER(f) === tier);
    if (!pool.length) return null;

    const fresh = pool.filter(f => !ownedFrames.includes(f.id));
    const source = fresh.length ? fresh : pool;

    return source[Math.floor(Math.random() * source.length)];
}

function startGacha() {
    if (gachaState.phase === 'spin') return;

    if (bankCoins < GACHA_COST) {
        setMenuMessage('Не хватает монет', 'Нужно ' + GACHA_COST);
        sfx.click();
        return;
    }

    bankCoins -= GACHA_COST;

    // Редкость выпадает сразу, но игрок узнаёт о ней только после прокрутки.
    let tier = rollGachaTier();
    let frame = pickFrameOfTier(tier);

    // Страховка: если для редкой редкости нет рамок, спускаемся ниже.
    const order = ['divine', 'legendary', 'epic', 'rare', 'common'];
    for (const t of order.slice(order.indexOf(tier))) {
        if (frame) break;
        tier = t;
        frame = pickFrameOfTier(t);
    }

    if (!frame) {
        bankCoins += GACHA_COST;
        setMenuMessage('Рамки закончились', 'Все уже собраны');
        return;
    }

    gachaState.phase = 'spin';
    gachaState.startedAt = performance.now();
    gachaState.result = frame;
    gachaState.duplicate = ownedFrames.includes(frame.id);
    gachaState.refund = 0;
    gachaState.scroll = 0;

    saveProgress();
    sfx.click();
}

function finishGacha() {
    const frame = gachaState.result;
    if (!frame) return;

    if (gachaState.duplicate) {
        // Дубликат не обесценивается: возвращаем часть стоимости.
        gachaState.refund = Math.round(GACHA_COST * 0.5);
        bankCoins += gachaState.refund;
    } else {
        ownedFrames.push(frame.id);
        if (!unlockedAvatars.includes(selectedAvatar)) selectedAvatar = 0;
    }

    gachaState.phase = 'reveal';
    gachaState.startedAt = performance.now();

    saveProgress();

    if (gachaState.duplicate) {
        setMenuMessage('Дубликат: «' + frame.name + '»', '+' + gachaState.refund + ' монет назад');
    } else {
        setMenuMessage('Новая рамка: «' + frame.name + '»', GACHA_TIER_LABELS[GACHA_TIER(frame)]);
    }
}



/* ============================================================
   ЭКРАН ГАЧИ (вкладка «рамки»)
   ============================================================ */

const GACHA_UI = {
    panel:      { x: 20, y: 82, w: 360, h: 208 },
    reel:       { x: 34, y: 96, w: 332, h: 150 },
    collectY:   298,
    ratesY:     330,
    spinY:      372,
    spinH:      52,
    hintY:      444,
    cellW:      76
};

const GACHA_TIER_ORDER = ['common', 'rare', 'epic', 'legendary', 'divine'];

function gachaEquippedFrame() {
    return FRAMES.find(f => f.id === selectedFrame) || FRAMES[0];
}

// Сколько рамок уже собрано (базовую не считаем — она у всех есть).
function gachaCollected() {
    return ownedFrames.filter(id => id !== 0).length;
}

function gachaTotal() {
    return FRAMES.length - 1;
}

function gachaTierColor(frame) {
    return GACHA_TIER_COLORS[GACHA_TIER(frame)] || '#5a7f9c';
}

// Лента прокрутки: детерминированный набор вокруг результата.
function gachaReelFrames() {
    const list = [];
    const seed = gachaState.result ? gachaState.result.id : 1;

    for (let i = 0; i < 22; i++) {
        const frame = FRAMES[(seed * 7 + i * 5) % FRAMES.length];
        list.push(frame.id === 0 ? FRAMES[1] : frame);
    }

    // Результат ставим ровно в позицию указателя.
    list[18] = gachaState.result || FRAMES[1];
    return list;
}

function drawGachaPanelGlow(color, alpha) {
    const { x, y, w, h } = GACHA_UI.panel;

    ctx.save();
    ctx.globalAlpha = alpha;

    const glow = ctx.createRadialGradient(200, y + h * 0.42, 10, 200, y + h * 0.42, 190);
    glow.addColorStop(0, color);
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x, y, w, h);

    ctx.restore();
}

function drawGachaRates() {
    const y = GACHA_UI.ratesY;
    const w = 64;
    const gap = 6;
    const total = w * 5 + gap * 4;
    const left = (400 - total) / 2;

    for (let i = 0; i < GACHA_TIER_ORDER.length; i++) {
        const tier = GACHA_TIER_ORDER[i];
        const color = GACHA_TIER_COLORS[tier];
        const x = left + i * (w + gap);

        roundedRect(x, y, w, 30, 9);
        ctx.fillStyle = 'rgba(255,255,255,.52)';
        ctx.fill();

        ctx.save();
        roundedRect(x, y, w, 30, 9);
        ctx.clip();
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.16;
        ctx.fillRect(x, y, w, 30);
        ctx.restore();

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        setFont(6, 'bold');
        ctx.fillStyle = color;
        trackedText(GACHA_TIER_LABELS[tier], x + w / 2, y + 10, 0.8);

        setFont(9.5, 'bold');
        ctx.fillStyle = 'rgba(21,85,118,.82)';
        trackedText(Math.round(GACHA_RATES[tier] * 100) + '%', x + w / 2, y + 21, 0.4);

        ctx.restore();
    }
}

function drawGachaCollection() {
    const y = GACHA_UI.collectY;
    const collected = gachaCollected();
    const total = gachaTotal();
    const ratio = total ? collected / total : 0;

    ctx.save();
    ctx.textBaseline = 'middle';

    setFont(7, 'bold');
    ctx.fillStyle = 'rgba(21,85,118,.55)';
    trackedText('СОБРАНО', 20, y + 5, 1.4, 'left');

    setFont(8.5, 'bold');
    ctx.fillStyle = '#0f3d5c';
    trackedText(collected + ' / ' + total, 380, y + 5, 0.8, 'right');

    ctx.restore();

    // Полоса прогресса коллекции.
    const barY = y + 16;
    roundedRect(20, barY, 360, 7, 3.5);
    ctx.fillStyle = 'rgba(21,85,118,.12)';
    ctx.fill();

    if (ratio > 0) {
        ctx.save();
        roundedRect(20, barY, Math.max(7, 360 * ratio), 7, 3.5);
        ctx.clip();
        const fill = ctx.createLinearGradient(20, 0, 380, 0);
        fill.addColorStop(0, '#3fb8d8');
        fill.addColorStop(0.6, '#a855f7');
        fill.addColorStop(1, '#ff4d6d');
        ctx.fillStyle = fill;
        ctx.fillRect(20, barY, 360, 7);
        ctx.restore();
    }
}

function drawGachaReel() {
    const { x, y, w, h } = GACHA_UI.reel;
    const now = performance.now();
    const elapsed = now - gachaState.startedAt;
    const strip = gachaReelFrames();
    const centerX = 200;

    ctx.save();
    roundedRect(x, y, w, h, 16);
    ctx.clip();

    ctx.fillStyle = 'rgba(10,36,58,.96)';
    ctx.fillRect(x, y, w, h);

    // Мягкая подсветка по краям окна.
    const edge = ctx.createLinearGradient(x, 0, x + w, 0);
    edge.addColorStop(0, 'rgba(10,36,58,.95)');
    edge.addColorStop(0.22, 'rgba(10,36,58,0)');
    edge.addColorStop(0.78, 'rgba(10,36,58,0)');
    edge.addColorStop(1, 'rgba(10,36,58,.95)');
    ctx.fillStyle = edge;
    ctx.fillRect(x, y, w, h);

    let offset;
    if (gachaState.phase === 'spin') {
        const p = Math.min(1, elapsed / gachaState.duration);
        offset = (1 - Math.pow(1 - p, 3.4)) * 18 * GACHA_UI.cellW;
    } else {
        offset = 18 * GACHA_UI.cellW;
    }

    const cy = y + h / 2;

    for (let i = 0; i < strip.length; i++) {
        const frame = strip[i];
        if (!frame) continue;

        const cellX = centerX + (i - 18) * GACHA_UI.cellW - offset;
        if (cellX + GACHA_UI.cellW < x - 20 || cellX > x + w + 20) continue;

        const cx = cellX + GACHA_UI.cellW / 2;
        const color = gachaTierColor(frame);

        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.arc(cx, cy, 34, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.94)';
        ctx.fill();
        ctx.restore();

        drawAvatarCircle(cx, cy, 25, selectedAvatar);
        drawFrame(cx, cy, 25, frame.id, true);

        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        setFont(6, 'bold');
        ctx.fillStyle = color;
        trackedText(GACHA_TIER_LABELS[GACHA_TIER(frame)], cx, cy + 46, 0.8);
        ctx.restore();
    }

    ctx.restore();

    // Рамка окна.
    roundedRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 16);
    ctx.strokeStyle = 'rgba(255,255,255,.30)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Указатель по центру.
    ctx.save();
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath();
    ctx.moveTo(193, y - 9);
    ctx.lineTo(207, y - 9);
    ctx.lineTo(200, y + 1);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(193, y + h + 9);
    ctx.lineTo(207, y + h + 9);
    ctx.lineTo(200, y + h - 1);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

// Подиум в спокойном состоянии: показывает надетую рамку.
function drawGachaEquipped() {
    const { x, y, w, h } = GACHA_UI.panel;

function drawGachaReveal() {
    const { y } = GACHA_UI.panel;
    const frame = gachaState.result;
    if (!frame) return;

    const color = gachaTierColor(frame);
    const tier = GACHA_TIER(frame);
    const now = performance.now();
    const appear = Math.min(1, (now - gachaState.startedAt) / 240);

    drawGachaPanelGlow(color, 0.5 * appear);

    ctx.save();
    ctx.globalAlpha = appear;
    ctx.textAlign = 'center';

}

function drawGachaSpinButton() {
    const y = GACHA_UI.spinY;
    const h = GACHA_UI.spinH;
    const now = performance.now();

    const spinning = gachaState.phase === 'spin';
    const canSpin = !spinning && bankCoins >= GACHA_COST;

    // Пульс доступной крутки — мягко зовёт нажать.
    const pulse = canSpin ? 0.5 + 0.5 * Math.sin(now / 460) : 0;

    ctx.save();

    if (canSpin) {
        ctx.shadowColor = 'rgba(168,85,247,.55)';
        ctx.shadowBlur = 16 + pulse * 10;
        ctx.shadowOffsetY = 6;
    }

    roundedRect(20, y, 360, h, 16);
    const fill = ctx.createLinearGradient(0, y, 0, y + h);

    if (spinning) {
        fill.addColorStop(0, '#8b93a3');
        fill.addColorStop(1, '#6b7383');
    } else if (canSpin) {
        fill.addColorStop(0, '#b06cf5');
        fill.addColorStop(0.5, '#a855f7');
        fill.addColorStop(1, '#7c3aed');
    } else {
        fill.addColorStop(0, '#c8ccd6');
        fill.addColorStop(1, '#aeb4c0');
    }

    ctx.fillStyle = fill;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // Верхний блик.
    roundedRect(26, y + 5, 348, h * 0.40, 12);
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (spinning) {
        setFont(12, 'bold');
        ctx.fillStyle = 'rgba(255,255,255,.92)';
        trackedText('ОТКРЫВАЕМ', 200, y + h / 2, 2.2);
    } else {
        setFont(12, 'bold');
        ctx.fillStyle = canSpin ? '#ffffff' : 'rgba(255,255,255,.86)';
        trackedText('КРУТИТЬ', 152, y + h / 2 - 1, 1.6);

        setFont(11, 'bold');
        ctx.fillStyle = canSpin ? '#ffe9a8' : 'rgba(255,255,255,.72)';
        trackedText(GACHA_COST + '', 268, y + h / 2 - 1, 0.6);

        drawCoinBadge(251, y + h / 2 - 1, 6.6, 0);
    }

    ctx.restore();
}

function drawGachaHint() {
    const now = performance.now();
    let text = 'ДУБЛИКАТ ВОЗВРАЩАЕТ ' + Math.round(GACHA_COST * 0.5) + ' МОНЕТ';

    if (gachaState.phase === 'reveal' && gachaState.result) {
        text = gachaState.duplicate
            ? 'ДУБЛИКАТ · +' + gachaState.refund + ' МОНЕТ'
            : 'НОВАЯ РАМКА · НАДЕТА';

        if (gachaState.duplicate) {
            ctx.save();
            ctx.globalAlpha = 0.55 + 0.45 * Math.sin(now / 300);
            ctx.restore();
        }
    }

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    setFont(7, 'bold');
    ctx.fillStyle = gachaState.phase === 'reveal'
        ? (gachaState.duplicate ? '#c28000' : '#0f8a76')
        : 'rgba(21,85,118,.45)';
    trackedText(text, 200, GACHA_UI.hintY, 1.4);
    ctx.restore();
}

function drawGachaShop() {
    const now = performance.now();

    if (gachaState.phase === 'spin' && now - gachaState.startedAt >= gachaState.duration) {
        finishGacha();
    }

    drawGachaCollection();

    roundedRect(GACHA_UI.panel.x, GACHA_UI.panel.y, GACHA_UI.panel.w, GACHA_UI.panel.h, 18);
    ctx.fillStyle = 'rgba(255,255,255,.58)';
    ctx.fill();

    roundedRect(GACHA_UI.panel.x + 0.75, GACHA_UI.panel.y + 0.75,
        GACHA_UI.panel.w - 1.5, GACHA_UI.panel.h - 1.5, 18);
    ctx.strokeStyle = 'rgba(21,85,118,.10)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    if (gachaState.phase === 'idle') {
        drawGachaEquipped();
    } else {
        drawGachaReel();
        if (gachaState.phase === 'reveal') drawGachaReveal();
    }

    drawGachaRates();
    drawGachaSpinButton();
    drawGachaHint();
}

function gachaShopHitTest(point) {
    const { x, y, w } = { x: 20, y: GACHA_UI.spinY, w: 360 };

    if (point.x >= x && point.x <= x + w &&
        point.y >= y && point.y <= y + GACHA_UI.spinH) {
        return 'spin';
    }

    if (gachaState.phase === 'reveal' && gachaState.result) {
        const panel = GACHA_UI.panel;
        if (point.x >= panel.x && point.x <= panel.x + panel.w &&
            point.y >= panel.y && point.y <= panel.y + panel.h) {
            return 'equip';
        }
    }

    return null;
}

// Рисует самостоятельную картинку 400×600: её можно скачать или отправить.
function buildShareCard() {
    const cv = document.createElement('canvas');
    cv.width = 400 * RENDER_SCALE;
    cv.height = 600 * RENDER_SCALE;

    const c = cv.getContext('2d');
    if (!c) return null;
    c.scale(RENDER_SCALE, RENDER_SCALE);

    const score = Math.floor(player.score);
    const isRecord = gameOverState.newRecord;

    // Фон биома, на котором закончился забег.
    const scene = buildBiomeScene(biomeIndexForScore(score));
    if (scene) c.drawImage(scene, 0, 0, 400, 600);
    else {
        c.fillStyle = WINTER.skyLow;
        c.fillRect(0, 0, 400, 600);
    }

    c.fillStyle = 'rgba(6,20,36,.62)';
    c.fillRect(0, 0, 400, 600);

    // Снежинки-акценты по краям, чтобы карточка не выглядела пустой.
    c.save();
    c.globalAlpha = 0.35;
    c.fillStyle = '#ffffff';
    for (let i = 0; i < 40; i++) {
        const x = ((i * 97) % 400);
        const y = ((i * 151) % 600);
        c.beginPath();
        c.arc(x, y, 0.7 + (i % 3) * 0.4, 0, Math.PI * 2);
        c.fill();
    }
    c.restore();

    c.textAlign = 'center';
    c.textBaseline = 'middle';

    c.font = `bold 15px ${FONT_STACK}`;
    c.fillStyle = 'rgba(255,255,255,.82)';
    c.fillText('МОРЯКА', 200, 96);

    c.font = `bold 9px ${FONT_STACK}`;
    c.fillStyle = 'rgba(255,255,255,.5)';
    c.fillText('ПОКОРИ ВЕРШИНУ', 200, 118);

    // Главный счёт — самое крупное на карточке.
    c.save();
    c.shadowColor = 'rgba(0,0,0,.5)';
    c.shadowBlur = 18;
    c.font = `bold 62px ${FONT_STACK}`;
    c.fillStyle = isRecord ? '#ffd54a' : '#ffffff';
    c.fillText(fmt(score), 200, 216);
    c.restore();

    c.font = `bold 10px ${FONT_STACK}`;
    c.fillStyle = isRecord ? '#ffd54a' : 'rgba(255,255,255,.66)';
    c.fillText(isRecord ? 'НОВЫЙ РЕКОРД' : `РЕКОРД ${fmt(highScore)}`, 200, 268);

    // Три плашки со статистикой забега.
    const stats = [
        ['МОНЕТЫ', fmt(runCoins)],
        ['БИОМ', String(biomeIndexForScore(score) + 1) + '/4'],
        ['ЖИЗНИ', String(lives)]
    ];

    for (let i = 0; i < 3; i++) {
        const x = 40 + i * 108;
        const y = 330;

        c.save();
        c.fillStyle = 'rgba(255,255,255,.10)';
        if (c.roundRect) {
            c.beginPath();
            c.roundRect(x, y, 100, 74, 12);
            c.fill();
        } else {
            c.fillRect(x, y, 100, 74);
        }
        c.restore();

        c.font = `bold 8px ${FONT_STACK}`;
        c.fillStyle = 'rgba(255,255,255,.54)';
        c.fillText(stats[i][0], x + 50, y + 22);

        c.font = `bold 22px ${FONT_STACK}`;
        c.fillStyle = '#ffffff';
        c.fillText(stats[i][1], x + 50, y + 48);
    }

    // Подпись внизу: приглашение играть и место под бренд.
    c.font = `bold 11px ${FONT_STACK}`;
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.fillText('СЛАБО ПОВТОРИТЬ?', 200, 476);

    c.font = `bold 8px ${FONT_STACK}`;
    c.fillStyle = 'rgba(255,255,255,.4)';
    c.fillText('МОРЯКА · ВЕРТИКАЛЬНЫЙ РАННЕР', 200, 508);

    return cv;
}

// Отдаёт картинку наружу: сначала системный share, иначе — скачивание.
async function shareResult() {
    const cv = buildShareCard();
    if (!cv) return;

    const fileName = 'moryaka-' + Math.floor(player.score) + '.png';

    try {
        const blob = await new Promise(resolve => cv.toBlob(resolve, 'image/png'));

        if (blob && navigator.canShare) {
            const file = new File([blob], fileName, { type: 'image/png' });

            if (navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: 'МОРЯКА',
                    text: 'Мой счёт: ' + fmt(Math.floor(player.score))
                });
                return;
            }
        }

        // Fallback: отдаём файл на скачивание.
        const url = cv.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        link.click();

        setMenuMessage('Карточка сохранена', fileName);
    } catch (error) {
        // Пользователь мог просто закрыть диалог — это не ошибка.
        if (error && error.name === 'AbortError') return;
        console.warn('Не удалось поделиться результатом:', error);
    }
}

/* ============================================================
   ПЕРКИ: ВЫБОР КАЖДЫЕ 10 000 ОЧКОВ
   ============================================================ */

const PERK_CARD = { y: 168, w: 112, h: 178, gap: 10 };

function perkCardX(index) {
    const total = PERK_CARD.w * 3 + PERK_CARD.gap * 2;
    const left = (400 - total) / 2;
    return left + index * (PERK_CARD.w + PERK_CARD.gap);
}

function perkCardAt(point) {
    if (!perkState.offering) return -1;
    if (point.y < PERK_CARD.y || point.y > PERK_CARD.y + PERK_CARD.h) return -1;

    for (let i = 0; i < 3; i++) {
        const x = perkCardX(i);
        if (point.x >= x && point.x <= x + PERK_CARD.w) return i;
    }
    return -1;
}

// Предложение перка. Вызывается из update при пересечении порога.
function offerPerk() {
    perkState.offering = true;
    perkState.offerCards = rollPerkOffer();
    perkState.offerReadyAt = performance.now() + 350;
    perkState.pickedAt = 0;
    perkState.pickedIndex = -1;
}

function choosePerk(index) {
    if (!perkState.offering) return;
    if (performance.now() < perkState.offerReadyAt) return;

    const perk = perkState.offerCards[index];
    if (!perk) return;

    applyPerk(perk);
    perkState.pickedIndex = index;
    perkState.pickedAt = performance.now();
    perkState.offering = false;
    lastFrameTime = 0;
}

function drawPerkIcon(kind, cx, cy, color) {
    ctx.save();

    if (kind === 'coin') {
        drawCoinBadge(cx, cy, 11, 0);
    } else if (kind === 'magnet') {
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy + 1, 8, Math.PI, 0, false);
        ctx.stroke();

        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(cx - 8, cy + 1);
        ctx.lineTo(cx - 8, cy + 9);
        ctx.moveTo(cx + 8, cy + 1);
        ctx.lineTo(cx + 8, cy + 9);
        ctx.stroke();

        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(cx - 8, cy + 10, 3, 0, Math.PI * 2);
        ctx.arc(cx + 8, cy + 10, 3, 0, Math.PI * 2);
        ctx.fill();
    } else if (kind === 'jump') {
        // Две стрелки вверх: «джамп» читается без подписи.
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (let k = 0; k < 2; k++) {
            const oy = cy - 6 + k * 10;
            ctx.beginPath();
            ctx.moveTo(cx - 7, oy + 5);
            ctx.lineTo(cx, oy - 2);
            ctx.lineTo(cx + 7, oy + 5);
            ctx.stroke();
        }
    } else {
        // Ветер: три горизонтальные линии разной длины.
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        const widths = [16, 12, 8];
        for (let k = 0; k < 3; k++) {
            ctx.beginPath();
            ctx.moveTo(cx - widths[k] / 2, cy - 7 + k * 7);
            ctx.lineTo(cx + widths[k] / 2, cy - 7 + k * 7);
            ctx.stroke();
        }
    }

    ctx.restore();
}

function drawPerkCard(card, index, alpha) {
    const x = perkCardX(index);
    const y = PERK_CARD.y;
    const w = PERK_CARD.w;
    const h = PERK_CARD.h;
    const now = performance.now();

    const hovered = pauseState.hover === 'perk' + index;
    const chosen = perkState.pickedIndex === index;

    ctx.save();
    ctx.globalAlpha = alpha;

    // Карточка появляется с задержкой по индексу — читается как раздача.
    const stagger = Math.max(0, Math.min(1, (now - perkState.offerReadyAt + 350 - index * 70) / 220));
    ctx.translate(0, (1 - stagger) * 16);

    ctx.shadowColor = 'rgba(10,40,60,.22)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 6;
    roundedRect(x, y, w, h, 14);
    ctx.fillStyle = chosen ? 'rgba(236,255,250,.98)' : 'rgba(255,255,255,.97)';
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha;

    // Цветная полоса сверху — цвет перка как основной маркер.
    ctx.save();
    roundedRect(x, y, w, h, 14);
    ctx.clip();
    const bar = ctx.createLinearGradient(x, y, x, y + 46);
    bar.addColorStop(0, card.color);
    bar.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = alpha * 0.16;
    ctx.fillStyle = bar;
    ctx.fillRect(x, y, w, 46);
    ctx.restore();

    ctx.globalAlpha = alpha;

    roundedRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, 14);
    ctx.strokeStyle = hovered ? card.color : 'rgba(15,61,92,.16)';
    ctx.lineWidth = hovered ? 2 : 1.2;
    ctx.stroke();

    drawPerkIcon(card.icon, x + w / 2, y + 52, card.color);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    setFont(10, 'bold');
    ctx.fillStyle = card.color;
    trackedText(card.title, x + w / 2, y + 96, 0.4);

    setFont(7, 'bold');
    ctx.fillStyle = 'rgba(21,85,118,.6)';
    const words = card.hint.split(' ');
    let line = '';
    let lineY = y + 118;
    for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (trackedWidth(test, 0.6) > w - 22 && line) {
            trackedText(line, x + w / 2, lineY, 0.6);
            line = word;
            lineY += 12;
        } else {
            line = test;
        }
    }
    if (line) trackedText(line, x + w / 2, lineY, 0.6);

    ctx.restore();
}

function drawPerkOffer() {
    if (!perkState.offering && !perkState.pickedAt) return;

    const now = performance.now();
    const sincePick = perkState.pickedAt ? now - perkState.pickedAt : 0;

    // Короткое подтверждение выбора, затем карточки уезжают.
    if (perkState.pickedAt && sincePick > 320) return;

    const alpha = perkState.pickedAt
        ? Math.max(0, 1 - sincePick / 320)
        : Math.min(1, (now - perkState.offerReadyAt + 350) / 200);

    ctx.save();
    ctx.fillStyle = `rgba(6,26,44,${0.42 * alpha})`;
    ctx.fillRect(0, 0, 400, 600);
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = alpha;

    setFont(9, 'bold');
    ctx.fillStyle = 'rgba(255,255,255,.72)';
    trackedText('ВЫБЕРИ УСИЛЕНИЕ', 200, 132, 2.4);

    ctx.restore();

    for (let i = 0; i < 3; i++) {
        if (perkState.offerCards[i]) drawPerkCard(perkState.offerCards[i], i, alpha);
    }
}

function drawWorld() {
    verticalPlatforms.forEach(drawVerticalPlatform);
    fallingPlatforms.forEach(drawPlatform);
    platforms.forEach(drawPlatform);
    springs.forEach(drawSpring);
    coins.forEach(drawCoin);
    lifePickups.forEach(drawLifePickup);
    birds.forEach(drawBird);
    drawPlayer();
}

function draw(timestamp) {
    const dt = lastFrameTime
        ? Math.min((timestamp - lastFrameTime) / (1000 / 60), 2)
        : 1;
    lastFrameTime = timestamp;

    updateScreenShake(dt);
    updateHud(dt);

    if (currentState === STATE.MENU) {
        updateMenu(dt);
        drawMenu();
    } else {
        drawBackground();
        drawSnow(dt);
        drawWindStreaks();

        ctx.save();
        if (currentState !== STATE.PAUSE) ctx.translate(screenShake.x, screenShake.y);

        drawWorld();

        if (currentState === STATE.PLAYING || currentState === STATE.PAUSE) {
            drawDangerVignette();
        }

        ctx.restore();

        if (currentState !== STATE.GAMEOVER) drawHud();

        if (currentState === STATE.PAUSE) drawPauseMenu();
        else if (currentState === STATE.GAMEOVER) drawGameOver();
        else drawPerkOffer();
    }

    update(dt);

    jumpButton.disabled = currentState !== STATE.PLAYING || !doubleJumpAvailable;

    requestAnimationFrame(draw);
}

/* ---------- запуск ---------- */

soundButton.addEventListener('click', () => toggleSound());
syncSoundButton();

fullscreenButton.addEventListener('click', async () => {
    try {
        if (!document.fullscreenElement) {
            if (gameStage.requestFullscreen) await gameStage.requestFullscreen();
            else fullscreenButton.title = 'Полноэкранный режим не поддерживается';
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.error('Не удалось переключить полноэкранный режим:', error);
    }
});

document.addEventListener('fullscreenchange', () => {
    const isFullscreen = document.fullscreenElement === gameStage;
    fullscreenButton.textContent = isFullscreen ? '×' : '⛶';
    fullscreenButton.setAttribute('aria-label',
        isFullscreen ? 'Выйти из полноэкранного режима' : 'Включить полноэкранный режим');
});

requestAnimationFrame(draw);
</script>
</body>
