<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Моряка Jump</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 12px 0;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #gameStage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }
    #game {
        display: block;
        width: min(600px, 90vw, calc((100dvh - 90px) * 2 / 3));
        height: auto;
        aspect-ratio: 2 / 3;
        background: #f0f0f0;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(0,0,0,.5);
        cursor: pointer;
        touch-action: none;
    }
    #gameStage:fullscreen {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        gap: 0;
        background: #222;
    }
    #gameStage:fullscreen #game {
        width: min(100vw, calc(100dvh * 2 / 3));
        height: min(100dvh, calc(100vw * 3 / 2));
        max-width: none;
        max-height: none;
        border-radius: 0;
    }
    #fullscreenButton {
        width: 52px;
        height: 44px;
        flex: 0 0 auto;
        border: 1px solid rgba(255,255,255,.6);
        border-radius: 12px;
        background: rgba(30,30,30,.75);
        color: #fff;
        font: 28px Arial, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
    }
    #fullscreenButton:active { background: rgba(80,80,80,.9); }
    #gameStage:fullscreen #fullscreenButton {
        position: fixed;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 10;
    }
    #touchControls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(18px, env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-between;
        padding: 0 22px;
        pointer-events: none;
    }
    .touchButton {
        width: 72px;
        height: 72px;
        border: 2px solid rgba(255,255,255,.75);
        border-radius: 50%;
        background: rgba(30,30,30,.42);
        color: white;
        font: bold 34px Arial, sans-serif;
        pointer-events: auto;
        touch-action: none;
    }
    .touchButton:active { background: rgba(255,255,255,.35); }
    @media (hover: hover) and (pointer: fine) {
        #touchControls { display: none; }
    }
</style>
</head>
<body>
<div id="gameStage">
    <canvas id="game" width="400" height="600"></canvas>
    <button id="fullscreenButton" type="button" aria-label="Включить полноэкранный режим">⛶</button>
</div>

<div id="touchControls" aria-label="Управление">
    <button class="touchButton" id="leftButton" aria-label="Влево">←</button>
    <button class="touchButton" id="rightButton" aria-label="Вправо">→</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const gameStage = document.getElementById('gameStage');
const fullscreenButton = document.getElementById('fullscreenButton');

// Положите character.png в ту же папку, что и этот HTML-файл.
const characterImage = new Image();
characterImage.src = 'character.png';

fullscreenButton.addEventListener('click', async () => {
    try {
        if (!document.fullscreenElement) {
            if (gameStage.requestFullscreen) {
                await gameStage.requestFullscreen();
            } else {
                fullscreenButton.title = 'Полноэкранный режим не поддерживается этим браузером';
            }
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.error('Не удалось переключить полноэкранный режим:', error);
    }
});

document.addEventListener('fullscreenchange', () => {
    const isFullscreen = document.fullscreenElement === gameStage;
    fullscreenButton.textContent = isFullscreen ? '×' : '⛶';
    fullscreenButton.setAttribute(
        'aria-label',
        isFullscreen ? 'Выйти из полноэкранного режима' : 'Включить полноэкранный режим'
    );
});

const STATE = { MENU: 0, PLAYING: 1, PAUSE: 2, GAMEOVER: 3 };
let currentState = STATE.MENU;
let lastFrameTime = 0;

let player = { x: 185, y: 500, vx: 0, dy: 0, score: 0 };
let platforms = [];
let springs = [];
let coins = [];
let lives = 0;
let nextLifeScore = 10000;
let doubleJumpAvailable = false;
let runCoins = 0;
let highScore = parseInt(localStorage.getItem('doodleHighScore'), 10) || 0;

const keys = {};
const currentTheme = { bg: '#f0f0f0', plat: '#4ECDC4' };

function resetGame() {
    player = { x: 185, y: 500, vx: 0, dy: 0, score: 0 };
    platforms = [{ x: 120, y: 550, w: 160, h: 15, type: 'static' }];
    springs = [];
    coins = [];
    lives = 0;
    nextLifeScore = 10000;
    doubleJumpAvailable = false;
    runCoins = 0;

    for (let i = 0; i < 7; i++) {
        platforms.push(spawnPlatform(500 - i * 100));
    }
}

function spawnPlatform(y) {
    const rand = Math.random();
    const difficultyLevel = Math.floor(player.score / 5000);
    const brokenChance = Math.min(0.4, 0.15 + difficultyLevel * 0.05);
    const movingChance = Math.min(0.4, 0.15 + difficultyLevel * 0.05);

    const type = rand < brokenChance
        ? 'broken'
        : rand < brokenChance + movingChance
            ? 'moving'
            : 'static';

    const sizeLevel = Math.floor(player.score / 5000);
    const sizeFactor = Math.max(0.7, 2 - sizeLevel * 0.25);
    const platformWidth = 70 * sizeFactor;

    const platform = {
        x: Math.random() * (400 - platformWidth),
        y,
        w: platformWidth,
        h: 15,
        type,
        dir: 2 * Math.min(10, 1 + Math.floor(player.score / 2500) * 0.20)
    };

    if (type === 'static' && Math.random() > 0.7) {
        springs.push({ x: platform.x + platform.w / 2 - 10, y: y - 15 });
    }
    if (Math.random() > 0.92) {
        coins.push({ x: platform.x + platform.w / 2, y: y - 25, r: 8 });
    }
    if (Math.random() > 0.985) {
        platform.life = { x: platform.x + platform.w / 2 - 10, y: y - 35 };
    }
    return platform;
}

window.addEventListener('keydown', event => {
    keys[event.code] = true;

    if ((event.code === 'ArrowUp' || event.code === 'KeyW' || event.code === 'Space') &&
        currentState === STATE.PLAYING && doubleJumpAvailable) {
        event.preventDefault();
        player.dy = -15;
        doubleJumpAvailable = false;
    }

    if (currentState === STATE.MENU || currentState === STATE.GAMEOVER) {
        resetGame();
        lastFrameTime = 0;
        currentState = STATE.PLAYING;
    } else if (currentState === STATE.PLAYING && event.code === 'Escape') {
        currentState = STATE.PAUSE;
        lastFrameTime = 0;
    } else if (currentState === STATE.PAUSE && event.code === 'Escape') {
        currentState = STATE.PLAYING;
        lastFrameTime = 0;
    }
});

window.addEventListener('keyup', event => keys[event.code] = false);

canvas.addEventListener('mousedown', event => {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) * canvas.width / rect.width;
    const y = (event.clientY - rect.top) * canvas.height / rect.height;
    if (currentState === STATE.PLAYING && x > 350 && y > 550) {
        currentState = STATE.PAUSE;
    }
});

canvas.addEventListener('touchstart', event => {
    const rect = canvas.getBoundingClientRect();
    const touch = event.changedTouches[0];
    const x = (touch.clientX - rect.left) * canvas.width / rect.width;
    const y = (touch.clientY - rect.top) * canvas.height / rect.height;

    if (currentState === STATE.PLAYING && x > 350 && y > 550) {
        event.preventDefault();
        currentState = STATE.PAUSE;
    }
}, { passive: false });

function bindTouchButton(id, keyCode) {
    const button = document.getElementById(id);

    const press = event => {
        event.preventDefault();
        keys[keyCode] = true;
        if (button.setPointerCapture && event.pointerId !== undefined) {
            button.setPointerCapture(event.pointerId);
        }
    };
    const release = event => {
        event.preventDefault();
        keys[keyCode] = false;
    };

    button.addEventListener('pointerdown', press);
    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', () => keys[keyCode] = false);
}

bindTouchButton('leftButton', 'ArrowLeft');
bindTouchButton('rightButton', 'ArrowRight');

function update(dt) {
    if (currentState !== STATE.PLAYING) return;
    dt = Math.min(dt, 2);

    if (keys.ArrowLeft || keys.KeyA) player.vx -= 1.2 * dt;
    if (keys.ArrowRight || keys.KeyD) player.vx += 1.2 * dt;
    player.vx *= Math.pow(0.85, dt);
    player.x += player.vx * dt;

    player.dy += 0.5464 * dt;
    player.y += player.dy * dt;

    if (player.x < -30) player.x = 400;
    if (player.x > 400) player.x = -30;

    platforms.forEach(platform => {
        if (platform.type === 'broken' && platform.breaking &&
            player.dy < 0 && player.y + 35 <= platform.y) {
            platform.removeAfterBounce = true;
        }

        if (player.dy > 0 && !platform.breaking &&
            player.x + 25 > platform.x && player.x + 10 < platform.x + platform.w &&
            player.y + 35 > platform.y &&
            player.y + 35 < platform.y + platform.h + player.dy) {
            player.y = platform.y - 35;
            player.dy = -12.98;
            doubleJumpAvailable = true;
            if (platform.type === 'broken') platform.breaking = true;
        }

        if (platform.type === 'moving') {
            platform.x += platform.dir * dt;
            if (platform.x <= 0 || platform.x + platform.w >= 400) {
                platform.x = Math.max(0, Math.min(400 - platform.w, platform.x));
                platform.dir *= -1;
            }
        }
    });
    platforms = platforms.filter(platform => !platform.removeAfterBounce);

    springs.forEach(spring => {
        if (player.dy > 0 && player.x + 25 > spring.x && player.x < spring.x + 20 &&
            player.y + 35 > spring.y && player.y + 35 < spring.y + 20) {
            player.dy = -32;
            doubleJumpAvailable = true;
        }
    });

    for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        if (player.x < coin.x + 20 && player.x + 30 > coin.x &&
            player.y < coin.y + 20 && player.y + 30 > coin.y) {
            runCoins++;
            if (runCoins % 10 === 0) lives++;
            coins.splice(i, 1);
        }
    }

    platforms.forEach(platform => {
        if (!platform.life) return;
        const life = platform.life;
        if (player.x < life.x + 20 && player.x + 30 > life.x &&
            player.y < life.y + 20 && player.y + 30 > life.y) {
            lives++;
            platform.life = null;
        }
    });

    if (player.y < 250) {
        const diff = 250 - player.y;
        player.score += diff;

        while (player.score >= nextLifeScore) {
            lives++;
            nextLifeScore += 10000;
        }

        player.y = 250;
        platforms.forEach(platform => platform.y += diff);
        springs.forEach(spring => spring.y += diff);
        coins.forEach(coin => coin.y += diff);
    }

    platforms = platforms.filter(platform => platform.y < 650);
    springs = springs.filter(spring => spring.y < 650);
    coins = coins.filter(coin => coin.y < 650);

    while (platforms.length < 8) {
        const lastPlatformY = platforms.length
            ? Math.min(...platforms.map(platform => platform.y))
            : 550;
        platforms.push(spawnPlatform(lastPlatformY - 100));
    }

    if (player.y > 600 && lives > 0) {
        lives--;
        player.y = 500;
        player.dy = -8.5;
        doubleJumpAvailable = true;
    } else if (player.y > 600) {
        currentState = STATE.GAMEOVER;
        if (Math.floor(player.score) > highScore) {
            highScore = Math.floor(player.score);
            localStorage.setItem('doodleHighScore', highScore);
        }
    }
}

function drawCloud(x, y, scale = 1) {
    ctx.beginPath();
    ctx.arc(x, y, 12 * scale, 0, Math.PI * 2);
    ctx.arc(x + 14 * scale, y - 6 * scale, 16 * scale, 0, Math.PI * 2);
    ctx.arc(x + 31 * scale, y, 12 * scale, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlatform(platform) {
    if (platform.type === 'broken') {
        const wood = ctx.createLinearGradient(
            platform.x, platform.y, platform.x, platform.y + platform.h
        );
        wood.addColorStop(0, platform.breaking ? '#ff9b7a' : '#ff6b5e');
        wood.addColorStop(1, platform.breaking ? '#b83b3b' : '#d94141');

        ctx.fillStyle = wood;
        ctx.shadowColor = 'rgba(0,0,0,.22)';
        ctx.shadowBlur = 5;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(platform.x, platform.y, platform.w, platform.h, 5);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        ctx.strokeStyle = 'rgba(120,35,35,.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(platform.x + 5, platform.y + 5);
        ctx.lineTo(platform.x + platform.w - 5, platform.y + 5);
        ctx.moveTo(platform.x + 8, platform.y + 11);
        ctx.lineTo(platform.x + platform.w - 8, platform.y + 11);
        ctx.stroke();

        ctx.strokeStyle = '#702b2b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(platform.x + platform.w * .35, platform.y);
        ctx.lineTo(platform.x + platform.w * .42, platform.y + 5);
        ctx.lineTo(platform.x + platform.w * .37, platform.y + 9);
        ctx.lineTo(platform.x + platform.w * .48, platform.y + 15);
        ctx.stroke();

        if (platform.breaking) {
            ctx.strokeStyle = '#5a2020';
            ctx.beginPath();
            ctx.moveTo(platform.x + platform.w * .7, platform.y);
            ctx.lineTo(platform.x + platform.w * .64, platform.y + 6);
            ctx.lineTo(platform.x + platform.w * .73, platform.y + 10);
            ctx.lineTo(platform.x + platform.w * .68, platform.y + 15);
            ctx.stroke();
        }
    } else {
        ctx.fillStyle = platform.type === 'moving' ? '#4d96ff' : currentTheme.plat;
        ctx.shadowColor = 'rgba(0,0,0,.22)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(platform.x, platform.y, platform.w, platform.h, 7);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
    }

    if (platform.life) {
        ctx.fillStyle = '#3498db';
        ctx.beginPath();
        ctx.arc(platform.life.x + 8, platform.life.y + 8, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px Arial';
        ctx.fillText('+', platform.life.x + 5, platform.life.y + 12);
    }
}

function drawSpring(spring) {
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath();
    ctx.ellipse(spring.x + 10, spring.y + 16, 11, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    const base = ctx.createLinearGradient(
        spring.x, spring.y + 11, spring.x, spring.y + 16
    );
    base.addColorStop(0, '#48566a');
    base.addColorStop(1, '#202a38');
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.roundRect(spring.x + 1, spring.y + 11, 18, 5, 2);
    ctx.fill();

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#34495e';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(spring.x + 4, spring.y + 11);
    ctx.lineTo(spring.x + 7, spring.y + 8);
    ctx.lineTo(spring.x + 13, spring.y + 8);
    ctx.lineTo(spring.x + 16, spring.y + 5);
    ctx.lineTo(spring.x + 13, spring.y + 2);
    ctx.lineTo(spring.x + 7, spring.y + 2);
    ctx.stroke();

    ctx.strokeStyle = '#d9f2ff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(spring.x + 4, spring.y + 10);
    ctx.lineTo(spring.x + 7, spring.y + 8);
    ctx.lineTo(spring.x + 13, spring.y + 8);
    ctx.lineTo(spring.x + 16, spring.y + 5);
    ctx.stroke();

    const top = ctx.createLinearGradient(
        spring.x, spring.y - 2, spring.x, spring.y + 3
    );
    top.addColorStop(0, '#ffb1a8');
    top.addColorStop(.45, '#ff5548');
    top.addColorStop(1, '#b9272e');
    ctx.fillStyle = top;
    ctx.beginPath();
    ctx.roundRect(spring.x + 2, spring.y - 2, 16, 5, 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.beginPath();
    ctx.roundRect(spring.x + 4, spring.y - 1, 5, 1.5, 1);
    ctx.fill();
}

function drawCoin(coin) {
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(coin.x + 1, coin.y + coin.r + 3, coin.r * .8, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    const rim = ctx.createRadialGradient(
        coin.x - 3, coin.y - 4, 1, coin.x, coin.y, coin.r + 2
    );
    rim.addColorStop(0, '#fff4a3');
    rim.addColorStop(.65, '#ffc928');
    rim.addColorStop(1, '#d88900');
    ctx.fillStyle = rim;
    ctx.beginPath();
    ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
    ctx.fill();

    const face = ctx.createLinearGradient(
        coin.x - coin.r, coin.y, coin.x + coin.r, coin.y
    );
    face.addColorStop(0, '#f5a900');
    face.addColorStop(.45, '#ffe66d');
    face.addColorStop(1, '#ffbd18');
    ctx.fillStyle = face;
    ctx.beginPath();
    ctx.arc(coin.x, coin.y, coin.r * .72, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#d88900';
    ctx.font = `bold ${coin.r + 3}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', coin.x, coin.y + 1);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath();
    ctx.ellipse(coin.x - 3, coin.y - 4, 2, 3.5, -.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlayer() {
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath();
    ctx.ellipse(player.x + 15, player.y + 34, 15, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (characterImage.complete && characterImage.naturalWidth > 0) {
        ctx.drawImage(characterImage, player.x - 5, player.y - 8, 40, 40);
        return;
    }

    const gradient = ctx.createLinearGradient(
        player.x, player.y, player.x + 30, player.y + 30
    );
    gradient.addColorStop(0, '#ff7b72');
    gradient.addColorStop(1, '#e63946');

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.roundRect(player.x, player.y, 30, 30, 9);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(player.x + 10, player.y + 11, 4, 0, Math.PI * 2);
    ctx.arc(player.x + 21, player.y + 11, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(player.x + 11, player.y + 12, 1.8, 0, Math.PI * 2);
    ctx.arc(player.x + 22, player.y + 12, 1.8, 0, Math.PI * 2);
    ctx.fill();
}

function drawCounters() {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.shadowColor = 'rgba(30,50,70,.18)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;
    ctx.beginPath();
    ctx.roundRect(8, 8, 190, 78, 12);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 13px Arial';
    ctx.fillStyle = '#64748b';
    ctx.fillText('СЧЁТ', 20, 25);
    ctx.fillText('ЖИЗНИ', 20, 49);
    ctx.fillText('ДОП. ПРЫЖОК', 20, 73);

    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#1e293b';
    ctx.fillText(String(Math.floor(player.score)), 180, 25);
    ctx.fillText(String(lives), 125, 49);

    ctx.font = 'bold 13px Arial';
    ctx.fillStyle = '#d99400';
    ctx.fillText(`${runCoins % 10}/10`, 180, 49);

    ctx.font = 'bold 16px Arial';
    ctx.fillStyle = doubleJumpAvailable ? '#16a36a' : '#94a3b8';
    ctx.fillText(doubleJumpAvailable ? 'ГОТОВ' : '—', 180, 73);
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.arc(380, 580, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#334155';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚙', 380, 580);
    ctx.restore();
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(15,23,42,.68)';
    ctx.fillRect(0, 0, 400, 600);

    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.3)';
    ctx.shadowBlur = 24;
    ctx.beginPath();
    ctx.roundRect(45, 145, 310, 310, 22);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = '#fff0ed';
    ctx.beginPath();
    ctx.arc(200, 195, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e63946';
    ctx.font = 'bold 34px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', 200, 195);

    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 27px Arial';
    ctx.fillText('ИГРА ОКОНЧЕНА', 200, 246);

    ctx.fillStyle = '#64748b';
    ctx.font = '15px Arial';
    ctx.fillText('ВАШ РЕЗУЛЬТАТ', 200, 286);

    ctx.fillStyle = '#2563eb';
    ctx.font = 'bold 36px Arial';
    ctx.fillText(String(Math.floor(player.score)), 200, 322);

    ctx.fillStyle = '#64748b';
    ctx.font = '15px Arial';
    ctx.fillText('ЛУЧШИЙ РЕЗУЛЬТАТ', 200, 365);

    ctx.fillStyle = '#d99400';
    ctx.font = 'bold 22px Arial';
    ctx.fillText(String(highScore), 200, 393);

    ctx.fillStyle = '#475569';
    ctx.font = '15px Arial';
    ctx.fillText('Нажмите любую клавишу, чтобы сыграть снова', 200, 430);
    ctx.restore();
}

function drawPauseMenu() {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
    ctx.fillRect(0, 0, 400, 600);

    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    ctx.beginPath();
    ctx.roundRect(38, 112, 324, 376, 24);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(38, 112, 324, 112, 24);
    ctx.clip();

    const header = ctx.createLinearGradient(38, 112, 362, 224);
    header.addColorStop(0, 'rgba(79,70,229,.76)');
    header.addColorStop(1, 'rgba(37,99,235,.76)');
    ctx.fillStyle = header;
    ctx.fillRect(38, 112, 324, 112);

    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.beginPath();
    ctx.arc(322, 126, 56, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(76, 222, 36, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.beginPath();
    ctx.arc(200, 151, 27, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(191, 139, 6, 24, 3);
    ctx.roundRect(203, 139, 6, 24, 3);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('ПАУЗА', 200, 198);
    ctx.restore();

    ctx.save();
    ctx.fillStyle = '#64748b';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px Arial';
    ctx.fillText('ТЕКУЩИЙ РЕЗУЛЬТАТ', 200, 258);

    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 34px Arial';
    ctx.fillText(String(Math.floor(player.score)), 200, 295);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(72, 326);
    ctx.lineTo(328, 326);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = '#fff8e1';
    ctx.beginPath();
    ctx.arc(112, 365, 23, 0, Math.PI * 2);
    ctx.fill();

    const coinGradient = ctx.createRadialGradient(106, 358, 2, 112, 365, 17);
    coinGradient.addColorStop(0, '#fff4a3');
    coinGradient.addColorStop(.65, '#ffc928');
    coinGradient.addColorStop(1, '#d88900');
    ctx.fillStyle = coinGradient;
    ctx.beginPath();
    ctx.arc(112, 365, 14, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#9a6400';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 112, 366);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#64748b';
    ctx.font = 'bold 12px Arial';
    ctx.fillText('МОНЕТЫ ЗА ПОПЫТКУ', 151, 357);
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 20px Arial';
    ctx.fillText(String(runCoins), 151, 380);
    ctx.restore();

    ctx.save();
    ctx.fillStyle = '#f1f5f9';
    ctx.beginPath();
    ctx.roundRect(67, 408, 266, 42, 12);
    ctx.fill();

    ctx.fillStyle = '#475569';
    ctx.font = '14px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Нажмите ESC, чтобы продолжить', 200, 429);
    ctx.restore();
}

function drawMenu() {
    const sea = ctx.createLinearGradient(0, 0, 0, 600);
    sea.addColorStop(0, '#72d6df');
    sea.addColorStop(1, '#b8f1e8');
    ctx.fillStyle = sea;
    ctx.fillRect(0, 0, 400, 600);

    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.beginPath();
    ctx.arc(65, 95, 44, 0, Math.PI * 2);
    ctx.arc(320, 125, 62, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.28)';
    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(200, 390 + i * 32, 240, 13, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = '#073b4c';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 35px Arial';
    ctx.fillText('Моряка', 200, 230);

    ctx.fillStyle = '#087e8b';
    ctx.font = 'bold 52px Arial';
    ctx.fillText('JUMP', 200, 285);

    ctx.fillStyle = '#164e63';
    ctx.font = '18px Arial';
    ctx.fillText('Прыгайте выше и собирайте монеты!', 200, 345);

    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.beginPath();
    ctx.roundRect(72, 405, 256, 54, 16);
    ctx.fill();

    ctx.fillStyle = '#075985';
    ctx.font = 'bold 19px Arial';
    ctx.fillText('Нажмите любую клавишу', 200, 432);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
}

function draw(timestamp) {
    const dt = lastFrameTime
        ? Math.min((timestamp - lastFrameTime) / (1000 / 60), 2)
        : 1;
    lastFrameTime = timestamp;

    const background = ctx.createLinearGradient(0, 0, 0, 600);
    background.addColorStop(0, 'rgba(240,240,240,.84)');
    background.addColorStop(1, 'rgba(220,238,255,.72)');
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, 400, 600);

    ctx.fillStyle = 'rgba(255,255,255,.22)';
    drawCloud(55, 120, 1);
    drawCloud(285, 210, .8);
    drawCloud(170, 390, .65);

    if (currentState === STATE.MENU) {
        drawMenu();
    } else if (currentState === STATE.PAUSE) {
        drawPauseMenu();
    } else if (currentState === STATE.GAMEOVER) {
        drawGameOver();
    } else {
        platforms.forEach(drawPlatform);
        springs.forEach(drawSpring);
        coins.forEach(drawCoin);
        drawPlayer();
        drawCounters();
    }

    update(dt);
    requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
